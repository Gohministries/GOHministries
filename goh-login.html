<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">

<title>GOH Ministries | Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.login-box{
  width:100%;
  max-width:410px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:32px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b376d;
  color:#fff;
  font-size:25px;
  font-weight:bold;
}

h1{
  text-align:center;
  font-size:24px;
  color:#0b376d;
}

.subtitle{
  text-align:center;
  margin:7px 0 28px;
  color:#64748b;
  font-size:14px;
}

label{
  display:block;
  margin:0 0 7px;
  font-size:14px;
  font-weight:bold;
}

.field{
  margin-bottom:18px;
}

input{
  width:100%;
  height:48px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:0 14px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#0b376d;
  box-shadow:0 0 0 3px rgba(11,55,109,.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.show-btn{
  position:absolute;
  right:0;
  top:0;
  height:48px;
  width:50px;
  border:0;
  background:transparent;
  color:#64748b;
  cursor:pointer;
  font-size:13px;
}

.login-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  background:#082952;
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:9px;
  font-size:14px;
  line-height:1.4;
}

.message.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
}

.message.success{
  display:block;
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0;
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#94a3b8;
  font-size:12px;
}

@media(max-width:480px){
  .login-box{
    padding:25px 20px;
    border-radius:14px;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">GOH</div>

  <h1>GOH Ministries</h1>

  <div class="subtitle">
    Church Administration
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="field">
      <label for="username">Username</label>

      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
        required
      >
    </div>

    <div class="field">
      <label for="password">Password</label>

      <div class="password-wrap">

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

        <button
          type="button"
          class="show-btn"
          id="showPassword"
        >Show</button>

      </div>
    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      Login
    </button>

  </form>

  <div class="footer">
    GOH Ministries Administration
  </div>

</div>

<script>

const AUTH_API =
  "https://goh-admin-auth.createlk.workers.dev";

const TOKEN_KEY =
  "goh_admin_token";

const USER_KEY =
  "goh_admin_user";


// ===============================
// ELEMENTS
// ===============================

const form =
  document.getElementById("loginForm");

const username =
  document.getElementById("username");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");

const showPassword =
  document.getElementById("showPassword");


// ===============================
// MESSAGE
// ===============================

function showMessage(text,type="error"){

  message.textContent = text;

  message.className =
    "message " + type;
}

function clearMessage(){

  message.textContent = "";

  message.className =
    "message";
}


// ===============================
// SHOW PASSWORD
// ===============================

showPassword.addEventListener(
  "click",
  () => {

    const visible =
      password.type === "text";

    password.type =
      visible ? "password" : "text";

    showPassword.textContent =
      visible ? "Show" : "Hide";
  }
);


// ===============================
// REDIRECT
// ===============================

function redirectByRole(role){

  if(role === "admin"){

    location.href =
      "admin-dashboard.html";

    return;
  }

  if(role === "finance"){

    location.href =
      "finance-dashboard.html";

    return;
  }

  if(role === "auditor"){

    location.href =
      "audit-dashboard.html";

    return;
  }

  throw new Error(
    "Unknown account role"
  );
}


// ===============================
// LOGIN
// ===============================

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearMessage();

    const user =
      username.value.trim();

    const pass =
      password.value;

    if(!user || !pass){

      showMessage(
        "Enter your username and password."
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Signing in...";

    try{

      const response =
        await fetch(
          AUTH_API + "/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              username:user,
              password:pass
            })
          }
        );


      let data;

      try{

        data =
          await response.json();

      }catch{

        throw new Error(
          "Invalid server response."
        );
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Login failed."
        );
      }


      if(
        !data.success ||
        !data.token ||
        !data.user
      ){

        throw new Error(
          "Invalid login response."
        );
      }


      const role =
        data.user.role;


      if(
        role !== "admin" &&
        role !== "finance" &&
        role !== "auditor"
      ){

        throw new Error(
          "Invalid account role."
        );
      }


      // Save verified session
      sessionStorage.setItem(
        TOKEN_KEY,
        data.token
      );

      sessionStorage.setItem(
        USER_KEY,
        JSON.stringify(
          data.user
        )
      );


      showMessage(
        "Login successful. Opening administration...",
        "success"
      );


      password.value = "";


      setTimeout(
        () => {

          try{

            redirectByRole(role);

          }catch(error){

            sessionStorage.removeItem(
              TOKEN_KEY
            );

            sessionStorage.removeItem(
              USER_KEY
            );

            showMessage(
              error.message
            );

            loginBtn.disabled =
              false;

            loginBtn.textContent =
              "Login";
          }

        },
        500
      );


    }catch(error){

      showMessage(
        error.message ||
        "Unable to connect to authentication server."
      );

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";
    }

  }
);


// ===============================
// ALREADY LOGGED IN
// ===============================

async function checkExistingSession(){

  const token =
    sessionStorage.getItem(
      TOKEN_KEY
    );

  if(!token){
    return;
  }

  try{

    const response =
      await fetch(
        AUTH_API + "/me",
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if(!response.ok){

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      sessionStorage.removeItem(
        USER_KEY
      );

      return;
    }


    const data =
      await response.json();


    if(
      data.success &&
      data.user &&
      data.user.role
    ){

      sessionStorage.setItem(
        USER_KEY,
        JSON.stringify(
          data.user
        )
      );

      redirectByRole(
        data.user.role
      );
    }


  }catch{

    // Stay on login page
  }
}

checkExistingSession();

</script>

</body>
</html>
