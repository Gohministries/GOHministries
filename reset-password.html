<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Forgot Password | GOH Bible Academy</title>

<meta name="description"
content="Reset your GOH Bible Academy student account password.">

<meta name="theme-color" content="#0b376d">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.card{
  width:100%;
  max-width:430px;
  padding:30px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  color:#0b376d;
  font-size:27px;
  font-weight:800;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin-top:8px;
  margin-bottom:28px;
}

label{
  display:block;
  margin:16px 0 7px;
  font-weight:700;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#0b376d;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}

.message.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}

.info{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:#f2f4f7;
  color:#667085;
  font-size:12px;
  line-height:1.5;
}

.links{
  text-align:center;
  margin-top:22px;
  font-size:14px;
}

.links a{
  color:#0b376d;
  font-weight:700;
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#667085;
  font-size:13px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    GOH Bible Academy
  </div>

  <div class="subtitle">
    Reset Your Password
  </div>

  <form id="forgotForm">

    <label for="email">
      Email Address
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Enter your registered email"
      required
    >

    <button
      id="button"
      type="submit"
    >
      Send Reset Link
    </button>

  </form>

  <div
    id="message"
    class="message"
  ></div>

  <div class="info">
    Enter the email address you used to register.
    If the account exists, password-reset instructions
    will be sent to that email.
  </div>

  <div class="links">
    Remember your password?
    <a href="login.html">
      Login
    </a>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to GOH Bible Academy
  </a>

</div>

<script>

const API =
  "https://goh-auth-api.createlk.workers.dev";

const form =
  document.getElementById("forgotForm");

const button =
  document.getElementById("button");

const message =
  document.getElementById("message");

function showMessage(text,type){

  message.className =
    "message " + type;

  message.textContent = text;
}

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const email =
      document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

    if(!email){

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;
    }

    button.disabled = true;
    button.textContent =
      "Sending...";

    try{

      const response =
        await fetch(
          API + "/forgot-password",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              email:email
            })
          }
        );

      const data =
        await response.json();

      if(!response.ok){

        showMessage(
          data.error ||
          "Unable to process your request.",
          "error"
        );

        return;
      }

      showMessage(
        data.message ||
        "If the account exists, reset instructions will be sent.",
        "success"
      );

      form.reset();

    }catch(error){

      console.error(error);

      showMessage(
        "Unable to connect to GOH Bible Academy. Please try again.",
        "error"
      );

    }finally{

      button.disabled = false;
      button.textContent =
        "Send Reset Link";

    }

  }
);

</script>

</body>
</html>
