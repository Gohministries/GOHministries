<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | GOH Bible Academy</title>
<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f6f8fb;
color:#172033
}
a{text-decoration:none;color:inherit}
.container{width:min(500px,92%);margin:auto}

header{
height:68px;
background:#fff;
border-bottom:1px solid #e5eaf1;
display:flex;
align-items:center
}

.nav{
display:flex;
align-items:center;
justify-content:space-between
}

.brand{display:flex;align-items:center;gap:10px}
.logo{
width:41px;height:41px;
display:grid;place-items:center;
border-radius:10px;
background:#0b376d;
color:#fff;font-size:12px;font-weight:900
}
.brand strong{display:block;color:#0b376d;font-size:15px}
.brand small{
display:block;color:#667085;
font-size:8px;font-weight:700
}
.back{color:#0b376d;font-size:13px;font-weight:700}

main{padding:50px 0}

.card{
background:#fff;
padding:30px;
border:1px solid #e3e8ef;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.05)
}

.heading{text-align:center;margin-bottom:25px}
.label{
color:#0b376d;
font-size:10px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase
}
h1{
font-family:Georgia,serif;
font-size:32px;
line-height:1.2;
margin:7px 0
}
.heading p,.help,.login{color:#667085;font-size:12px}

.group{margin-bottom:16px}

label{
display:block;
font-size:12px;
font-weight:800;
margin-bottom:6px
}

input{
width:100%;
height:46px;
padding:0 12px;
border:1px solid #d5dce6;
border-radius:8px;
font:inherit;
outline:none
}

input:focus{
border-color:#0b376d;
box-shadow:0 0 0 3px rgba(11,55,109,.08)
}

.help{margin-top:4px;font-size:10px}

.password{position:relative}
.password input{padding-right:55px}

.show{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:0;
background:none;
color:#0b376d;
font-size:11px;
font-weight:700;
cursor:pointer
}

.terms{
display:flex;
gap:8px;
align-items:flex-start;
margin:4px 0 18px;
font-size:11px;
color:#667085
}

.terms input{width:16px;height:16px;flex:none}
.terms a{color:#0b376d;font-weight:700}

button.submit{
width:100%;
height:47px;
border:0;
border-radius:8px;
background:#0b376d;
color:#fff;
font-weight:800;
cursor:pointer
}

button.submit:disabled{opacity:.6}

.message{
display:none;
margin-top:14px;
padding:10px;
border-radius:7px;
font-size:11px;
text-align:center
}

.error{display:block;background:#fff0f0;color:#b42318}
.success{display:block;background:#ecfdf3;color:#027a48}

.login{
margin-top:20px;
padding-top:17px;
border-top:1px solid #e8ecf1;
text-align:center
}

.login a{color:#0b376d;font-weight:800}

footer{
padding:25px;
text-align:center;
color:#8192a8;
font-size:10px
}

@media(max-width:480px){
.card{padding:24px 20px}
h1{font-size:29px}
}
</style>
</head>

<body>

<header>
<div class="container nav">

<a href="index.html" class="brand">
<div class="logo">GOH</div>
<div>
<strong>GOH Bible Academy</strong>
<small>GATE OF HEAVEN MINISTRIES</small>
</div>
</a>

<a href="index.html" class="back">Home</a>

</div>
</header>

<main>
<div class="container">

<div class="card">

<div class="heading">
<div class="label">Student Registration</div>
<h1>Create Your Account</h1>
<p>Register to begin your Biblical Studies journey.</p>
</div>

<form id="registerForm">

<div class="group">
<label>Full Name *</label>
<input
id="name"
name="name"
type="text"
placeholder="Enter your full name"
autocomplete="name"
required>
</div>

<div class="group">
<label>Email Address *</label>
<input
id="email"
name="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required>
</div>

<div class="group">
<label>Password *</label>
<div class="password">
<input
id="password"
name="password"
type="password"
placeholder="Create a password"
minlength="6"
required>
<button type="button" class="show"
onclick="showPass('password',this)">
Show
</button>
</div>
</div>

<div class="group">
<label>Confirm Password *</label>
<div class="password">
<input
id="confirm"
type="password"
placeholder="Confirm your password"
minlength="6"
required>
<button type="button" class="show"
onclick="showPass('confirm',this)">
Show
</button>
</div>
</div>

<div class="terms">
<input id="agree" type="checkbox" required>
<label for="agree">
I agree to the
<a href="terms.html">Terms</a> and
<a href="privacy.html">Privacy Policy</a>.
</label>
</div>

<button class="submit" id="submitBtn">
Create Account
</button>

<div id="message" class="message"></div>

</form>

<div class="login">
Already have an account?
<a href="login.html">Sign In</a>
</div>

</div>
</div>
</main>

<footer>
© 2026 GOH Bible Academy
</footer>

<script>
function showPass(id,btn){
const input=document.getElementById(id);
input.type=input.type==="password"?"text":"password";
btn.textContent=input.type==="password"?"Show":"Hide";
}

document.getElementById("registerForm").addEventListener("submit",async e=>{
e.preventDefault();

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");

if(password.length<6){
msg.className="message error";
msg.textContent="Password must be at least 6 characters.";
return;
}

if(password!==confirm){
msg.className="message error";
msg.textContent="Passwords do not match.";
return;
}

btn.disabled=true;
btn.textContent="Creating Account...";

try{

const res=await fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email,password})
});

const data=await res.json().catch(()=>({}));

if(!res.ok)
throw new Error(data.message||data.error||"Registration failed.");

msg.className="message success";
msg.textContent=data.message||"Registration successful.";

setTimeout(()=>location.href="login.html",1200);

}catch(err){

msg.className="message error";
msg.textContent=err.message;

}finally{

btn.disabled=false;
btn.textContent="Create Account";

}
});
</script>

</body>
</html>
