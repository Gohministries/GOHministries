<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Finance</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b}
header{height:56px;background:#0b376d;color:#fff;display:flex;align-items:center;padding:0 15px}
.head{width:100%;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:36px;height:36px;border-radius:50%;background:#fff;color:#0b376d;display:grid;place-items:center;font-weight:800;font-size:11px}
.brand h1{font-size:15px}.brand p{font-size:10px;opacity:.7}
.menuBtn{border:0;background:#ffffff22;color:#fff;padding:8px 12px;border-radius:7px;font-size:18px}
.menu{display:none;position:absolute;right:14px;top:52px;background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:6px;width:210px;box-shadow:0 8px 25px #0002;z-index:20}
.menu.show{display:block}
.menu button{width:100%;border:0;background:none;text-align:left;padding:9px;border-radius:6px}
.menu button:hover{background:#e0f2fe}
main{max-width:1200px;margin:auto;padding:18px}
.page{display:none}.page.active{display:block}
.title{color:#0b376d;font-size:19px;margin-bottom:15px}
.card,.form,.table{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:15px;box-shadow:0 1px 4px #0000000d}
.notice{padding:11px;border-radius:8px;margin-bottom:15px;font-size:13px;display:none}
.notice.show{display:block}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.info{background:#e0f2fe;color:#075985}
.role{display:inline-block;background:#e0f2fe;color:#0369a1;padding:4px 9px;border-radius:20px;font-size:11px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:7px;background:#fff;font-size:13px}
textarea{min-height:85px;resize:vertical}
.full{grid-column:1/-1}
.slip{background:#f8fafc;border:1px dashed #94a3b8;padding:12px;border-radius:8px}
.slip small{display:block;color:#64748b;margin-top:5px}
.btn{border:0;border-radius:7px;padding:9px 13px;font-size:12px;font-weight:600;margin:5px 4px 0 0}
.primary{background:#0b376d;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
.btn:disabled{opacity:.5}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:12px}
th{background:#f8fafc;color:#0b376d}
.status{display:inline-block;padding:4px 8px;border-radius:15px;font-size:10px;font-weight:700}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.empty{text-align:center;color:#64748b;padding:20px}
.actions{white-space:nowrap}
footer{text-align:center;color:#64748b;font-size:11px;padding:20px}

@media(max-width:650px){
main{padding:12px}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
.brand p{display:none}
}
</style>
</head>

<body>

<header>
<div class="head">

<div class="brand">
<div class="logo">GOH</div>
<div>
<h1>GOH Ministries</h1>
<p>Church Administration</p>
</div>
</div>

<button class="menuBtn" id="menuBtn">☰</button>

<div class="menu" id="menu">
<button onclick="location.href='admin.html'">🏠 Dashboard</button>
<button onclick="location.reload()">💰 Finance</button>
<button id="logout">Logout</button>
</div>

</div>
</header>

<main>

<div id="msg" class="notice"></div>

<section class="page active">

<h2 class="title">💰 Finance</h2>

<div class="card">
<div id="userInfo">Loading user...</div>
</div>

<div id="financeFormBox">

<form class="form" id="financeForm">

<div class="grid">

<div class="field">
<label>Date *</label>
<input id="fDate" type="date" required>
</div>

<div class="field">
<label>Type *</label>
<select id="fType" required>
<option value="">Select</option>
<option>Income</option>
<option>Expense</option>
</select>
</div>

<div class="field">
<label>Category *</label>
<select id="fCategory" required>
<option value="">Select</option>
<option>Tithe</option>
<option>Offering</option>
<option>General Donation</option>
<option>Special Donation</option>
<option>Grant</option>
<option>Foreign Ministry Support</option>
<option>Minister Monthly Support</option>
<option>Pastor / Minister Expenses</option>
<option>Staff / Worker Support</option>
<option>Missionary Work</option>
<option>Evangelism</option>
<option>Bible Ministry</option>
<option>Prayer Ministry</option>
<option>Worship Ministry</option>
<option>Children's Ministry</option>
<option>Youth Ministry</option>
<option>Women's Ministry</option>
<option>Men's Ministry</option>
<option>Media Ministry</option>
<option>Community Assistance</option>
<option>Poor / Family Assistance</option>
<option>Church Building / Construction</option>
<option>Land / Property</option>
<option>Equipment</option>
<option>Maintenance</option>
<option>Utilities</option>
<option>Transport</option>
<option>Church Events</option>
<option>Bank Charges</option>
<option>Administrative Expenses</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Amount (LKR) *</label>
<input id="fAmount" type="number" min=".01" step=".01" required>
</div>

<div class="field">
<label>Payment Method *</label>
<select id="fMethod" required>
<option value="">Select</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Bank Deposit</option>
<option>Cheque</option>
<option>Online Payment</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Reference</label>
<input id="fRef" placeholder="Receipt / bank reference">
</div>

<div class="field full">
<label>Description *</label>
<textarea id="fDesc" required></textarea>
</div>

<div class="field full">
<div class="slip">
<label>Supporting Slip / Receipt *</label>
<input id="fSlip" type="file"
accept=".pdf,.jpg,.jpeg,.png,.webp"
required>
<small>Maximum 10 MB</small>
</div>
</div>

</div>

<button class="btn primary" id="saveBtn">
Save Financial Record
</button>

</form>

</div>

<div class="table">

<h3 style="font-size:14px;margin-bottom:10px">
Financial Records
</h3>

<div class="tableWrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Category</th>
<th>Amount</th>
<th>Status</th>
<th>Slip</th>
<th>Action</th>
</tr>
</thead>

<tbody id="financeBody">
<tr>
<td colspan="7" class="empty">Loading...</td>
</tr>
</tbody>

</table>

</div>
</div>

</section>

<footer>
© 2026 GOH Ministries · Administration Portal
</footer>

</main>

<script>

const API="https://goh-finance.createlk.workers.dev";

const user=JSON.parse(
sessionStorage.getItem("goh_admin")||"null"
);

const loginType=
sessionStorage.getItem("goh_login_type")||"";

if(!user){
location.href="login.html";
}

const username=
user?.username||"";

const role=
String(user?.role||loginType||"").toLowerCase();

const permissions=user?.permissions||{};

const full=
role==="admin"||
role==="super_admin"||
permissions==="full";

const finance=
full||
role==="finance"||
permissions?.finance===true||
permissions?.donations===true;

const auditor=role==="auditor";


/* USER */

document.getElementById("userInfo").innerHTML=
`<b>${escapeHtml(user?.name||username)}</b>
<br>
<span class="role">${
full?"Administrator":
finance?"Finance Officer":
auditor?"Auditor — Read Only":
"User"
}</span>`;

if(auditor){
document.getElementById("financeFormBox").innerHTML=
`<div class="card info">
<b>Auditor — Read Only</b><br>
You can view all financial records and slips.
You cannot add, edit, delete or approve records.
</div>`;
}

function escapeHtml(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}


/* MESSAGE */

function note(text,type="err"){
const m=document.getElementById("msg");
m.textContent=text;
m.className="notice show "+type;

setTimeout(()=>{
m.className="notice";
},4000);
}


/* MENU */

const menu=document.getElementById("menu");

document.getElementById("menuBtn").onclick=()=>{
menu.classList.toggle("show");
};

document.addEventListener("click",e=>{
if(
!e.target.closest("#menu") &&
!e.target.closest("#menuBtn")
){
menu.classList.remove("show");
}
});


/* LOAD RECORDS */

async function loadRecords(){

const body=document.getElementById("financeBody");

body.innerHTML=
`<tr><td colspan="7" class="empty">Loading records...</td></tr>`;

try{

const r=await fetch(API+"/transactions",{
method:"GET",
headers:{
"X-Admin-Key":username
},
cache:"no-store"
});

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{
throw new Error(
"Server returned an invalid response."
);
}

if(!r.ok){
throw new Error(
data.error||`Server error ${r.status}`
);
}

const records=data.records||[];

if(!records.length){

body.innerHTML=
`<tr>
<td colspan="7" class="empty">
No financial records available.
</td>
</tr>`;

return;
}

body.innerHTML="";

records.forEach(row=>{

const tr=document.createElement("tr");

const amount=
Number(row.amount||0).toLocaleString(
"en-LK",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

const status=
String(row.status||"Pending");

const statusClass=
status.toLowerCase()==="approved"
?"approved":"pending";

tr.innerHTML=`

<td>${escapeHtml(row.date)}</td>

<td>${escapeHtml(row.type)}</td>

<td>${escapeHtml(row.category)}</td>

<td>LKR ${amount}</td>

<td>
<span class="status ${statusClass}">
${escapeHtml(status)}
</span>
</td>

<td>
<button class="btn gray"
onclick="viewSlip('${encodeURIComponent(row.id)}')">
View
</button>
</td>

<td class="actions">

${
!auditor && status!=="Approved" && full
?
`<button class="btn green"
onclick="approveRecord('${encodeURIComponent(row.id)}')">
Approve
</button>`
:""
}

${
!auditor && full
?
`<button class="btn red"
onclick="deleteRecord('${encodeURIComponent(row.id)}')">
Delete
</button>`
:""
}

</td>
`;

body.appendChild(tr);

});

}catch(e){

console.error(e);

body.innerHTML=
`<tr>
<td colspan="7" class="empty">
Unable to load records.<br>
<small>${escapeHtml(e.message)}</small>
</td>
</tr>`;

}

}


/* VIEW SLIP */

async function viewSlip(encodedId){

const id=decodeURIComponent(encodedId);

try{

const r=await fetch(
API+"/transactions/"+encodeURIComponent(id)+"/slip",
{
headers:{
"X-Admin-Key":username
}
}
);

if(!r.ok){

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{}

throw new Error(
data.error||"Unable to open slip"
);
}

const blob=await r.blob();

const url=URL.createObjectURL(blob);

window.open(url,"_blank");

setTimeout(()=>{
URL.revokeObjectURL(url);
},60000);

}catch(e){

console.error(e);

note(e.message,"err");

}

}


/* APPROVE */

async function approveRecord(encodedId){

const id=decodeURIComponent(encodedId);

if(!confirm(
"Approve this financial record?"
))return;

try{

const r=await fetch(
API+"/transactions/"+encodeURIComponent(id)+"/approve",
{
method:"POST",
headers:{
"X-Admin-Key":username
}
}
);

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{}

if(!r.ok){

throw new Error(
data.error||"Approval failed"
);
}

note(
"Financial record approved successfully.",
"ok"
);

/*
IMPORTANT:
Reload table AFTER successful approval.
*/

await loadRecords();

}catch(e){

console.error(e);

note(e.message,"err");

}

}


/* DELETE */

async function deleteRecord(encodedId){

const id=decodeURIComponent(encodedId);

if(!confirm(
"Delete this financial record permanently?"
))return;

try{

const r=await fetch(
API+"/transactions/"+encodeURIComponent(id),
{
method:"DELETE",
headers:{
"X-Admin-Key":username
}
}
);

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{}

if(!r.ok){

throw new Error(
data.error||"Delete failed"
);
}

note(
"Financial record deleted.",
"ok"
);

await loadRecords();

}catch(e){

console.error(e);

note(e.message,"err");

}

}


/* CREATE */

if(document.getElementById("financeForm")){

document.getElementById("financeForm").onsubmit=
async function(e){

e.preventDefault();

const file=
document.getElementById("fSlip").files[0];

if(!file){
note("Supporting slip is required.");
return;
}

if(file.size>10*1024*1024){
note("Slip must be smaller than 10 MB.");
return;
}

const btn=
document.getElementById("saveBtn");

btn.disabled=true;
btn.textContent="Saving...";

try{

const form=new FormData();

form.append(
"date",
document.getElementById("fDate").value
);

form.append(
"type",
document.getElementById("fType").value
);

form.append(
"category",
document.getElementById("fCategory").value
);

form.append(
"amount",
document.getElementById("fAmount").value
);

form.append(
"payment_method",
document.getElementById("fMethod").value
);

form.append(
"reference",
document.getElementById("fRef").value
);

form.append(
"description",
document.getElementById("fDesc").value
);

form.append("slip",file);

const r=await fetch(
API+"/transactions",
{
method:"POST",
headers:{
"X-Admin-Key":username
},
body:form
}
);

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{
throw new Error(
"Server returned an invalid response."
);
}

if(!r.ok){

throw new Error(
data.error||"Financial record failed"
);
}

note(
data.status==="Approved"
?"Financial record approved."
:"Financial account submitted for approval.",
"ok"
);

this.reset();

await loadRecords();

}catch(e){

console.error(e);

note(e.message,"err");

}finally{

btn.disabled=false;
btn.textContent="Save Financial Record";

}

};

}


/* LOGOUT */

document.getElementById("logout").onclick=async()=>{

if(!confirm("Logout from administration?"))
return;

try{

await fetch(
"https://goh-admin-auth.createlk.workers.dev/logout",
{
method:"POST",
headers:{
"X-Admin-Key":username
}
}
);

}catch(e){}

sessionStorage.removeItem("goh_admin");
sessionStorage.removeItem("goh_login_type");

location.href="login.html";

};


/* INITIAL */

const today=new Date()
.toISOString()
.slice(0,10);

const dateInput=
document.getElementById("fDate");

if(dateInput)
dateInput.value=today;

loadRecords();

</script>

</body>
</html>
