<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOH Ministries Finance</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:16px}
main{max-width:1000px;margin:auto;padding:16px}
.box{background:#fff;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
input,select,button{width:100%;padding:11px;margin:6px 0;border-radius:8px;font:inherit}
input,select{border:1px solid #d5d9e2}
button{border:0;background:#155eef;color:white;font-weight:bold;cursor:pointer}
.logout{width:auto;background:white;color:#155eef}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{width:auto;background:#e8edf7;color:#172033}
.tabs button.active{background:#155eef;color:white}
.page{display:none}
.page.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:10px;border-radius:8px;margin-bottom:10px;background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
.table{overflow:auto}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">

<main>
<div class="box" style="max-width:400px;margin:60px auto">

<h2>GOH Ministries Finance</h2>
<p>Administration</p>

<div id="loginMsg" class="msg hidden"></div>

<form id="loginForm">

<input id="email"
type="email"
placeholder="Email"
required>

<input id="password"
type="password"
placeholder="Password"
required>

<button id="loginBtn">Login</button>

</form>

</div>
</main>

</div>


<!-- ADMIN -->
<div id="admin" class="hidden">

<header>
<strong>GOH Ministries Finance</strong>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<p>Logged in as <b id="who"></b></p>

<div class="tabs">
<button class="active" onclick="tab('users',this)">Users</button>
<button onclick="tab('audit',this)">Audit Log</button>
</div>


<!-- USERS -->
<div id="users" class="page active">

<div class="box">

<h3>Create User</h3>

<div id="userMsg" class="msg hidden"></div>

<form id="userForm">

<div class="grid">

<input id="name"
placeholder="Name"
required>

<input id="newEmail"
type="email"
placeholder="Email"
required>

<input id="newPassword"
type="password"
placeholder="Password - minimum 12 characters"
minlength="12"
required>

<select id="role">
<option value="finance">Finance</option>
<option value="viewer">Viewer</option>
<option value="admin">Administrator</option>
</select>

</div>

<button>Create User</button>

</form>
</div>


<div class="box">

<h3>Users</h3>

<div class="table">

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Status</th>
</tr>
</thead>

<tbody id="userList">
<tr><td colspan="4">Loading...</td></tr>
</tbody>

</table>

</div>
</div>

</div>


<!-- AUDIT -->
<div id="audit" class="page">

<div class="box">

<h3>Audit Log</h3>

<button onclick="loadAudit()">Refresh</button>

<div class="table">

<table>

<thead>
<tr>
<th>Date</th>
<th>User</th>
<th>Action</th>
<th>Details</th>
</tr>
</thead>

<tbody id="auditList">
<tr><td colspan="4">Loading...</td></tr>
</tbody>

</table>

</div>
</div>

</div>

</main>
</div>


<script>

const API="https://goh-finance.createlk.workers.dev";
const KEY="goh_token";

const $=id=>document.getElementById(id);

function auth(){
return{
"Content-Type":"application/json",
"Authorization":"Bearer "+localStorage.getItem(KEY)
};
}

function showError(el,text){
el.textContent=text;
el.classList.remove("hidden");
}

function esc(x){
return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");
}


/* LOGIN */

$("loginForm").onsubmit=async e=>{
e.preventDefault();

$("loginBtn").disabled=true;
$("loginBtn").textContent="Logging in...";

try{

const r=await fetch(API+"/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:$("email").value.trim(),
password:$("password").value
})
});

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Invalid email or password");

localStorage.setItem(KEY,d.token);

await start();

}catch(e){

showError($("loginMsg"),e.message);

}finally{

$("loginBtn").disabled=false;
$("loginBtn").textContent="Login";

}
};


/* START */

async function start(){

const r=await fetch(API+"/api/me",{
headers:auth()
});

const d=await r.json();

if(!r.ok||!d.success)
throw Error("Session expired");

if(d.user.role!=="admin")
throw Error("Administrator access required");

$("who").textContent=d.user.name;

$("login").classList.add("hidden");
$("admin").classList.remove("hidden");

loadUsers();
}


/* TABS */

function tab(id,btn){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

$(id).classList.add("active");

document.querySelectorAll(".tabs button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

if(id==="users")loadUsers();
if(id==="audit")loadAudit();

}


/* USERS */

async function loadUsers(){

try{

const r=await fetch(API+"/api/admin/users",{
headers:auth()
});

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Users API not connected");

const users=d.users||[];

$("userList").innerHTML=users.map(u=>`
<tr>
<td>${esc(u.name)}</td>
<td>${esc(u.email)}</td>
<td>${esc(u.role)}</td>
<td>${Number(u.active)?"Active":"Inactive"}</td>
</tr>
`).join("")||`
<tr><td colspan="4">No users</td></tr>
`;

}catch(e){

$("userList").innerHTML=
`<tr><td colspan="4">${esc(e.message)}</td></tr>`;

}
}


/* CREATE USER */

$("userForm").onsubmit=async e=>{

e.preventDefault();

try{

const r=await fetch(API+"/api/admin/users",{
method:"POST",
headers:auth(),
body:JSON.stringify({
name:$("name").value.trim(),
email:$("newEmail").value.trim(),
password:$("newPassword").value,
role:$("role").value,
active:1
})
});

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Unable to create user");

$("userMsg").className="msg";
$("userMsg").textContent="User created successfully.";

$("userForm").reset();

loadUsers();

}catch(e){

showError($("userMsg"),e.message);

}
};


/* AUDIT */

async function loadAudit(){

try{

const r=await fetch(API+"/api/admin/audit",{
headers:auth()
});

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Audit API not connected");

$("auditList").innerHTML=
(d.logs||[]).map(x=>`
<tr>
<td>${esc(x.created_at)}</td>
<td>${esc(x.user_name||"System")}</td>
<td>${esc(x.action)}</td>
<td>${esc(x.details)}</td>
</tr>
`).join("")||
`<tr><td colspan="4">No records</td></tr>`;

}catch(e){

$("auditList").innerHTML=
`<tr><td colspan="4">${esc(e.message)}</td></tr>`;

}
}


/* LOGOUT */

async function logout(){

try{
await fetch(API+"/api/logout",{
method:"POST",
headers:auth()
});
}catch(e){}

localStorage.removeItem(KEY);
location.reload();

}


/* AUTO LOGIN */

(async()=>{
if(localStorage.getItem(KEY)){
try{
await start();
}catch(e){
localStorage.removeItem(KEY);
}
}
})();

</script>

</body>
</html>
