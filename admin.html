<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Login</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

.card{
 width:100%;
 max-width:400px;
 background:#fff;
 padding:28px;
 border-radius:16px;
 box-shadow:0 4px 20px #0001
}

.logo{
 width:60px;
 height:60px;
 margin:0 auto 16px;
 border-radius:14px;
 background:#155eef;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
 font-weight:bold
}

h1{
 text-align:center;
 margin:0 0 6px;
 font-size:23px
}

.sub{
 text-align:center;
 color:#667085;
 font-size:13px;
 margin-bottom:24px
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:14px 0 6px
}

input{
 width:100%;
 padding:13px;
 border:1px solid #d5dbe5;
 border-radius:9px;
 font-size:14px;
 outline:none
}

input:focus{
 border-color:#155eef
}

button{
 width:100%;
 border:0;
 border-radius:9px;
 padding:13px;
 margin-top:20px;
 background:#155eef;
 color:#fff;
 font-weight:bold;
 font-size:14px;
 cursor:pointer
}

button:disabled{
 opacity:.6;
 cursor:not-allowed
}

.msg{
 display:none;
 padding:11px;
 border-radius:8px;
 margin-top:15px;
 font-size:13px
}

.error{
 display:block;
 background:#fee2e2;
 color:#991b1b
}

.info{
 margin-top:20px;
 text-align:center;
 color:#667085;
 font-size:11px
}
</style>
</head>

<body>

<div class="card">

<div class="logo">GOH</div>

<h1>GOH Ministries Finance</h1>

<div class="sub">
Administrator Login
</div>

<form id="loginForm">

<label>Email</label>
<input
 id="email"
 type="email"
 placeholder="Enter your email"
 autocomplete="username"
 required
>

<label>Password</label>
<input
 id="password"
 type="password"
 placeholder="Enter your password"
 autocomplete="current-password"
 required
>

<button id="loginBtn" type="submit">
Login
</button>

<div id="msg" class="msg"></div>

</form>

<div class="info">
Secure Finance Administration System
</div>

</div>

<script>

const API="https://goh-finance.createlk.workers.dev";
const KEY="goh_finance_token";

const form=document.getElementById("loginForm");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function show(text){
 msg.textContent=text;
 msg.className="msg error";
}

form.addEventListener("submit",async e=>{

 e.preventDefault();

 const email=document
  .getElementById("email")
  .value
  .trim()
  .toLowerCase();

 const password=document
  .getElementById("password")
  .value;

 if(!email||!password){
  show("Email and password are required.");
  return;
 }

 btn.disabled=true;
 btn.textContent="Signing in...";
 msg.className="msg";

 try{

  const r=await fetch(
   API+"/api/login",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email,
     password
    })
   }
  );

  const d=await r.json();

  if(!r.ok||!d.success){
   throw new Error(
    d.error||"Invalid login."
   );
  }

  localStorage.setItem(
   KEY,
   d.token
  );

  if(d.user&&d.user.role==="admin"){
   location.href="admin.html";
  }else{
   location.href="finance-dashboard.html";
  }

 }catch(err){

  show(err.message);

 }finally{

  btn.disabled=false;
  btn.textContent="Login";

 }

});

</script>

</body>
</html>
