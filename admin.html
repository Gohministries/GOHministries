<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#155eef;
  color:#fff;
  padding:18px;
}

header h1{font-size:21px}
header p{font-size:13px;margin-top:5px;opacity:.85}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:16px;
}

.tab{
  border:0;
  padding:11px 17px;
  border-radius:10px;
  background:#e8edf7;
  font-weight:bold;
  white-space:nowrap;
  cursor:pointer;
}

.tab.active{
  background:#155eef;
  color:white;
}

.section{display:none}
.section.active{display:block}

.card{
  background:#fff;
  padding:18px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
  font-size:18px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #d7dce5;
  border-radius:9px;
  font-size:14px;
}

button{
  cursor:pointer;
}

.primary{
  border:0;
  background:#155eef;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  border:0;
  background:#eef2f7;
  padding:9px 12px;
  border-radius:8px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid #edf0f4;
  font-size:13px;
}

th{
  background:#f8fafc;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.admin{
  background:#dbeafe;
  color:#1d4ed8;
}

.finance{
  background:#dcfce7;
  color:#15803d;
}

.viewer{
  background:#f1f5f9;
  color:#475569;
}

.active{
  background:#dcfce7;
  color:#15803d;
}

.inactive{
  background:#fee2e2;
  color:#b91c1c;
}

.notice{
  background:#fff7ed;
  border:1px solid #fed7aa;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:15px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>GOH Ministries Finance</h1>
  <p>Administration Panel</p>
</header>

<div class="container">

  <div class="tabs">

    <button class="tab active"
      onclick="showTab('users',this)">
      Users
    </button>

    <button class="tab"
      onclick="showTab('audit',this)">
      Audit Log
    </button>

  </div>


  <!-- USERS -->

  <section id="users" class="section active">

    <div class="card">

      <h2>Create User</h2>

      <div class="notice">
        Only authorized administrators can manage finance users.
      </div>

      <form id="userForm">

        <div class="grid">

          <div>
            <label>Name</label>
            <input id="name" required>
          </div>

          <div>
            <label>Email</label>
            <input id="email"
              type="email"
              required>
          </div>

          <div>
            <label>Role</label>

            <select id="role">

              <option value="finance">
                Finance
              </option>

              <option value="viewer">
                Viewer
              </option>

              <option value="admin">
                Administrator
              </option>

            </select>

          </div>

          <div>
            <label>Status</label>

            <select id="active">

              <option value="1">
                Active
              </option>

              <option value="0">
                Inactive
              </option>

            </select>

          </div>

        </div>

        <br>

        <button class="primary">
          Create User
        </button>

      </form>

    </div>


    <div class="card">

      <h2>Users</h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Created</th>
            </tr>

          </thead>

          <tbody id="usersTable">

            <tr>
              <td colspan="5">
                Loading...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </section>


  <!-- AUDIT -->

  <section id="audit" class="section">

    <div class="card">

      <h2>Audit Log</h2>

      <div class="grid">

        <div>

          <label>Action</label>

          <select id="action">

            <option value="">
              All Actions
            </option>

            <option value="CREATE">
              Create
            </option>

            <option value="UPDATE">
              Update
            </option>

            <option value="DELETE">
              Delete
            </option>

            <option value="LOGIN">
              Login
            </option>

            <option value="LOGOUT">
              Logout
            </option>

          </select>

        </div>

        <div>

          <label>Date</label>

          <input id="date"
            type="date">

        </div>

      </div>

      <br>

      <button
        class="primary"
        onclick="loadAudit()">

        Search

      </button>

    </div>


    <div class="card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Action</th>
              <th>Table</th>
              <th>Record</th>
              <th>Details</th>
            </tr>

          </thead>

          <tbody id="auditTable">

            <tr>
              <td colspan="6">
                Loading...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<script>

const API =
"https://goh-finance.createlk.workers.dev";


function showTab(id,btn){

  document
    .querySelectorAll(".section")
    .forEach(x =>
      x.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  document
    .querySelectorAll(".tab")
    .forEach(x =>
      x.classList.remove("active")
    );

  btn.classList.add("active");

  if(id === "users")
    loadUsers();

  if(id === "audit")
    loadAudit();
}


/* USERS */

async function loadUsers(){

  const table =
    document.getElementById("usersTable");

  try{

    const response =
      await fetch(API + "/api/admin/users");

    const data =
      await response.json();

    if(!data.success)
      throw new Error(data.error);

    table.innerHTML = "";

    data.users.forEach(user => {

      let roleClass =
        user.role === "admin"
        ? "admin"
        : user.role === "finance"
        ? "finance"
        : "viewer";

      let statusClass =
        user.active
        ? "active"
        : "inactive";

      table.innerHTML += `

        <tr>

          <td>
            ${escapeHTML(user.name)}
          </td>

          <td>
            ${escapeHTML(user.email)}
          </td>

          <td>
            <span class="badge ${roleClass}">
              ${escapeHTML(user.role)}
            </span>
          </td>

          <td>
            <span class="badge ${statusClass}">
              ${user.active ? "Active" : "Inactive"}
            </span>
          </td>

          <td>
            ${escapeHTML(user.created_at || "")}
          </td>

        </tr>

      `;

    });

  }catch(error){

    table.innerHTML = `
      <tr>
        <td colspan="5">
          User API is not connected yet.
        </td>
      </tr>
    `;

  }

}


/* CREATE USER */

document
  .getElementById("userForm")
  .addEventListener("submit",
  async function(e){

    e.preventDefault();

    const body = {

      name:
        document.getElementById("name")
        .value.trim(),

      email:
        document.getElementById("email")
        .value.trim(),

      role:
        document.getElementById("role")
        .value,

      active:
        Number(
          document.getElementById("active")
          .value
        )

    };

    try{

      const response =
        await fetch(
          API + "/api/admin/users",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );

      const data =
        await response.json();

      if(!data.success)
        throw new Error(data.error);

      alert("User created.");

      this.reset();

      loadUsers();

    }catch(error){

      alert(
        "User API is not connected yet."
      );

    }

  });


/* AUDIT */

async function loadAudit(){

  const table =
    document.getElementById("auditTable");

  try{

    const params =
      new URLSearchParams();

    const action =
      document.getElementById("action")
      .value;

    const date =
      document.getElementById("date")
      .value;

    if(action)
      params.set("action",action);

    if(date)
      params.set("date",date);

    const response =
      await fetch(
        API +
        "/api/admin/audit?" +
        params.toString()
      );

    const data =
      await response.json();

    if(!data.success)
      throw new Error(data.error);

    table.innerHTML = "";

    data.logs.forEach(log => {

      table.innerHTML += `

        <tr>

          <td>
            ${escapeHTML(log.created_at || "")}
          </td>

          <td>
            ${escapeHTML(
              log.user_name || "System"
            )}
          </td>

          <td>
            ${escapeHTML(log.action)}
          </td>

          <td>
            ${escapeHTML(
              log.table_name || ""
            )}
          </td>

          <td>
            ${escapeHTML(
              String(log.record_id || "")
            )}
          </td>

          <td>
            ${escapeHTML(
              log.details || ""
            )}
          </td>

        </tr>

      `;

    });

  }catch(error){

    table.innerHTML = `
      <tr>
        <td colspan="6">
          Audit API is not connected yet.
        </td>
      </tr>
    `;

  }

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadUsers();

</script>

</body>
</html>
