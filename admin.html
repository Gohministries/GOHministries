<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Administration</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}
button{font:inherit;cursor:pointer}

header{
height:62px;background:#0b376d;color:#fff;
display:flex;align-items:center;gap:11px;padding:0 15px;
position:sticky;top:0;z-index:10
}
.logo{width:38px;height:38px;background:#fff;color:#0b376d;
border-radius:9px;display:grid;place-items:center;font-weight:bold}
header h2{font-size:18px}
.role{margin-left:auto;font-size:12px}
.menu{display:none;background:none;border:0;color:#fff;font-size:25px}
.logout{background:none;color:#fff;border:1px solid #ffffff55;
padding:7px 10px;border-radius:7px}

aside{
width:230px;background:#fff;border-right:1px solid #e5e7eb;
position:fixed;top:62px;bottom:0;overflow:auto;padding:12px
}
.group{font-size:10px;color:#98a2b3;font-weight:bold;
margin:15px 8px 6px;text-transform:uppercase}
nav button{
width:100%;border:0;background:none;text-align:left;
padding:10px;border-radius:8px;color:#344054;font-size:13px
}
nav button:hover,nav button.active{
background:#eaf1f9;color:#0b376d;font-weight:bold
}

main{margin-left:230px;padding:20px;max-width:1250px}
.page{display:none}.page.active{display:block}
.head{margin-bottom:18px}
.head h1{font-size:23px}.head p{font-size:13px;color:#667085;margin-top:4px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.box,.item{
background:#fff;border:1px solid #e5e7eb;border-radius:12px;
padding:15px;box-shadow:0 2px 8px #00000008
}
.card small{display:block;color:#667085;margin-top:6px}
.card b{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{cursor:pointer}.icon{font-size:23px;margin-bottom:8px}
.item b{display:block;margin-bottom:4px}.item span{font-size:12px;color:#667085}

.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info div{border:1px solid #e5e7eb;border-radius:8px;padding:11px}
.info small{display:block;color:#667085;font-size:11px;margin-bottom:5px}

.wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#f8fafc;font-size:12px;color:#475467}

.btn{border:0;background:#0b376d;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px}
.notice{background:#f0f6fc;border-left:4px solid #0b376d;
padding:11px;border-radius:5px;font-size:13px;color:#475467}

footer{text-align:center;color:#98a2b3;font-size:11px;padding:25px}

@media(max-width:800px){
.menu{display:block}
aside{transform:translateX(-100%);transition:.2s;z-index:9;width:250px}
aside.open{transform:translateX(0)}
main{margin-left:0;padding:14px}
.cards{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr 1fr}
.role{display:none}
}
@media(max-width:500px){
.grid,.info{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<button class="menu" onclick="toggleMenu()">☰</button>
<div class="logo">GOH</div>
<h2>GOH Ministries</h2>
<div class="role" id="roleText">Loading...</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<aside id="sidebar">
<nav id="nav"></nav>
</aside>

<main id="main"></main>

<script>

/* ================================
   GOH PERMISSION SYSTEM
================================ */

const USER =
JSON.parse(sessionStorage.getItem("goh_admin")||"null") ||
JSON.parse(sessionStorage.getItem("admin")||"null") ||
{role:"auditor",permissions:{}};

const role=String(USER.role||"").toLowerCase();

let permissions=USER.permissions||{};

/* Support permissions stored as JSON text */
if(typeof permissions==="string"){
try{permissions=JSON.parse(permissions)}
catch(e){permissions={}}
}

/* ================================
   DEFAULT ROLE PERMISSIONS
================================ */

const ROLE_PERMISSIONS={

admin:{
dashboard:1,
finance:1,
donations:1,
reports:1,
bank:1,
documents:1,
history:1,
activities:1,
members:1,
meetings:1,
projects:1,
property:1,
media:1,
registration:1,
constitution:1,
leadership:1,
letters:1,
audit:1,
security:1
},

finance:{
dashboard:1,
finance:1,
donations:1,
reports:1,
bank:1,
documents:1,
receipts:1
},

auditor:{
dashboard:1,
finance:1,
donations:1,
reports:1,
bank:1,
documents:1,
history:1,
registration:1,
constitution:1,
meetings:1,
audit:1
},

ministry:{
dashboard:1,
history:1,
activities:1,
members:1,
meetings:1,
projects:1,
property:1,
media:1,
documents:1
}

};

const defaults=ROLE_PERMISSIONS[role]||ROLE_PERMISSIONS.auditor;

function can(section){

/* Explicit permission overrides role default */
if(Object.prototype.hasOwnProperty.call(permissions,section))
return !!permissions[section];

return !!defaults[section];
}

/* ================================
   MENU
================================ */

const menu=[

["MAIN",[
["dashboard","🏠","Dashboard"]
]],

["FINANCE",[
["finance","💰","Financial Records"],
["donations","❤️","Donations"],
["reports","📊","Reports"],
["bank","🏦","Bank Account"],
["receipts","🧾","Receipts & Slips"]
]],

["MINISTRY",[
["history","📜","Church History"],
["activities","⛪","Activities"],
["members","👥","Members"],
["meetings","📝","Meetings"],
["projects","🏗️","Church Projects"],
["property","🏠","Property"],
["media","📸","Media & Photos"]
]],

["ORGANIZATION",[
["registration","🏛️","NGO Registration"],
["constitution","📘","Constitution / Bylaws"],
["leadership","👤","Leadership"],
["letters","✉️","Official Letters"],
["documents","📁","Important Documents"]
]],

["AUDIT",[
["audit","🔍","Audit Dashboard"],
["trail","📋","Audit Trail"]
]],

["SECURITY",[
["security","🔐","My Account"]
]]

];

function buildMenu(){

let html="";

menu.forEach(group=>{

let items=group[1].filter(x=>can(x[0]));

if(!items.length)return;

html+=`<div class="group">${group[0]}</div>`;

items.forEach((x,i)=>{

html+=`
<button
class="${x[0]==="dashboard"?"active":""}"
onclick="show('${x[0]}',this)">
${x[1]} ${x[2]}
</button>`;

});

});

nav.innerHTML=html;
}

/* ================================
   PAGE CONTENT
================================ */

const pages={

dashboard:`
<div class="head">
<h1>Administration Dashboard</h1>
<p>GOH Ministries · ${roleLabel()}</p>
</div>

<div class="cards">
<div class="card">💰<small>Finance</small><b id="financeCount">—</b></div>
<div class="card">❤️<small>Donations</small><b id="donationCount">—</b></div>
<div class="card">📁<small>Documents</small><b>—</b></div>
<div class="card">🔐<small>Access</small><b>Read Only</b></div>
</div>

<br>

<div class="box">
<div class="notice">
Your account only displays the sections and controls allowed by your permissions.
</div>
</div>
`,

finance:`
<div class="head">
<h1>💰 Financial Records</h1>
<p>Financial records and supporting slips</p>
</div>
<div class="box wrap">
<table>
<thead>
<tr>
<th>Date</th><th>Type</th><th>Category</th>
<th>Amount</th><th>Status</th><th>Slip</th>
</tr>
</thead>
<tbody id="financeTable">
<tr><td colspan="6">Loading...</td></tr>
</tbody>
</table>
</div>
`,

donations:`
<div class="head">
<h1>❤️ Donations</h1>
<p>Donation records</p>
</div>
<div class="box wrap">
<table>
<thead>
<tr><th>Date</th><th>Reference</th><th>Purpose</th>
<th>Amount</th><th>Status</th><th>Receipt</th></tr>
</thead>
<tbody id="donationTable">
<tr><td colspan="6">Loading...</td></tr>
</tbody>
</table>
</div>
`,

reports:`
<div class="head">
<h1>📊 Reports</h1>
<p>Monthly and annual financial reports</p>
</div>
<div class="cards">
<div class="card"><small>Monthly Income</small><b id="mi">—</b></div>
<div class="card"><small>Monthly Expense</small><b id="me">—</b></div>
<div class="card"><small>Annual Income</small><b id="ai">—</b></div>
<div class="card"><small>Annual Expense</small><b id="ae">—</b></div>
</div>
`,

bank:`
<div class="head">
<h1>🏦 Bank Account</h1>
<p>Organization banking information</p>
</div>
<div class="box">
<div class="notice">
Passwords, PINs, OTPs and online banking credentials are never displayed.
</div><br>
<div class="info">
<div><small>Account Name</small><b>GOH Ministries</b></div>
<div><small>Bank</small><b>—</b></div>
<div><small>Branch</small><b>—</b></div>
<div><small>Account Number</small><b>Protected</b></div>
</div>
</div>
`,

receipts:`
<div class="head">
<h1>🧾 Receipts & Slips</h1>
<p>Supporting financial documents</p>
</div>
<div class="box">
<div class="notice">Authorized users can view financial supporting documents.</div>
</div>
`,

history:`
<div class="head">
<h1>📜 Church History</h1>
<p>GOH Ministries history and milestones</p>
</div>
<div class="box">
<p style="line-height:1.8;color:#475467">
Official church history, founding information, ministry development,
major events, outreach and important milestones.
</p>
</div>
`,

activities:`
<div class="head"><h1>⛪ Activities</h1><p>Ministry activities</p></div>
<div class="grid">
<div class="item">🙏<br><b>Prayer</b><span>Prayer meetings</span></div>
<div class="item">📖<br><b>Bible Teaching</b><span>Teaching programs</span></div>
<div class="item">🌍<br><b>Evangelism</b><span>Outreach</span></div>
<div class="item">❤️<br><b>Community Support</b><span>Assistance</span></div>
</div>
`,

members:`
<div class="head"><h1>👥 Members</h1><p>Membership administration</p></div>
<div class="box">
<div class="notice">Member information is displayed according to your permissions.</div>
</div>
`,

meetings:`
<div class="head"><h1>📝 Meetings</h1><p>Meetings and minutes</p></div>
<div class="box wrap">
<table>
<thead><tr><th>Date</th><th>Meeting</th><th>Minutes</th></tr></thead>
<tbody><tr><td colspan="3">No records loaded.</td></tr></tbody>
</table>
</div>
`,

projects:`
<div class="head"><h1>🏗️ Church Projects</h1><p>Projects and development</p></div>
<div class="grid">
<div class="item">🏗️<br><b>Church Building</b><span>Construction</span></div>
<div class="item">❤️<br><b>Community</b><span>Community projects</span></div>
<div class="item">📖<br><b>Education</b><span>Education projects</span></div>
</div>
`,

property:`
<div class="head"><h1>🏠 Property</h1><p>Property and assets</p></div>
<div class="box">
<div class="notice">Property documents and related records.</div>
</div>
`,

media:`
<div class="head"><h1>📸 Media & Photos</h1><p>Ministry media</p></div>
<div class="box">
<div class="notice">Approved ministry photos and evidence.</div>
</div>
`,

registration:`
<div class="head">
<h1>🏛️ NGO Registration</h1>
<p>Official registration information</p>
</div>
<div class="box">
<div class="info">
<div><small>Registered Name</small><b>GOH Ministries</b></div>
<div><small>Registration Number</small><b>—</b></div>
<div><small>Registration Date</small><b>—</b></div>
<div><small>Status</small><b>Active</b></div>
</div>
<br>
<button class="btn" onclick="openDocument('registration')">View Certificate</button>
</div>
`,

constitution:`
<div class="head"><h1>📘 Constitution / Bylaws</h1><p>Governance documents</p></div>
<div class="grid">
<div class="item">📘<br><b>Constitution</b><span>Organization constitution</span></div>
<div class="item">📋<br><b>Bylaws</b><span>Operational rules</span></div>
</div>
`,

leadership:`
<div class="head"><h1>👤 Leadership</h1><p>Organization leadership</p></div>
<div class="box">
<div class="info">
<div><small>Founder / Pastor</small><b>—</b></div>
<div><small>Financial Officer</small><b>—</b></div>
<div><small>Auditor</small><b>GOH Audit</b></div>
<div><small>Organization</small><b>GOH Ministries</b></div>
</div>
</div>
`,

letters:`
<div class="head"><h1>✉️ Official Letters</h1><p>Official correspondence</p></div>
<div class="box">No records loaded.</div>
`,

documents:`
<div class="head"><h1>📁 Important Documents</h1><p>Official organization records</p></div>
<div class="grid">
<div class="item">🏛️<br><b>Registration</b><span>Official registration</span></div>
<div class="item">📘<br><b>Constitution</b><span>Governance</span></div>
<div class="item">🏦<br><b>Bank</b><span>Bank documents</span></div>
<div class="item">🏗️<br><b>Building</b><span>Building documents</span></div>
<div class="item">📝<br><b>Meetings</b><span>Minutes</span></div>
<div class="item">📄<br><b>Official Letters</b><span>Correspondence</span></div>
</div>
`,

audit:`
<div class="head"><h1>🔍 Audit Dashboard</h1><p>Audit and compliance</p></div>
<div class="cards">
<div class="card">💰<small>Finance Review</small><b>Ready</b></div>
<div class="card">📁<small>Documents</small><b>Ready</b></div>
<div class="card">📋<small>Audit Trail</small><b>Ready</b></div>
<div class="card">🔐<small>Access</small><b>Read Only</b></div>
</div>
`,

trail:`
<div class="head"><h1>📋 Audit Trail</h1><p>Administrative activity</p></div>
<div class="box wrap">
<table>
<thead><tr><th>Date</th><th>User</th><th>Action</th><th>Section</th></tr></thead>
<tbody id="auditTable"><tr><td colspan="4">Loading...</td></tr></tbody>
</table>
</div>
`,

security:`
<div class="head"><h1>🔐 My Account</h1><p>Account information</p></div>
<div class="box">
<div class="info">
<div><small>Username</small><b>${USER.username||"—"}</b></div>
<div><small>Name</small><b>${USER.name||"—"}</b></div>
<div><small>Role</small><b>${roleLabel()}</b></div>
<div><small>Access</small><b>Permission Based</b></div>
</div>
</div>
`

};

function roleLabel(){
return role.charAt(0).toUpperCase()+role.slice(1);
}

function show(id,btn){

if(!can(id)&&id!=="trail"){
alert("You do not have permission to access this section.");
return;
}

main.innerHTML=pages[id]||pages.dashboard;

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

if(btn)btn.classList.add("active");

sidebar.classList.remove("open");

if(id==="finance")loadFinance();
if(id==="donations")loadDonations();
if(id==="reports")loadReports();
if(id==="trail")loadAudit();

scrollTo(0,0);
}

function toggleMenu(){
sidebar.classList.toggle("open");
}

function logout(){
sessionStorage.clear();
location.href="admin-login.html";
}

/* ================================
   API
================================ */

const API={
finance:"YOUR_FINANCE_API",
donations:"YOUR_DONATIONS_API",
reports:"YOUR_REPORTS_API",
audit:"YOUR_AUDIT_API",
documents:"YOUR_DOCUMENTS_API"
};

async function get(url){

const token=
sessionStorage.getItem("goh_admin_token")||
sessionStorage.getItem("token");

const r=await fetch(url,{
headers:token?
{Authorization:"Bearer "+token}:{}
});

if(!r.ok)throw Error("API error");

return r.json();
}

function money(v){
return "LKR "+Number(v||0).toLocaleString("en-LK",{
minimumFractionDigits:2
});
}

async function loadFinance(){

try{

const d=await get(API.finance);
const rows=d.records||d||[];

const count=document.getElementById("financeCount");
if(count)count.textContent=rows.length;

const table=document.getElementById("financeTable");

if(!table)return;

table.innerHTML=rows.map(x=>`

<tr>
<td>${x.date||"—"}</td>
<td>${x.type||"—"}</td>
<td>${x.category||"—"}</td>
<td>${money(x.amount)}</td>
<td>${x.status||"—"}</td>
<td>
${x.slip_url?
`<button class="btn" onclick="openSlip('${x.slip_url}')">View</button>`
:"—"}
</td>
</tr>

`).join("");

}catch(e){

const table=document.getElementById("financeTable");
if(table)
table.innerHTML=
"<tr><td colspan='6'>Unable to load records.</td></tr>";
}
}

async function loadDonations(){

try{

const d=await get(API.donations);
const rows=d.records||d||[];

const count=document.getElementById("donationCount");
if(count)count.textContent=rows.length;

const table=document.getElementById("donationTable");
if(!table)return;

table.innerHTML=rows.map(x=>`

<tr>
<td>${x.date||"—"}</td>
<td>${x.reference||"—"}</td>
<td>${x.purpose||"—"}</td>
<td>${money(x.amount)}</td>
<td>${x.status||"—"}</td>
<td>${x.receipt_url?
`<button class="btn" onclick="openSlip('${x.receipt_url}')">View</button>`
:"—"}</td>
</tr>

`).join("");

}catch(e){}
}

async function loadReports(){

try{

const d=await get(API.reports);

mi.textContent=money(d.monthly_income);
me.textContent=money(d.monthly_expense);
ai.textContent=money(d.annual_income);
ae.textContent=money(d.annual_expense);

}catch(e){}
}

async function loadAudit(){

try{

const d=await get(API.audit);
const rows=d.records||d||[];

const table=document.getElementById("auditTable");
if(!table)return;

table.innerHTML=rows.map(x=>`

<tr>
<td>${x.created_at||x.date||"—"}</td>
<td>${x.username||x.user||"—"}</td>
<td>${x.action||"—"}</td>
<td>${x.section||"—"}</td>
</tr>

`).join("");

}catch(e){}
}

function openSlip(url){

if(!url){
alert("Receipt / slip unavailable.");
return;
}

window.open(url,"_blank","noopener,noreferrer");
}

function openDocument(id){

if(API.documents.startsWith("YOUR_")){
alert("Document API not connected.");
return;
}

window.open(
API.documents+"?id="+encodeURIComponent(id),
"_blank"
);
}

/* ================================
   START
================================ */

roleText.textContent=roleLabel();

buildMenu();

main.innerHTML=pages.dashboard;

if(can("finance"))loadFinance();
if(can("donations"))loadDonations();

</script>

</body>
</html>
