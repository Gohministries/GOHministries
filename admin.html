<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033
}

.login-box{
  width:100%;
  max-width:410px;
  padding:32px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.08)
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b376d;
  color:#fff;
  border-radius:16px;
  font-size:24px;
  font-weight:bold
}

h1{
  text-align:center;
  color:#0b376d;
  font-size:24px
}

.subtitle{
  margin:7px 0 28px;
  text-align:center;
  color:#64748b;
  font-size:14px
}

.field{margin-bottom:18px}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:bold
}

input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  outline:none;
  font-size:15px
}

input:focus{
  border-color:#0b376d;
  box-shadow:0 0 0 3px rgba(11,55,109,.1)
}

.password{
  position:relative
}

.password input{padding-right:58px}

.show{
  position:absolute;
  right:0;
  top:0;
  width:55px;
  height:48px;
  border:0;
  background:none;
  color:#64748b;
  cursor:pointer
}

.login{
  width:100%;
  height:50px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}

.login:hover{background:#082952}

.login:disabled{
  opacity:.65;
  cursor:not-allowed
}

.message{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:9px;
  font-size:14px
}

.message.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca
}

.message.success{
  display:block;
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#94a3b8;
  font-size:12px
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">GOH</div>

  <h1>GOH Ministries</h1>

  <div class="subtitle">
    Church Administration
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="field">
      <label for="username">Username</label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
        required
      >
    </div>

    <div class="field">
      <label for="password">Password</label>

      <div class="password">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

        <button
          type="button"
          class="show"
          id="show"
        >Show</button>
      </div>
    </div>

    <button
      type="submit"
      class="login"
      id="login"
    >Login</button>

  </form>

  <div class="footer">
    GOH Ministries Administration
  </div>

</div>

<script>

const API =
  "https://goh-admin-auth.createlk.workers.dev";

const TOKEN =
  "goh_admin_token";

const USER =
  "goh_admin_user";


const form =
  document.getElementById("loginForm");

const username =
  document.getElementById("username");

const password =
  document.getElementById("password");

const login =
  document.getElementById("login");

const message =
  document.getElementById("message");

const show =
  document.getElementById("show");


function errorMessage(text){

  message.textContent = text;
  message.className = "message error";
}


function successMessage(text){

  message.textContent = text;
  message.className = "message success";
}


show.addEventListener("click",()=>{

  if(password.type === "password"){

    password.type = "text";
    show.textContent = "Hide";

  }else{

    password.type = "password";
    show.textContent = "Show";
  }

});


function redirect(role){

  if(role === "admin"){
    location.href = "admin-dashboard.html";
    return;
  }

  if(role === "finance"){
    location.href = "finance-dashboard.html";
    return;
  }

  if(role === "auditor"){
    location.href = "audit-dashboard.html";
    return;
  }

  throw new Error("Invalid account role");
}


form.addEventListener("submit",async e=>{

  e.preventDefault();

  message.className = "message";
  message.textContent = "";

  const user =
    username.value.trim();

  const pass =
    password.value;

  if(!user || !pass){

    errorMessage(
      "Enter your username and password."
    );

    return;
  }

  login.disabled = true;
  login.textContent = "Signing in...";

  try{

    const response =
      await fetch(API + "/login",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          username:user,
          password:pass
        })
      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Login failed."
      );
    }


    if(
      !data.success ||
      !data.token ||
      !data.user ||
      !data.user.role
    ){

      throw new Error(
        "Invalid authentication response."
      );
    }


    const role =
      data.user.role;


    if(
      !["admin","finance","auditor"]
      .includes(role)
    ){

      throw new Error(
        "Invalid account role."
      );
    }


    sessionStorage.setItem(
      TOKEN,
      data.token
    );

    sessionStorage.setItem(
      USER,
      JSON.stringify(data.user)
    );


    successMessage(
      "Login successful. Opening..."
    );


    password.value = "";


    setTimeout(()=>{

      redirect(role);

    },500);


  }catch(error){

    errorMessage(
      error.message ||
      "Unable to connect to server."
    );

    login.disabled = false;
    login.textContent = "Login";
  }

});


async function checkSession(){

  const token =
    sessionStorage.getItem(TOKEN);

  if(!token) return;


  try{

    const response =
      await fetch(API + "/me",{

        headers:{
          "Authorization":
            "Bearer " + token
        }
      });


    if(!response.ok){

      sessionStorage.removeItem(TOKEN);
      sessionStorage.removeItem(USER);

      return;
    }


    const data =
      await response.json();


    if(
      data.success &&
      data.user &&
      data.user.role
    ){

      sessionStorage.setItem(
        USER,
        JSON.stringify(data.user)
      );

      redirect(
        data.user.role
      );
    }

  }catch{

    // Stay on login page
  }
}


checkSession();

</script>

</body>
</html>
