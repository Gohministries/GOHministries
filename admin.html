<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOH Ministries Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ddd;border-radius:7px}
button{border:0;border-radius:7px;padding:10px 14px;background:#174ea6;color:#fff;font-weight:bold;cursor:pointer}
.red{background:#d93025}.green{background:#188038}.gray{background:#687386}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;padding:25px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 5px 25px #0002}
.app{display:none}header{height:60px;background:#123b70;color:#fff;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.layout{display:flex;min-height:calc(100vh - 60px)}nav{width:210px;background:#fff;padding:10px}nav button{width:100%;text-align:left;background:none;color:#172033;margin:2px 0}nav button:hover,nav .on{background:#e8f0ff;color:#174ea6}
main{flex:1;padding:18px}.sec{display:none}.sec.on{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,.panel{background:#fff;padding:17px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}.card b{display:block;font-size:22px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f5f6f8}
@media(max-width:650px){nav{width:58px}nav button{font-size:0;text-align:center}nav button:first-letter{font-size:18px}main{padding:10px}}
</style>
</head>
<body>

<div id="login" class="login">
<div class="box">
<h2 style="text-align:center">GOH Ministries</h2>
<p style="text-align:center;color:#777">Church Administration</p>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<input id="otp" placeholder="2FA Code" maxlength="6" style="display:none">
<button style="width:100%" onclick="login()">Login</button>
<p id="err" style="color:#d00"></p>
</div>
</div>

<div id="app" class="app">
<header><b>GOH Ministries Admin</b><button class="red" onclick="logout()">Logout</button></header>

<div class="layout">
<nav>
<button class="on" onclick="page('dash',this)">🏠 Dashboard</button>
<button onclick="page('fin',this)">💰 Finance</button>
<button onclick="page('pro',this)">🏗 Projects</button>
<button onclick="page('eve',this)">📅 Events</button>
<button onclick="page('meet',this)">👥 Meetings</button>
<button onclick="page('doc',this)">📁 Documents</button>
<button onclick="page('adm',this)">🔐 Admins</button>
</nav>

<main>

<section id="dash" class="sec on">
<h2>Dashboard</h2>
<div class="cards">
<div class="card">Income<b id="inc">LKR 0</b></div>
<div class="card">Expense<b id="exp">LKR 0</b></div>
<div class="card">Balance<b id="bal">LKR 0</b></div>
<div class="card">Projects<b id="pc">0</b></div>
<div class="card">Events<b id="ec">0</b></div>
<div class="card">Documents<b id="dc">0</b></div>
</div>
</section>

<section id="fin" class="sec">
<h2>Finance</h2>
<div class="panel">
<select id="ft"><option value="income">Income</option><option value="expense">Expense</option></select>
<input id="fd" type="date"><input id="fa" type="number" placeholder="Amount">
<input id="fx" placeholder="Description">
<button class="green" onclick="add('/finance',{type:ft.value,record_date:fd.value,amount:+fa.value,description:fx.value})">Add</button>
</div>
<div class="panel" id="finList">Loading...</div>
</section>

<section id="pro" class="sec">
<h2>Projects</h2>
<div class="panel">
<input id="pn" placeholder="Project name">
<div class="grid"><input id="pb" type="number" placeholder="Budget"><input id="ps" type="number" placeholder="Spent"></div>
<select id="pt"><option>Planning</option><option>Active</option><option>Completed</option><option>On Hold</option></select>
<button class="green" onclick="add('/projects',{name:pn.value,budget:+pb.value,spent:+ps.value,status:pt.value})">Add</button>
</div>
<div class="panel" id="proList">Loading...</div>
</section>

<section id="eve" class="sec">
<h2>Events</h2>
<div class="panel">
<input id="en" placeholder="Event title">
<div class="grid"><input id="ed" type="date"><input id="et" type="time"><input id="ev" placeholder="Venue"></div>
<textarea id="ex" placeholder="Description"></textarea>
<button class="green" onclick="add('/events',{title:en.value,event_date:ed.value,event_time:et.value,venue:ev.value,description:ex.value})">Add</button>
</div>
<div class="panel" id="eveList">Loading...</div>
</section>

<section id="meet" class="sec">
<h2>Meetings</h2>
<div class="panel">
<input id="md" type="date"><input id="mn" placeholder="Meeting title">
<textarea id="mx" placeholder="Notes"></textarea>
<button class="green" onclick="add('/meetings',{meeting_date:md.value,title:mn.value,notes:mx.value})">Add</button>
</div>
<div class="panel" id="meetList">Loading...</div>
</section>

<section id="doc" class="sec">
<h2>Documents</h2>
<div class="panel">
<input id="dn" placeholder="Title">
<div class="grid"><select id="dg"><option>Finance</option><option>Project</option><option>Event</option><option>Meeting</option><option>Church</option><option>Other</option></select><input id="dd" type="date"></div>
<textarea id="dx" placeholder="Description"></textarea>
<input id="df" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
<button class="green" onclick="upload()">Upload</button>
</div>
<div class="panel" id="docList">Loading...</div>
</section>

<section id="adm" class="sec">
<h2>Administrators</h2>
<div class="panel">
<div class="grid"><input id="au" placeholder="Username"><input id="an" placeholder="Name"></div>
<input id="ap" type="password" placeholder="Password">
<select id="ar"><option value="admin">Admin</option><option value="administrator">Administrator</option></select>
<button class="green" onclick="createAdmin()">Create</button>
</div>
<div class="panel" id="admList">Loading...</div>
</section>

</main></div></div>

<script>
const API="https://goh-church-api.createlk.workers.dev";
const $=x=>document.getElementById(x);
const today=new Date().toISOString().slice(0,10);
["fd","ed","md","dd"].forEach(x=>$(x).value=today);

async function api(path,opt={}){
 let r=await fetch(API+path,{credentials:"include",...opt});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||d.message||"Request failed");
 return d;
}

async function login(){
 try{
  let d=await api("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username:$("u").value,password:$("p").value,otp:$("otp").value||undefined})});
  if(d.requires_2fa){$("otp").style.display="block";$("err").textContent="Enter 2FA code";return}
  $("login").style.display="none";$("app").style.display="block";loadDash();
 }catch(e){$("err").textContent=e.message}
}

async function logout(){try{await api("/admin/logout",{method:"POST"})}catch{}location.reload()}

function page(id,b){
 document.querySelectorAll(".sec").forEach(x=>x.classList.remove("on"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
 $(id).classList.add("on");b.classList.add("on");
 ({dash:loadDash,fin:loadFin,pro:loadPro,eve:loadEve,meet:loadMeet,doc:loadDoc,adm:loadAdm}[id])();
}

async function add(path,data){
 try{await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
 alert("Added");loadDash()}catch(e){alert(e.message)}
}

async function loadDash(){
 try{
  let d=await api("/dashboard");
  $("inc").textContent="LKR "+(+d.income||0).toLocaleString();
  $("exp").textContent="LKR "+(+d.expense||0).toLocaleString();
  $("bal").textContent="LKR "+(+d.balance||0).toLocaleString();
  $("pc").textContent=d.projects||0;$("ec").textContent=d.events||0;$("dc").textContent=d.documents||0;
 }catch{}
}

async function list(path,id,cols){
 try{
  let d=await api(path),a=d.records||d.admins||d||[];
  if(!a.length){$(id).textContent="No records.";return}
  $(id).innerHTML="<table><tr>"+cols.map(x=>"<th>"+x[0]+"</th>").join("")+"</tr>"+
  a.map(r=>"<tr>"+cols.map(x=>"<td>"+(x[1](r)||"")+"</td>").join("")+"</tr>").join("")+"</table>";
 }catch(e){$(id).textContent=e.message}
}

function loadFin(){list("/finance","finList",[["Date",r=>r.record_date],["Type",r=>r.type],["Description",r=>r.description],["Amount",r=>"LKR "+(+r.amount||0).toLocaleString()]])}
function loadPro(){list("/projects","proList",[["Name",r=>r.name],["Budget",r=>r.budget],["Spent",r=>r.spent],["Status",r=>r.status]])}
function loadEve(){list("/events","eveList",[["Date",r=>r.event_date],["Title",r=>r.title],["Time",r=>r.event_time],["Venue",r=>r.venue]])}
function loadMeet(){list("/meetings","meetList",[["Date",r=>r.meeting_date],["Title",r=>r.title],["Notes",r=>r.notes]])}

async function upload(){
 let f=$("df").files[0];if(!f)return alert("Select a file");
 let x=new FormData();
 x.append("title",$("dn").value);x.append("category",$("dg").value);
 x.append("record_date",$("dd").value);x.append("description",$("dx").value);x.append("file",f);
 try{await api("/documents",{method:"POST",body:x});alert("Uploaded");loadDoc();loadDash()}catch(e){alert(e.message)}
}

async function loadDoc(){
 try{
  let d=await api("/documents"),a=d.records||d||[];
  $("docList").innerHTML=a.length?"<table><tr><th>Date</th><th>Title</th><th>Category</th><th>File</th><th></th></tr>"+
  a.map(r=>`<tr><td>${r.record_date||""}</td><td>${r.title||""}</td><td>${r.category||""}</td><td>${r.file_name||""}</td><td><button onclick="window.open('${API}/documents/${r.id}/file')">View</button> <button class="red" onclick="delDoc(${r.id})">Delete</button></td></tr>`).join("")+"</table>":"No documents.";
 }catch(e){$("docList").textContent=e.message}
}

async function delDoc(id){
 if(!confirm("Delete document?"))return;
 try{await api("/documents/"+id,{method:"DELETE"});loadDoc();loadDash()}catch(e){alert(e.message)}
}

async function createAdmin(){
 try{
  await api("/admin/create",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username:au.value,name:an.value,password:ap.value,role:ar.value})});
  alert("Admin created");loadAdm();
 }catch(e){alert(e.message)}
}

function loadAdm(){
 list("/admin/list","admList",[
 ["Username",r=>r.username],
 ["Name",r=>r.name],
 ["Role",r=>r.role],
 ["Status",r=>+r.active===1?"Active":"Inactive"],
 ["",r=>`<button onclick="status(${r.id},${+r.active})">${+r.active?"Deactivate":"Activate"}</button> <button class="red" onclick="delAdmin(${r.id})">Delete</button>`]
 ]);
}

async function status(id,a){
 try{await api("/admin/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,active:a?0:1})});loadAdm()}catch(e){alert(e.message)}
}

async function delAdmin(id){
 if(!confirm("Delete admin?"))return;
 try{await api("/admin/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});loadAdm()}catch(e){alert(e.message)}
}
</script>
</body>
</html>
