<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOH Ministries | Admin Setup</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  min-height:100vh;
  background:#f1f5f9;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.card{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 35px #0002
}

.logo{
  width:58px;
  height:58px;
  margin:0 auto 14px;
  border-radius:15px;
  background:#0b376d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}

h1{
  text-align:center;
  color:#0b376d;
  font-size:23px
}

.sub{
  text-align:center;
  color:#667085;
  margin:7px 0 22px
}

.section{
  border:1px solid #e1e7ef;
  border-radius:13px;
  padding:17px;
  margin-top:15px
}

.section h2{
  font-size:17px;
  color:#0b376d;
  margin-bottom:14px
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccd5df;
  border-radius:9px;
  font-size:15px;
  outline:none
}

input:focus{
  border-color:#0b376d
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  opacity:.6
}

.msg{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  font-size:14px;
  text-align:center
}

.error{
  display:block;
  background:#fee4e2;
  color:#b42318
}

.success{
  display:block;
  background:#dcfae6;
  color:#067647
}

.note{
  margin-top:15px;
  font-size:12px;
  line-height:1.5;
  color:#667085
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">GOH</div>

  <h1>GOH Ministries</h1>
  <div class="sub">Administrator Setup</div>

  <form id="setupForm">

    <div class="section">

      <h2>Super Admin</h2>

      <label>Name</label>
      <input
        id="superName"
        value="GOH Administrator"
        required
      >

      <label>Username</label>
      <input
        id="superUsername"
        value="admin"
        required
      >

      <label>Password</label>
      <input
        id="superPassword"
        type="password"
        autocomplete="new-password"
        required
      >

      <label>Confirm Password</label>
      <input
        id="superConfirm"
        type="password"
        autocomplete="new-password"
        required
      >

    </div>

    <div class="section">

      <h2>Administrator</h2>

      <label>Name</label>
      <input
        id="staffName"
        value="Church Staff"
        required
      >

      <label>Username</label>
      <input
        id="staffUsername"
        value="staff"
        required
      >

      <label>Password</label>
      <input
        id="staffPassword"
        type="password"
        autocomplete="new-password"
        required
      >

      <label>Confirm Password</label>
      <input
        id="staffConfirm"
        type="password"
        autocomplete="new-password"
        required
      >

    </div>

    <button id="setupBtn" type="submit">
      Create Both Accounts
    </button>

  </form>

  <div id="msg" class="msg"></div>

  <div class="note">
    The Super Admin receives full access. The Administrator
    uses module permissions. Passwords are sent to the server
    for hashing and are not stored as plain text.
  </div>

</div>

<script>

const API = "YOUR_ADMIN_API_WORKER_URL";

const form = document.getElementById("setupForm");
const button = document.getElementById("setupBtn");
const msg = document.getElementById("msg");

function message(text,type="error"){
  msg.textContent = text;
  msg.className = "msg " + type;
}

form.addEventListener("submit",async e=>{

  e.preventDefault();

  const superPassword =
    document.getElementById("superPassword").value;

  const superConfirm =
    document.getElementById("superConfirm").value;

  const staffPassword =
    document.getElementById("staffPassword").value;

  const staffConfirm =
    document.getElementById("staffConfirm").value;

  if(superPassword.length < 8){
    message("Super Admin password must be at least 8 characters.");
    return;
  }

  if(staffPassword.length < 8){
    message("Administrator password must be at least 8 characters.");
    return;
  }

  if(superPassword !== superConfirm){
    message("Super Admin passwords do not match.");
    return;
  }

  if(staffPassword !== staffConfirm){
    message("Administrator passwords do not match.");
    return;
  }

  const superUsername =
    document.getElementById("superUsername").value.trim();

  const staffUsername =
    document.getElementById("staffUsername").value.trim();

  if(
    superUsername.toLowerCase() ===
    staffUsername.toLowerCase()
  ){
    message("The two usernames must be different.");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating accounts...";

  try{

    const response = await fetch(
      API + "/setup",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        credentials:"include",
        body:JSON.stringify({

          super_admin:{
            name:
              document.getElementById("superName").value.trim(),

            username:
              superUsername,

            password:
              superPassword
          },

          admin:{
            name:
              document.getElementById("staffName").value.trim(),

            username:
              staffUsername,

            password:
              staffPassword
          }

        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "Setup failed"
      );
    }

    message(
      "Both administrator accounts were created successfully.",
      "success"
    );

    button.textContent = "Setup Complete";

    setTimeout(()=>{
      location.href = "admin-login.html";
    },1500);

  }catch(error){

    message(
      error.message || "Unable to create accounts."
    );

    button.disabled = false;
    button.textContent = "Create Both Accounts";
  }

});

</script>

</body>
</html>
