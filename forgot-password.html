<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reset Password | GOH Bible Academy</title>
<meta name="description" content="Reset your GOH Bible Academy student account password.">
<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f6f8fb;
color:#172033;
min-height:100vh;
display:flex;
flex-direction:column
}

a{text-decoration:none;color:inherit}

header{
background:#fff;
border-bottom:1px solid #e5eaf1
}

.container{
width:min(1050px,92%);
margin:auto
}

.nav{
height:68px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.logo{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:10px;
background:#0b376d;
color:#fff;
font-size:12px;
font-weight:900
}

.brand strong{
display:block;
color:#0b376d;
font-size:15px
}

.brand small{
display:block;
color:#667085;
font-size:8px;
font-weight:700;
letter-spacing:.7px
}

.home{
font-size:12px;
font-weight:700;
color:#0b376d
}

main{
flex:1;
display:grid;
place-items:center;
padding:45px 0
}

.card{
width:min(430px,100%);
background:#fff;
border:1px solid #e5eaf1;
border-radius:16px;
padding:28px;
box-shadow:0 10px 30px #00000008
}

.icon{
width:48px;
height:48px;
display:grid;
place-items:center;
border-radius:12px;
background:#edf4ff;
color:#0b376d;
font-size:22px;
margin-bottom:15px
}

h1{
font-family:Georgia,"Times New Roman",serif;
font-size:29px;
margin-bottom:7px
}

.intro{
font-size:12px;
color:#667085;
margin-bottom:22px
}

label{
display:block;
font-size:11px;
font-weight:800;
margin-bottom:6px
}

input{
width:100%;
height:45px;
padding:10px 12px;
border:1px solid #d8dee8;
border-radius:8px;
font:inherit;
font-size:13px;
outline:none
}

input:focus{
border-color:#0b376d
}

button{
width:100%;
height:45px;
margin-top:16px;
border:0;
border-radius:8px;
background:#0b376d;
color:#fff;
font-size:13px;
font-weight:800;
cursor:pointer
}

button:hover{
background:#082d5a
}

.message{
display:none;
margin-top:13px;
padding:10px;
border-radius:8px;
font-size:11px
}

.links{
display:flex;
justify-content:center;
gap:6px;
margin-top:18px;
font-size:11px;
color:#667085
}

.links a{
color:#0b376d;
font-weight:800
}

footer{
padding:22px;
background:#081d38;
color:#8192a8;
text-align:center;
font-size:10px
}
</style>
</head>

<body>

<header>

<div class="container nav">

<a href="index.html" class="brand">

<div class="logo">GOH</div>

<div>
<strong>GOH Bible Academy</strong>
<small>GATE OF HEAVEN MINISTRIES</small>
</div>

</a>

<a href="index.html" class="home">Home</a>

</div>

</header>


<main>

<div class="card">

<div class="icon">🔐</div>

<h1>Reset Password</h1>

<p class="intro">
Enter the email address associated with your
student account. We'll help you reset your password.
</p>

<form id="resetForm">

<label for="email">Email Address</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
autocomplete="email"
required>

<button type="submit">
Send Reset Request
</button>

<div class="message" id="message"></div>

</form>

<div class="links">
<a href="login.html">Back to Login</a>
<span>•</span>
<a href="enroll.html">Register</a>
</div>

</div>

</main>


<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

document.getElementById("resetForm").addEventListener("submit",function(e){

e.preventDefault();

const email=document.getElementById("email").value.trim();
const message=document.getElementById("message");

if(!email){
return;
}

/*
Temporary GitHub Pages version.

The real password reset API can be connected later.
*/

message.style.display="block";
message.style.background="#fff8e5";
message.style.color="#705b18";

message.textContent=
"Password reset will be available after the secure account system is connected.";

});

</script>

</body>
</html>
