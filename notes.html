<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Study Notes | GOH Bible Academy</title>

<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--navy:#0b376d;
--blue:#155eef;
--purple:#6941c6;
--green:#079455;
--text:#172033;
--muted:#667085;
--bg:#f4f7fb;
--border:#e4e7ec;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh
}

a{text-decoration:none}

header{
background:linear-gradient(135deg,#0b376d,#155eef);
color:#fff;
padding:12px 18px;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 18px #0002
}

.header-inner{
max-width:950px;
margin:auto;
display:flex;
align-items:center;
gap:11px
}

.logo{
width:43px;
height:43px;
border-radius:11px;
background:#fff;
color:var(--navy);
display:grid;
place-items:center;
font-weight:900;
flex-shrink:0
}

.brand-title{
font-size:17px;
font-weight:800
}

.brand-sub{
font-size:9px;
opacity:.8;
margin-top:3px;
letter-spacing:.5px
}

main{
max-width:900px;
margin:auto;
padding:22px 15px 45px
}

.back{
display:inline-block;
color:var(--blue);
font-size:13px;
font-weight:800;
margin-bottom:17px
}

.hero{
background:linear-gradient(135deg,#155eef,#6941c6);
color:#fff;
border-radius:18px;
padding:24px;
margin-bottom:15px;
box-shadow:0 10px 25px #155eef25
}

.label{
font-size:10px;
font-weight:900;
letter-spacing:1px;
opacity:.82
}

.hero h1{
font-size:26px;
margin:7px 0
}

.hero p{
font-size:13px;
color:#e7edff;
line-height:1.5
}

.languages{
display:flex;
gap:7px;
margin-bottom:15px
}

.lang{
flex:1;
border:1px solid var(--border);
background:#fff;
color:var(--text);
padding:10px;
border-radius:9px;
font-size:12px;
font-weight:800;
cursor:pointer
}

.lang.active{
background:var(--navy);
border-color:var(--navy);
color:#fff
}

.notes{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:24px;
box-shadow:0 5px 18px #10182808
}

.notes-title{
font-size:22px;
font-weight:900;
color:var(--navy);
margin-bottom:16px
}

.content{
font-size:14px;
line-height:1.8;
color:#344054;
white-space:pre-line
}

.content strong{
color:var(--navy)
}

.loading{
text-align:center;
padding:35px 10px;
color:var(--muted);
font-size:13px
}

.error{
background:#fff1f3;
border:1px solid #fecdd3;
color:#be123c;
border-radius:12px;
padding:18px;
font-size:13px;
line-height:1.6
}

.retry{
margin-top:12px;
border:0;
background:var(--blue);
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:800;
cursor:pointer
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:18px
}

.nav-btn{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:12px;
border-radius:9px;
background:var(--navy);
color:#fff;
font-size:12px;
font-weight:800
}

.nav-btn:hover{
opacity:.92
}

.nav-btn.disabled{
background:#eaecf0;
color:#98a2b3;
pointer-events:none
}

footer{
text-align:center;
color:var(--muted);
font-size:11px;
padding:25px 15px
}

@media(max-width:600px){

main{
padding:18px 12px 35px
}

.hero{
padding:21px
}

.hero h1{
font-size:23px
}

.notes{
padding:18px
}

.notes-title{
font-size:20px
}

.content{
font-size:13px;
line-height:1.75
}

.lang{
font-size:11px;
padding:9px 4px
}
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">GOH</div>

<div>
<div class="brand-title">
GOH Bible Academy
</div>

<div class="brand-sub">
GATE OF HEAVEN MINISTRIES
</div>
</div>

</div>

</header>

<main>

<a class="back" href="course.html">
← Course
</a>

<section class="hero">

<div class="label" id="monthLabel">
MONTH 01 • STUDY NOTES
</div>

<h1 id="pageTitle">
Study Notes
</h1>

<p>
Biblical study notes for your course.
</p>

</section>

<div class="languages">

<button class="lang active"
onclick="changeLanguage('en',this)">
English
</button>

<button class="lang"
onclick="changeLanguage('ta',this)">
தமிழ்
</button>

<button class="lang"
onclick="changeLanguage('si',this)">
සිංහල
</button>

</div>

<section class="notes">

<div id="notesArea">

<div class="loading">
Loading study notes...
</div>

</div>

</section>

<div class="navigation">

<a class="nav-btn disabled"
id="previousBtn">
← Previous
</a>

<a class="nav-btn"
id="nextBtn">
Next →
</a>

</div>

</main>

<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API=
"https://goh-bible-exam-api.createlk.workers.dev";

/*
  Open this page like:

  notes.html?month=1
  notes.html?month=2
  notes.html?month=3

  One HTML file handles all 12 months.
*/

const params=
new URLSearchParams(location.search);

let MONTH=
Number(params.get("month")||1);

if(!Number.isInteger(MONTH)||MONTH<1||MONTH>12){
MONTH=1;
}

let currentLanguage="en";
let noteData=null;


/* MONTH LABEL */

document.getElementById("monthLabel").textContent=
"MONTH "+String(MONTH).padStart(2,"0")+" • STUDY NOTES";


/* PREVIOUS */

const previousBtn=
document.getElementById("previousBtn");

if(MONTH>1){

previousBtn.href=
"notes.html?month="+(MONTH-1);

previousBtn.classList.remove("disabled");

}


/* NEXT */

const nextBtn=
document.getElementById("nextBtn");

if(MONTH<12){

nextBtn.href=
"notes.html?month="+(MONTH+1);

}else{

nextBtn.textContent="✓ Course Complete";
nextBtn.classList.add("disabled");

}


/* LOAD NOTES */

async function loadNotes(){

const area=
document.getElementById("notesArea");

area.innerHTML=
`
<div class="loading">
Loading study notes...
</div>
`;

try{

const response=
await fetch(
API+"/notes?month="+MONTH,
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Notes API returned HTTP "+response.status
);

}

const data=
await response.json();

if(!data.success){

throw new Error(
data.error||"Unable to load notes."
);

}

if(!Array.isArray(data.notes)||data.notes.length===0){

throw new Error(
"No study notes found for Month "+MONTH+"."
);

}

/*
  Your current database has ONE row
  for each month, with title/content.
*/

noteData=data.notes[0];

showNotes();

}catch(error){

area.innerHTML=
`
<div class="error">

<strong>
Unable to load the lesson notes.
</strong>

<br><br>

${escapeHtml(error.message)}

<br>

<button class="retry"
onclick="loadNotes()">
Try Again
</button>

</div>
`;

}

}


/* DISPLAY NOTES */

function showNotes(){

if(!noteData)return;

let title;
let content;

if(currentLanguage==="ta"){

title=
noteData.title_tamil;

content=
noteData.content_tamil;

}else if(currentLanguage==="si"){

title=
noteData.title_sinhala;

content=
noteData.content_sinhala;

}else{

title=
noteData.title;

content=
noteData.content;

}


/*
  If translation is not yet stored in D1,
  don't silently show English.
*/

if(currentLanguage==="ta" &&
(!content||content.trim()==="")){

document.getElementById("pageTitle").textContent=
noteData.title||"Study Notes";

document.getElementById("notesArea").innerHTML=
`
<div class="error"
style="background:#fffaf0;border-color:#fedf89;color:#9a6700">

<strong>தமிழ் குறிப்புகள் இன்னும் சேர்க்கப்படவில்லை.</strong>

<br><br>

Tamil notes for this month are not yet stored
in the database.

</div>
`;

return;

}


if(currentLanguage==="si" &&
(!content||content.trim()==="")){

document.getElementById("pageTitle").textContent=
noteData.title||"Study Notes";

document.getElementById("notesArea").innerHTML=
`
<div class="error"
style="background:#fffaf0;border-color:#fedf89;color:#9a6700">

<strong>සිංහල සටහන් තවම එකතු කර නැත.</strong>

<br><br>

Sinhala notes for this month are not yet stored
in the database.

</div>
`;

return;

}


document.getElementById("pageTitle").textContent=
title||"Study Notes";

document.getElementById("notesArea").innerHTML=
`

<div class="notes-title">
${escapeHtml(title||"Study Notes")}
</div>

<div class="content">
${formatContent(content||"")}
</div>

`;

}


/* LANGUAGE */

function changeLanguage(language,button){

currentLanguage=language;

document
.querySelectorAll(".lang")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

showNotes();

}


/* FORMAT */

function formatContent(text){

return escapeHtml(text)

.replace(
/(John 3:16|Ephesians 2:8-9|Ephesians 2:8–9|2 Corinthians 5:17|Acts 3:19|Romans 10:9|Galatians 2:20)/g,
"<strong>$1</strong>"
);

}


/* SECURITY */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

loadNotes();

</script>

</body>
</html>
