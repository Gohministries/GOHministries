<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Reports</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:14px 18px}
.head{max-width:1050px;margin:auto}
nav{display:flex;gap:8px;margin-top:12px;overflow:auto}
nav a{background:#fff;color:#155eef;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:13px;white-space:nowrap}
main{max-width:1050px;margin:auto;padding:18px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat strong{display:block;font-size:24px;margin-top:7px}
label{display:block;font-size:13px;font-weight:bold;margin:8px 0 6px}
input{width:100%;padding:11px;border:1px solid #d5dbe5;border-radius:8px}
button{border:0;border-radius:8px;padding:11px 15px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer;margin-top:14px}
.secondary{background:#475467}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#f8fafc;color:#667085}
.small{font-size:13px;color:#667085}
@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="head">
<b>GOH Ministries Finance</b>

<nav>
<a href="finance-dashboard.html">Dashboard</a>
<a href="income.html">Income</a>
<a href="expenses.html">Expenses</a>
<a href="reports.html">Reports</a>
<a href="receipts.html">Receipts</a>
<a href="admin.html">Administration</a>
</nav>
</div>
</header>

<main>

<div class="card">
<h2>Finance Reports</h2>
<p class="small">View income, expenses and balance for a selected period.</p>
</div>

<div class="card">

<h3>Date Range</h3>

<div class="grid">

<div>
<label>From</label>
<input id="from" type="date">
</div>

<div>
<label>To</label>
<input id="to" type="date">
</div>

</div>

<button onclick="generate()">Generate Report</button>
<button class="secondary" onclick="downloadCSV()">Export CSV</button>

</div>

<div class="stats">

<div class="card stat">
<div class="small">Income</div>
<strong id="income">LKR 0.00</strong>
</div>

<div class="card stat">
<div class="small">Expenses</div>
<strong id="expenses">LKR 0.00</strong>
</div>

<div class="card stat">
<div class="small">Balance</div>
<strong id="balance">LKR 0.00</strong>
</div>

</div>

<div class="card">

<h3>Report Details</h3>

<div class="table">

<table>

<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Description</th>
<th>Category</th>
<th>Amount</th>
</tr>
</thead>

<tbody id="rows">
<tr>
<td colspan="5">Generate a report.</td>
</tr>
</tbody>

</table>

</div>

</div>

</main>

<script>

const API=
"https://goh-finance.createlk.workers.dev";

const KEY=
"goh_finance_token";

let report=[];

function headers(){
return{
"Content-Type":"application/json",
"Authorization":
"Bearer "+localStorage.getItem(KEY)
};
}

function money(v){
return "LKR "+
Number(v||0).toLocaleString(
"en-LK",
{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function today(){
const d=new Date();
return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");
}

function firstDay(){
const d=new Date();
return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-01";
}

document.getElementById("from").value=firstDay();
document.getElementById("to").value=today();

async function check(){

const token=
localStorage.getItem(KEY);

if(!token){
location.href="admin-login.html";
return false;
}

try{

const r=await fetch(
API+"/api/me",
{headers:headers()}
);

if(!r.ok)throw Error();

return true;

}catch(e){

localStorage.removeItem(KEY);
location.href="admin-login.html";
return false;

}

}


async function generate(){

const from=
document.getElementById("from").value;

const to=
document.getElementById("to").value;

if(!from||!to){
alert("Select both dates.");
return;
}

if(from>to){
alert("From date cannot be after To date.");
return;
}

try{

const [ir,er]=await Promise.all([

fetch(
API+"/api/finance/income",
{headers:headers()}
),

fetch(
API+"/api/finance/expenses",
{headers:headers()}
)

]);

const incomeData=await ir.json();
const expenseData=await er.json();

if(!ir.ok||!incomeData.success)
throw Error(
incomeData.error||"Unable to load income"
);

if(!er.ok||!expenseData.success)
throw Error(
expenseData.error||"Unable to load expenses"
);

const income=(incomeData.income||[])
.filter(x=>
String(x.date||"")>=from&&
String(x.date||"")<=to
)
.map(x=>({
date:x.date,
type:"Income",
description:x.source||"Income",
category:x.category||"",
amount:Number(x.amount)||0
}));

const expenses=(expenseData.expenses||[])
.filter(x=>
String(x.date||"")>=from&&
String(x.date||"")<=to
)
.map(x=>({
date:x.date,
type:"Expense",
description:x.description||"Expense",
category:x.category||"",
amount:Number(x.amount)||0
}));

report=[...income,...expenses]
.sort((a,b)=>
String(b.date).localeCompare(String(a.date))
);

const totalIncome=
income.reduce((s,x)=>s+x.amount,0);

const totalExpenses=
expenses.reduce((s,x)=>s+x.amount,0);

document.getElementById("income")
.textContent=money(totalIncome);

document.getElementById("expenses")
.textContent=money(totalExpenses);

document.getElementById("balance")
.textContent=
money(totalIncome-totalExpenses);

document.getElementById("rows")
.innerHTML=

report.map(x=>`

<tr>
<td>${esc(x.date)}</td>
<td>${esc(x.type)}</td>
<td>${esc(x.description)}</td>
<td>${esc(x.category)}</td>
<td>${money(x.amount)}</td>
</tr>

`).join("")||

`<tr>
<td colspan="5">No records found.</td>
</tr>`;

}catch(e){

alert(e.message);

}

}


function downloadCSV(){

if(!report.length){
alert("Generate a report first.");
return;
}

const lines=[
["Date","Type","Description","Category","Amount"],
...report.map(x=>[
x.date,
x.type,
x.description,
x.category,
x.amount
])
];

const csv=
lines.map(row=>
row.map(v=>
`"${String(v??"").replaceAll('"','""')}"`
).join(",")
).join("\n");

const blob=
new Blob([csv],{
type:"text/csv;charset=utf-8"
});

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download=
"goh-finance-report.csv";

a.click();

URL.revokeObjectURL(url);

}


check().then(ok=>{
if(ok)generate();
});

</script>

</body>
</html>
