<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Study Notes | GOH Bible Academy</title>

<meta name="theme-color" content="#0b376d">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#0b376d;
  --blue:#155eef;
  --text:#172033;
  --muted:#667085;
  --bg:#f4f7fb;
  --card:#fff;
  --border:#e4e7ec;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
}

header{
  background:var(--primary);
  color:#fff;
  padding:12px 16px;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#fff;
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:900;
}

.brand{
  font-size:16px;
  font-weight:800;
}

.sub{
  font-size:9px;
  opacity:.75;
  margin-top:2px;
  letter-spacing:.5px;
}

main{
  max-width:900px;
  margin:auto;
  padding:20px 15px 45px;
}

.back{
  display:inline-flex;
  color:var(--primary);
  font-size:13px;
  font-weight:800;
  margin-bottom:18px;
}

.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  margin-bottom:14px;
}

.month{
  color:var(--blue);
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
}

h1{
  font-size:27px;
  line-height:1.25;
  margin:6px 0;
}

.description{
  color:var(--muted);
  font-size:13px;
}

.languages{
  display:flex;
  gap:7px;
  margin-top:17px;
  flex-wrap:wrap;
}

.lang{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
}

.lang.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.notes{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  min-height:220px;
}

.note{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--border);
}

.note:last-child{
  border-bottom:0;
  margin-bottom:0;
  padding-bottom:0;
}

.note h2{
  font-size:19px;
  color:var(--primary);
  margin-bottom:12px;
}

.content{
  white-space:pre-wrap;
  font-size:14px;
  color:#344054;
}

.loading{
  text-align:center;
  padding:45px 10px;
  color:var(--muted);
  font-size:13px;
}

.error{
  text-align:center;
  padding:35px 10px;
  color:#b42318;
  font-size:13px;
}

.retry{
  margin-top:12px;
  background:var(--primary);
  color:#fff;
  border:0;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:800;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.nav-btn{
  flex:1;
  text-align:center;
  background:#fff;
  border:1px solid var(--border);
  color:var(--primary);
  padding:11px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

.nav-btn:hover{
  background:#f8fafc;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:20px 15px;
}

@media(max-width:600px){

  main{
    padding:17px 12px 35px;
  }

  .hero{
    padding:18px;
  }

  h1{
    font-size:23px;
  }

  .notes{
    padding:18px;
  }

  .content{
    font-size:13px;
  }

  .lang{
    flex:1;
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">GOH</div>

    <div>
      <div class="brand">GOH Bible Academy</div>
      <div class="sub">GATE OF HEAVEN MINISTRIES</div>
    </div>
  </div>
</header>


<main>

<a class="back" href="course.html">
  ← Course
</a>


<section class="hero">

  <div class="month">
    MONTH <span id="monthNumber">01</span> • STUDY NOTES
  </div>

  <h1 id="pageTitle">
    Study Notes
  </h1>

  <div class="description" id="description">
    Biblical study notes for your course.
  </div>


  <div class="languages">

    <button
      class="lang active"
      id="langEn"
      onclick="setLanguage('en')">
      English
    </button>

    <button
      class="lang"
      id="langTa"
      onclick="setLanguage('ta')">
      தமிழ்
    </button>

    <button
      class="lang"
      id="langSi"
      onclick="setLanguage('si')">
      සිංහල
    </button>

  </div>

</section>


<section class="notes" id="notes">

  <div class="loading">
    Loading lesson notes...
  </div>

</section>


<div class="navigation">

  <a class="nav-btn" href="course.html">
    ← Previous
  </a>

  <a class="nav-btn" href="exam.html?month=1">
    Next →
  </a>

</div>

</main>


<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

const API =
"https://goh-bible-exam-api.createlk.workers.dev";

const params =
new URLSearchParams(location.search);

const month =
Number(params.get("month") || 1);

let notesData = [];

let language = "en";


document.getElementById("monthNumber").textContent =
String(month).padStart(2,"0");


/* LOAD NOTES */

async function loadNotes(){

  const box =
    document.getElementById("notes");

  box.innerHTML =
    '<div class="loading">Loading lesson notes...</div>';

  try{

    const response =
      await fetch(
        API + "/notes?month=" + month
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){
      throw new Error(
        data.error || "Unable to load notes"
      );
    }

    notesData =
      Array.isArray(data.notes)
      ? data.notes
      : [];

    if(!notesData.length){

      box.innerHTML = `
        <div class="loading">
          No study notes are available for this month yet.
        </div>
      `;

      return;
    }

    renderNotes();

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="error">
        Unable to load the lesson notes.
        <br>
        <button class="retry" onclick="loadNotes()">
          Try Again
        </button>
      </div>
    `;
  }
}


/* LANGUAGE */

function setLanguage(lang){

  language = lang;

  document
    .getElementById("langEn")
    .classList.toggle(
      "active",
      lang === "en"
    );

  document
    .getElementById("langTa")
    .classList.toggle(
      "active",
      lang === "ta"
    );

  document
    .getElementById("langSi")
    .classList.toggle(
      "active",
      lang === "si"
    );

  renderNotes();
}


/* RENDER */

function renderNotes(){

  const box =
    document.getElementById("notes");

  if(!notesData.length){
    return;
  }

  box.innerHTML =
    notesData.map(note => {

      let title =
        note.title || "Study Note";

      let content =
        note.content || "";

      if(language === "ta"){

        if(note.content_tamil){
          content =
            note.content_tamil;
        }else{
          content =
            note.content || "";
        }

      }

      if(language === "si"){

        if(note.content_sinhala){
          content =
            note.content_sinhala;
        }else{
          content =
            note.content || "";
        }

      }

      return `
        <article class="note">

          <h2>
            ${escapeHTML(title)}
          </h2>

          <div class="content">
            ${escapeHTML(content)}
          </div>

        </article>
      `;

    }).join("");

}


/* SAFE HTML */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* START */

loadNotes();

</script>

</body>
</html>
