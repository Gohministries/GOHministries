<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Month 01 Study Notes | GOH Bible Academy</title>

<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--navy:#0b376d;
--blue:#155eef;
--purple:#6941c6;
--green:#079455;
--orange:#f79009;
--pink:#db2777;
--cyan:#0891b2;
--text:#172033;
--muted:#667085;
--bg:#f4f7fb;
--border:#e4e7ec;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}

header{
background:linear-gradient(135deg,#0b376d,#155eef);
color:#fff;
padding:12px 18px;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 18px #0002;
}

.header-inner{
max-width:1050px;
margin:auto;
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:43px;
height:43px;
border-radius:11px;
background:#fff;
color:var(--navy);
display:grid;
place-items:center;
font-weight:900;
flex-shrink:0;
}

.brand-title{
font-size:17px;
font-weight:800;
}

.brand-sub{
font-size:9px;
opacity:.8;
margin-top:3px;
letter-spacing:.5px;
}

main{
max-width:900px;
margin:auto;
padding:22px 15px 45px;
}

.back{
display:inline-flex;
align-items:center;
gap:6px;
color:var(--blue);
font-size:13px;
font-weight:800;
text-decoration:none;
margin-bottom:18px;
}

.hero{
background:linear-gradient(135deg,#155eef,#6941c6);
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:16px;
box-shadow:0 10px 25px #155eef25;
}

.label{
font-size:10px;
font-weight:900;
letter-spacing:1px;
opacity:.8;
}

.hero h1{
font-size:27px;
margin:7px 0;
}

.hero p{
font-size:13px;
color:#e6edff;
line-height:1.5;
}

.languages{
display:flex;
gap:7px;
margin-bottom:15px;
}

.lang{
border:1px solid var(--border);
background:#fff;
padding:9px 14px;
border-radius:9px;
font-size:12px;
font-weight:800;
cursor:pointer;
color:var(--text);
}

.lang.active{
background:var(--navy);
color:#fff;
border-color:var(--navy);
}

.notes{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:24px;
box-shadow:0 5px 18px #10182808;
}

.notes-title{
font-size:22px;
font-weight:900;
margin-bottom:15px;
color:var(--navy);
}

.content{
font-size:14px;
line-height:1.75;
color:#344054;
white-space:pre-line;
}

.content strong{
color:var(--navy);
}

.loading{
text-align:center;
padding:30px;
color:var(--muted);
}

.error{
background:#fff1f3;
border:1px solid #fecdd3;
color:#be123c;
border-radius:12px;
padding:18px;
font-size:13px;
line-height:1.6;
}

.retry{
margin-top:12px;
border:0;
background:var(--blue);
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:800;
cursor:pointer;
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:18px;
}

.nav-btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:11px 16px;
border-radius:9px;
background:var(--navy);
color:#fff;
text-decoration:none;
font-size:12px;
font-weight:800;
}

.nav-btn.disabled{
background:#eaecf0;
color:#98a2b3;
pointer-events:none;
}

footer{
text-align:center;
color:var(--muted);
font-size:11px;
padding:25px 15px;
}

@media(max-width:600px){

main{
padding:18px 12px 35px;
}

.hero{
padding:21px;
}

.hero h1{
font-size:23px;
}

.notes{
padding:18px;
}

.notes-title{
font-size:20px;
}

.content{
font-size:13px;
line-height:1.7;
}

.languages{
width:100%;
}

.lang{
flex:1;
padding:9px 5px;
}

.navigation{
position:relative;
}

.nav-btn{
flex:1;
}
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">GOH</div>

<div>
<div class="brand-title">
GOH Bible Academy
</div>

<div class="brand-sub">
GATE OF HEAVEN MINISTRIES
</div>
</div>

</div>

</header>

<main>

<a class="back" href="course.html">
← Course
</a>

<section class="hero">

<div class="label">
MONTH 01 • STUDY NOTES
</div>

<h1 id="heroTitle">
Study Notes
</h1>

<p>
Biblical study notes for your course.
</p>

</section>

<div class="languages">

<button class="lang active"
onclick="changeLanguage('en',this)">
English
</button>

<button class="lang"
onclick="changeLanguage('ta',this)">
தமிழ்
</button>

<button class="lang"
onclick="changeLanguage('si',this)">
සිංහල
</button>

</div>

<section class="notes">

<div id="notesArea">

<div class="loading">
Loading study notes...
</div>

</div>

</section>

<div class="navigation">

<a class="nav-btn disabled"
id="previousBtn">
← Previous
</a>

<a class="nav-btn"
id="nextBtn"
href="month2-notes.html">
Next →
</a>

</div>

</main>

<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API=
"https://goh-bible-exam-api.createlk.workers.dev";

const MONTH=1;

let currentLanguage="en";

let noteData=null;


/* LOAD NOTES */

async function loadNotes(){

const area=document.getElementById("notesArea");

area.innerHTML=
`<div class="loading">Loading study notes...</div>`;

try{

const response=
await fetch(
API+"/notes?month="+MONTH
);

if(!response.ok){
throw new Error("Unable to connect to Notes API");
}

const data=
await response.json();

if(
!data.success ||
!data.notes ||
!data.notes.length
){

throw new Error(
"No study notes were found for this month."
);

}

noteData=data.notes[0];

showNotes();

}catch(error){

area.innerHTML=`

<div class="error">

<strong>Unable to load the lesson notes.</strong>

<br><br>

${escapeHtml(error.message)}

<br>

<button class="retry"
onclick="loadNotes()">
Try Again
</button>

</div>

`;

}

}


/* SHOW NOTES */

function showNotes(){

if(!noteData)return;

const title=
currentLanguage==="ta"
?
(noteData.title_tamil || noteData.title)
:
currentLanguage==="si"
?
(noteData.title_sinhala || noteData.title)
:
noteData.title;

const content=
currentLanguage==="ta"
?
(noteData.content_tamil || noteData.content)
:
currentLanguage==="si"
?
(noteData.content_sinhala || noteData.content)
:
noteData.content;

document.getElementById("heroTitle").textContent=
title || "Study Notes";

document.getElementById("notesArea").innerHTML=`

<div class="notes-title">
${escapeHtml(title || "Study Notes")}
</div>

<div class="content">
${formatContent(content || "")}
</div>

`;

}


/* LANGUAGE */

function changeLanguage(language,button){

currentLanguage=language;

document
.querySelectorAll(".lang")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

showNotes();

}


/* FORMAT TEXT SAFELY */

function formatContent(text){

return escapeHtml(text)
.replace(
/(Ephesians 2:8-9|Ephesians 2:8–9|John 3:16|2 Corinthians 5:17|Acts 3:19|Romans 10:9|Galatians 2:20)/g,
"<strong>$1</strong>"
);

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOAD */

loadNotes();

</script>

</body>
</html>
