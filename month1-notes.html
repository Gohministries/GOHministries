<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Month 01 | GOH Bible Academy</title>
<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:#0b376d;
  --blue:#155eef;
  --text:#172033;
  --muted:#667085;
  --bg:#f4f7fb;
  --card:#fff;
  --border:#e4e7ec;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

header{
  background:var(--primary);
  color:#fff;
  padding:12px 16px;
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#fff;
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:900;
}

.brand-title{
  font-size:16px;
  font-weight:800;
}

.brand-sub{
  font-size:9px;
  opacity:.75;
  letter-spacing:.5px;
}

main{
  max-width:900px;
  margin:auto;
  padding:20px 14px 45px;
}

.back{
  display:inline-block;
  color:var(--primary);
  font-size:13px;
  font-weight:800;
  margin-bottom:16px;
}

.hero{
  background:linear-gradient(135deg,#0b376d,#155eef);
  color:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:14px;
}

.label{
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  opacity:.8;
}

h1{
  font-size:25px;
  margin:5px 0;
}

.hero p{
  font-size:12px;
  color:#dce7f3;
}

.languages{
  display:flex;
  gap:7px;
  margin-bottom:14px;
}

.lang{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  padding:8px 13px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
}

.lang.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.status{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
}

.notes{
  display:none;
}

.notes.active{
  display:block;
}

.note{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:13px;
}

.note-number{
  color:var(--blue);
  font-size:11px;
  font-weight:900;
  margin-bottom:4px;
}

.note-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:10px;
}

.note-content{
  color:#344054;
  font-size:14px;
  white-space:pre-line;
}

.note-content p{
  margin-bottom:10px;
}

.note-content strong{
  color:var(--primary);
}

.nav-buttons{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:11px 17px;
  border-radius:8px;
  border:0;
  background:var(--primary);
  color:#fff;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
}

.btn:disabled{
  background:#d0d5dd;
  cursor:not-allowed;
}

.retry{
  margin-top:10px;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:20px;
}

@media(max-width:600px){
  main{padding:16px 11px 35px}
  .hero{padding:19px}
  h1{font-size:22px}
  .note{padding:17px}
  .note-title{font-size:17px}
  .note-content{font-size:13px}
  .languages{overflow-x:auto}
  .lang{white-space:nowrap}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">GOH</div>
    <div>
      <div class="brand-title">GOH Bible Academy</div>
      <div class="brand-sub">GATE OF HEAVEN MINISTRIES</div>
    </div>
  </div>
</header>

<main>

<a class="back" href="course.html">← Course</a>

<section class="hero">
  <div class="label">MONTH 01 • STUDY NOTES</div>
  <h1>New Life in Christ</h1>
  <p>
    Understanding salvation, repentance, faith and your new identity in Christ.
  </p>
</section>

<div class="languages">
  <button class="lang active" data-lang="en">English</button>
  <button class="lang" data-lang="tamil">தமிழ்</button>
  <button class="lang" data-lang="sinhala">සිංහල</button>
</div>

<div id="status" class="status">
  Loading study notes...
</div>

<div id="notesEn" class="notes"></div>
<div id="notesTamil" class="notes"></div>
<div id="notesSinhala" class="notes"></div>

<div class="nav-buttons">
  <button class="btn" id="prevBtn" onclick="previousNote()">
    ← Previous
  </button>

  <button class="btn" id="nextBtn" onclick="nextNote()">
    Next →
  </button>
</div>

</main>

<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API =
"https://goh-bible-exam-api.createlk.workers.dev";

const MONTH = 1;

let notes = [];
let current = 0;
let language = "en";


/* --------------------------------
   LOAD NOTES
-------------------------------- */

async function loadNotes(){

  const status = document.getElementById("status");

  status.style.display = "block";
  status.innerHTML = "Loading study notes...";

  try{

    const response =
      await fetch(`${API}/notes?month=${MONTH}`);

    if(!response.ok){
      throw new Error("API error");
    }

    const data = await response.json();

    if(!data.success || !Array.isArray(data.notes)){
      throw new Error("Invalid notes response");
    }

    notes = data.notes;

    if(!notes.length){
      status.innerHTML =
        "No study notes found for Month 01.";
      return;
    }

    status.style.display = "none";

    buildNotes();

  }catch(error){

    console.error(error);

    status.innerHTML = `
      Unable to load the lesson notes.
      <div class="retry">
        <button class="btn" onclick="loadNotes()">
          Try Again
        </button>
      </div>
    `;
  }
}


/* --------------------------------
   FIND COLUMN
-------------------------------- */

function getValue(row, names){

  for(const name of names){

    if(
      row[name] !== undefined &&
      row[name] !== null &&
      String(row[name]).trim() !== ""
    ){
      return row[name];
    }
  }

  return "";
}


/* --------------------------------
   GET LANGUAGE DATA
-------------------------------- */

function getTitle(row, lang){

  if(lang === "tamil"){

    return getValue(row,[
      "title_tamil",
      "title_ta",
      "name_tamil",
      "heading_tamil"
    ]);
  }

  if(lang === "sinhala"){

    return getValue(row,[
      "title_sinhala",
      "title_si",
      "name_sinhala",
      "heading_sinhala"
    ]);
  }

  return getValue(row,[
    "title_en",
    "title",
    "name_en",
    "heading_en",
    "heading"
  ]);
}


function getContent(row, lang){

  if(lang === "tamil"){

    return getValue(row,[
      "content_tamil",
      "content_ta",
      "note_tamil",
      "notes_tamil",
      "description_tamil",
      "text_tamil",
      "body_tamil"
    ]);
  }

  if(lang === "sinhala"){

    return getValue(row,[
      "content_sinhala",
      "content_si",
      "note_sinhala",
      "notes_sinhala",
      "description_sinhala",
      "text_sinhala",
      "body_sinhala"
    ]);
  }

  return getValue(row,[
    "content_en",
    "content",
    "note_en",
    "notes_en",
    "description_en",
    "text_en",
    "body_en",
    "note",
    "notes"
  ]);
}


/* --------------------------------
   BUILD NOTES
-------------------------------- */

function buildNotes(){

  const containers = {
    en:document.getElementById("notesEn"),
    tamil:document.getElementById("notesTamil"),
    sinhala:document.getElementById("notesSinhala")
  };

  Object.values(containers).forEach(el=>{
    el.innerHTML="";
  });

  notes.forEach((row,index)=>{

    const lesson =
      getValue(row,[
        "lesson",
        "lesson_no",
        "lesson_number"
      ]) || (index+1);

    ["en","tamil","sinhala"].forEach(lang=>{

      let title = getTitle(row,lang);
      let content = getContent(row,lang);

      /* Fallback to English if translation column
         does not exist yet */
      if(!title && lang !== "en"){
        title = getTitle(row,"en");
      }

      if(!content && lang !== "en"){
        content = getContent(row,"en");
      }

      const article =
        document.createElement("article");

      article.className = "note";

      article.innerHTML = `
        <div class="note-number">
          LESSON ${escapeHTML(lesson)}
        </div>

        <div class="note-title">
          ${escapeHTML(title || "Study Note")}
        </div>

        <div class="note-content">
          ${formatContent(content)}
        </div>
      `;

      containers[lang].appendChild(article);

    });

  });

  showLanguage(language);
}


/* --------------------------------
   DISPLAY LANGUAGE
-------------------------------- */

function showLanguage(lang){

  language = lang;

  document
    .querySelectorAll(".notes")
    .forEach(el=>el.classList.remove("active"));

  const container =
    document.getElementById(
      lang === "en"
      ? "notesEn"
      : lang === "tamil"
      ? "notesTamil"
      : "notesSinhala"
    );

  if(container){
    container.classList.add("active");
  }

  document
    .querySelectorAll(".lang")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.lang === lang
      );
    });

  current = 0;

  updateButtons();
}


/* --------------------------------
   LANGUAGE BUTTONS
-------------------------------- */

document
  .querySelectorAll(".lang")
  .forEach(button=>{

    button.addEventListener("click",()=>{
      showLanguage(button.dataset.lang);
    });

  });


/* --------------------------------
   NEXT / PREVIOUS
-------------------------------- */

function previousNote(){

  if(current > 0){
    current--;
    scrollToNote();
  }

}

function nextNote(){

  if(current < notes.length-1){
    current++;
    scrollToNote();
  }

}

function scrollToNote(){

  const container =
    document.getElementById(
      language === "en"
      ? "notesEn"
      : language === "tamil"
      ? "notesTamil"
      : "notesSinhala"
    );

  if(!container)return;

  const item =
    container.children[current];

  if(item){
    item.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }

  updateButtons();
}


function updateButtons(){

  document.getElementById("prevBtn").disabled =
    current <= 0;

  document.getElementById("nextBtn").disabled =
    current >= notes.length-1;
}


/* --------------------------------
   SAFE HTML
-------------------------------- */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatContent(value){

  if(!value){
    return "Study content unavailable.";
  }

  return escapeHTML(value)
    .replace(/\n\n/g,"</p><p>")
    .replace(/\n/g,"<br>");
}


/* --------------------------------
   START
-------------------------------- */

loadNotes();

</script>

</body>
</html>
