<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOH Bible School</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}
header{background:#173b73;color:white;text-align:center;padding:18px}
main{max-width:700px;margin:20px auto;padding:10px}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 10px #ddd}
input,textarea,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}
button{background:#173b73;color:white;border:0;border-radius:7px}
.hidden{display:none}
.success{color:green}
.error{color:red}
</style>
</head>

<body>

<header>
<h1>GOH Bible School</h1>
</header>

<main>

<div id="login" class="card">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<h3>Register</h3>
<input id="name" placeholder="Name">
<input id="regEmail" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<p id="msg"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>Welcome <span id="student"></span></h2>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h2>Progress</h2>
<p>
Completed: <b id="completed">0</b>
</p>
<p>
Correct: <b id="correct">0</b>
</p>
<p>
Score: <b id="score">0%</b>
</p>
</div>

<div class="card">
<h2>Today's Lesson</h2>
<div id="lesson">Loading...</div>

<div id="questionBox" class="hidden">
<h3>Question</h3>
<p id="question"></p>
<input id="answer" placeholder="Your answer">
<button onclick="submitAnswer()">Submit</button>
<p id="answerMsg"></p>
</div>
</div>

<div class="card">
<h2>AI Teacher</h2>
<textarea id="aiQuestion" placeholder="Ask about this lesson"></textarea>
<button onclick="askAI()">Ask AI</button>
<p id="aiAnswer"></p>
</div>

<div class="card">
<h2>Certificate</h2>
<button onclick="certificate()">Check Certificate</button>
<p id="certificate"></p>
</div>

</div>
</main>

<script>

const API="https://goh-bible-school-api.createlk.workers.dev";
let token=localStorage.getItem("goh_token");
let lesson=null;

async function api(path,options={}){
 options.headers={
  "Content-Type":"application/json",
  ...(options.headers||{})
 };
 if(token) options.headers.Authorization="Bearer "+token;
 return fetch(API+path,options).then(r=>r.json());
}

async function register(){
 const r=await api("/api/register",{
  method:"POST",
  body:JSON.stringify({
   name:name.value,
   email:regEmail.value,
   password:regPassword.value
  })
 });
 if(!r.ok)return msg.textContent=r.error;
 token=r.token;
 localStorage.setItem("goh_token",token);
 start(r.user);
}

async function login(){
 const r=await api("/api/login",{
  method:"POST",
  body:JSON.stringify({
   email:email.value,
   password:password.value
  })
 });
 if(!r.ok)return msg.textContent=r.error;
 token=r.token;
 localStorage.setItem("goh_token",token);
 start(r.user);
}

function start(user){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 student.textContent=user.name;
 load();
}

function logout(){
 localStorage.removeItem("goh_token");
 location.reload();
}

async function load(){
 await loadProgress();
 await loadLesson();
 await certificate();
}

async function loadLesson(){
 const r=await api("/api/today");
 if(!r.ok)return lesson.textContent=r.error;

 lesson=r.lesson;

 document.getElementById("lesson").innerHTML=`
 <h3>Day ${r.day_number}: ${lesson.topic}</h3>
 <p><b>${lesson.bible_reference}</b></p>
 <p>${lesson.verse}</p>
 <p>${lesson.lesson}</p>
 <p><b>Application:</b> ${lesson.application||""}</p>
 `;

 question.textContent=lesson.question;
 document.getElementById("questionBox").classList.remove("hidden");
}

async function submitAnswer(){
 const r=await api("/api/answer",{
  method:"POST",
  body:JSON.stringify({
   lesson_id:lesson.id,
   answer:answer.value
  })
 });

 answerMsg.textContent=
 r.ok ? (r.correct?"Correct!":"Incorrect.") : r.error;

 await loadProgress();
 await certificate();
}

async function loadProgress(){
 const r=await api("/api/progress");
 if(!r.ok)return;
 completed.textContent=r.progress.completed;
 correct.textContent=r.progress.correct;
 score.textContent=r.progress.percentage+"%";
}

async function askAI(){
 if(!lesson)return;

 aiAnswer.textContent="Thinking...";

 const r=await api("/api/ai",{
  method:"POST",
  body:JSON.stringify({
   lesson_id:lesson.id,
   question:aiQuestion.value
  })
 });

 aiAnswer.textContent=r.ok?r.answer:r.error;
}

async function certificate(){
 const r=await api("/api/certificate");
 if(!r.ok)return;

 certificate.textContent=
 r.eligible
 ? `Eligible! Score: ${r.score}%`
 : `Not yet eligible. ${r.completed}/365 lessons, ${r.score}%`;
}

if(token){
 api("/api/me").then(r=>{
  if(r.ok)start(r.user);
 });
}

</script>

</body>
</html>
