<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Notes | GOH Bible Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:#0b376d;
  --blue:#155eef;
  --purple:#6941c6;
  --green:#079455;
  --bg:#f4f7fb;
  --text:#172033;
  --muted:#667085;
  --border:#e4e7ec;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:var(--primary);
  color:#fff;
  padding:12px 18px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#fff;
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:900;
}

.brand-title{
  font-size:17px;
  font-weight:800;
}

.brand-sub{
  font-size:9px;
  opacity:.75;
  margin-top:3px;
}

main{
  max-width:900px;
  margin:auto;
  padding:22px 15px 45px;
}

.back{
  display:inline-block;
  color:var(--primary);
  font-size:13px;
  font-weight:800;
  text-decoration:none;
  margin-bottom:18px;
}

.hero{
  background:linear-gradient(135deg,#0b376d,#155eef);
  color:#fff;
  border-radius:18px;
  padding:24px;
  margin-bottom:15px;
}

.month{
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
  opacity:.8;
}

h1{
  font-size:27px;
  margin:7px 0;
}

.subtitle{
  color:#dce7f3;
  font-size:13px;
  line-height:1.5;
}

.languages{
  display:flex;
  gap:7px;
  margin-top:18px;
}

.lang{
  border:0;
  background:#fff;
  color:var(--primary);
  padding:9px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.lang.active{
  background:#dbeafe;
  color:#155eef;
}

.notes{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  line-height:1.75;
  font-size:14px;
  white-space:pre-wrap;
  min-height:250px;
}

.notes-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:15px;
  color:var(--primary);
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

.error{
  text-align:center;
  background:#fff;
  border:1px solid #fecdca;
  color:#b42318;
  border-radius:14px;
  padding:22px;
  line-height:1.6;
}

.retry{
  margin-top:12px;
  border:0;
  background:var(--primary);
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.nav-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:120px;
  padding:11px 16px;
  border-radius:9px;
  background:var(--primary);
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.nav-btn.disabled{
  background:#eaecf0;
  color:#98a2b3;
  pointer-events:none;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:25px 15px;
}

@media(max-width:600px){

  main{
    padding:18px 12px 35px;
  }

  .hero{
    padding:20px;
  }

  h1{
    font-size:23px;
  }

  .languages{
    width:100%;
  }

  .lang{
    flex:1;
    padding:9px 5px;
  }

  .notes{
    padding:18px;
    font-size:13px;
  }

  .navigation{
    gap:8px;
  }

  .nav-btn{
    flex:1;
    min-width:0;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">GOH</div>

    <div>
      <div class="brand-title">GOH Bible Academy</div>
      <div class="brand-sub">GATE OF HEAVEN MINISTRIES</div>
    </div>

  </div>
</header>

<main>

<a class="back" href="course.html">
  ← Course
</a>

<section class="hero">

  <div class="month" id="monthLabel">
    MONTH 01 • STUDY NOTES
  </div>

  <h1 id="pageTitle">
    Study Notes
  </h1>

  <div class="subtitle">
    Biblical study notes for your course.
  </div>

  <div class="languages">

    <button class="lang active" onclick="changeLanguage('en')">
      English
    </button>

    <button class="lang" onclick="changeLanguage('ta')">
      தமிழ்
    </button>

    <button class="lang" onclick="changeLanguage('si')">
      සිංහල
    </button>

  </div>

</section>

<section id="content">

  <div class="loading">
    Loading lesson notes...
  </div>

</section>

<div class="navigation">

  <a id="previous" class="nav-btn" href="#">
    ← Previous
  </a>

  <a id="next" class="nav-btn" href="#">
    Next →
  </a>

</div>

</main>

<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API =
"https://goh-bible-exam-api.createlk.workers.dev";

const params =
new URLSearchParams(window.location.search);

let month =
Number(params.get("month") || 1);

if(month < 1) month = 1;
if(month > 12) month = 12;

let currentLanguage = "en";

let noteData = null;


/* LOAD NOTES */

async function loadNotes(){

  const content =
    document.getElementById("content");

  content.innerHTML = `
    <div class="loading">
      Loading lesson notes...
    </div>
  `;

  try{

    const response =
      await fetch(
        API + "/notes?month=" + month
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "Unable to load notes"
      );
    }

    if(!data.notes || !data.notes.length){
      throw new Error(
        "No notes found for this month."
      );
    }

    noteData = data.notes[0];

    renderNotes();

    updateNavigation();

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="error">

        <strong>
          Unable to load the lesson notes.
        </strong>

        <div style="margin-top:6px">
          ${escapeHtml(error.message)}
        </div>

        <button
          class="retry"
          onclick="loadNotes()">
          Try Again
        </button>

      </div>
    `;

  }

}


/* DISPLAY NOTES */

function renderNotes(){

  if(!noteData) return;

  let title =
    noteData.title || "Study Notes";

  let text = "";

  if(currentLanguage === "ta"){

    text =
      noteData.content_tamil ||
      noteData.content ||
      "தமிழ் குறிப்புகள் கிடைக்கவில்லை.";

  }else if(currentLanguage === "si"){

    text =
      noteData.content_sinhala ||
      noteData.content ||
      "සිංහල සටහන් ලබාගත නොහැක.";

  }else{

    text =
      noteData.content ||
      "Lesson notes are not available.";

  }

  document.getElementById("pageTitle")
    .textContent = title;

  document.getElementById("content").innerHTML = `

    <article class="notes">

      <div class="notes-title">
        ${escapeHtml(title)}
      </div>

      <div>
        ${formatText(text)}
      </div>

    </article>

  `;

}


/* LANGUAGE */

function changeLanguage(language){

  currentLanguage = language;

  document.querySelectorAll(".lang")
    .forEach(button=>{
      button.classList.remove("active");
    });

  if(language === "en")
    document.querySelectorAll(".lang")[0]
      .classList.add("active");

  if(language === "ta")
    document.querySelectorAll(".lang")[1]
      .classList.add("active");

  if(language === "si")
    document.querySelectorAll(".lang")[2]
      .classList.add("active");

  renderNotes();
}


/* PREVIOUS / NEXT */

function updateNavigation(){

  const previous =
    document.getElementById("previous");

  const next =
    document.getElementById("next");

  document.getElementById("monthLabel")
    .textContent =
    "MONTH " +
    String(month).padStart(2,"0") +
    " • STUDY NOTES";


  if(month <= 1){

    previous.classList.add("disabled");
    previous.removeAttribute("href");

  }else{

    previous.classList.remove("disabled");

    previous.href =
      "month" +
      (month - 1) +
      "-notes.html";

  }


  if(month >= 12){

    next.classList.add("disabled");
    next.removeAttribute("href");

  }else{

    next.classList.remove("disabled");

    next.href =
      "month" +
      (month + 1) +
      "-notes.html";

  }

}


/* FORMAT TEXT */

function formatText(text){

  return escapeHtml(text)
    .replace(/\n\n/g,"</p><p>")
    .replace(/\n/g,"<br>");
}


/* SECURITY */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

loadNotes();

</script>

</body>
</html>
