<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Dashboard | GOH Bible Academy</title>

<meta name="description"
content="GOH Bible Academy student dashboard for Christian discipleship and ministry preparation.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:#0b376d;
  --primary2:#155eef;
  --text:#172033;
  --muted:#667085;
  --bg:#f4f7fb;
  --card:#fff;
  --border:#e4e7ec;
  --green:#027a48;
  --greenbg:#ecfdf3;
  --orange:#b54708;
  --orangebg:#fffaeb;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:var(--primary);
  color:#fff;
  padding:13px 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:10px;
  background:#fff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:18px;
}

.brand-title{
  font-size:18px;
  font-weight:800;
}

.brand-sub{
  font-size:11px;
  opacity:.8;
  margin-top:3px;
}

.nav{
  display:flex;
  align-items:center;
  gap:4px;
}

.nav a{
  color:#fff;
  text-decoration:none;
  padding:9px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
}

.nav a:hover,
.nav a.active{
  background:rgba(255,255,255,.15);
}

.logout{
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
}

.menu-btn{
  display:none;
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  padding:8px 11px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

main{
  max-width:1150px;
  margin:auto;
  padding:28px 18px 50px;
}

.welcome{
  margin-bottom:24px;
}

.welcome h1{
  font-size:28px;
  margin-bottom:7px;
}

.welcome p{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card,
.progress-card,
.certificate,
.month{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.card{
  padding:20px;
}

.card-title{
  color:var(--muted);
  font-size:14px;
  margin-bottom:10px;
}

.big{
  font-size:26px;
  font-weight:800;
}

.small{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.section{
  margin-top:20px;
}

.section h2{
  font-size:21px;
  margin-bottom:14px;
}

.progress-card{
  padding:22px;
}

.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  font-weight:600;
}

.progress-bar{
  height:12px;
  background:#eaecf0;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--primary2);
  border-radius:20px;
  transition:width .5s ease;
}

.certificate{
  padding:25px;
}

.certificate-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.certificate-title{
  font-size:22px;
  font-weight:800;
}

.lock{
  background:var(--orangebg);
  color:var(--orange);
  padding:9px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
}

.requirements{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.requirement{
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}

.requirement strong{
  display:block;
  font-size:20px;
  margin-bottom:5px;
}

.requirement span{
  color:var(--muted);
  font-size:13px;
}

.certificate-progress{
  margin-top:20px;
}

.certificate-message{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:var(--orangebg);
  color:var(--orange);
  font-weight:600;
}

.certificate-message.ready{
  background:var(--greenbg);
  color:var(--green);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.action{
  display:inline-block;
  text-decoration:none;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
  background:var(--primary);
  color:#fff;
}

.action.secondary{
  background:#eef4ff;
  color:var(--primary);
}

.months{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}

.month{
  padding:17px;
}

.month-number{
  color:var(--primary2);
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
}

.month h3{
  font-size:16px;
  margin-bottom:10px;
}

.month-info{
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  background:#f2f4f7;
  color:var(--muted);
}

.status.progress{
  background:#eef4ff;
  color:var(--primary2);
}

.month-links{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}

.month-link{
  display:inline-block;
  text-decoration:none;
  padding:9px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  background:#eef4ff;
  color:var(--primary);
}

.month-link.exam{
  background:var(--primary2);
  color:#fff;
}

.loading{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.error-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:25px;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:25px 15px;
}

@media(max-width:1000px){

  .nav{
    display:none;
    position:absolute;
    top:70px;
    left:14px;
    right:14px;
    background:var(--primary);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:8px;
    flex-direction:column;
    align-items:stretch;
  }

  .nav.open{
    display:flex;
  }

  .nav a,
  .nav .logout{
    width:100%;
    text-align:left;
    padding:12px;
  }

  .menu-btn{
    display:block;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .desktop-logout{
    display:none;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .requirements{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .months{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px){

  header{
    padding:11px 14px;
  }

  .logo{
    width:38px;
    height:38px;
    font-size:15px;
  }

  .brand-title{
    font-size:15px;
  }

  .brand-sub{
    font-size:9px;
  }

  main{
    padding:22px 14px 40px;
  }

  .welcome h1{
    font-size:24px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
  }

  .big{
    font-size:21px;
  }

  .certificate{
    padding:18px;
  }

  .certificate-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .requirements{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .requirement{
    padding:13px;
  }

  .months{
    grid-template-columns:1fr;
  }

  .action{
    width:100%;
    text-align:center;
  }

  .month-links{
    flex-direction:column;
  }

  .month-link{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="logo">GOH</div>

      <div>
        <div class="brand-title">
          GOH Bible Academy
        </div>

        <div class="brand-sub">
          GATE OF HEAVEN MINISTRIES
        </div>
      </div>
    </div>

    <div class="header-actions">

      <nav class="nav" id="nav">

        <a class="active" href="dashboard.html">
          Dashboard
        </a>

        <a href="course.html">
          My Course
        </a>

        <a href="exams.html">
          Exams
        </a>

        <a href="progress.html">
          Progress
        </a>

        <a href="certificate.html">
          Certificate
        </a>

        <a href="profile.html">
          Profile
        </a>

        <a href="support.html">
          Support
        </a>

        <button class="logout" onclick="logout()">
          Logout
        </button>

      </nav>

      <button
        class="menu-btn"
        onclick="toggleMenu()"
        aria-label="Open navigation">
        ☰
      </button>

      <button
        class="logout desktop-logout"
        onclick="logout()">
        Logout
      </button>

    </div>
  </div>
</header>

<main id="app">

  <div class="loading">
    Loading your dashboard...
  </div>

</main>

<footer>
  © 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API =
"https://goh-auth-api.createlk.workers.dev";

const EXAM_API =
"https://goh-bible-exam-api.createlk.workers.dev";

const TOTAL_MCQ = 600;
const REQUIRED_CORRECT = 480;
const TOTAL_EXAMS = 12;

const months = [

  "New Life in Christ",
  "The Word of God",
  "Prayer & Worship",
  "Life & Teachings of Jesus",
  "Christian Character",
  "The Holy Spirit",
  "Bible Foundations",
  "Christian Doctrine",
  "Discipleship",
  "Evangelism & Missions",
  "Ministry & Leadership",
  "Ministry Preparation"

];

const token =
localStorage.getItem("goh_token");

if(!token){
  window.location.href = "login.html";
}

function toggleMenu(){

  document
    .getElementById("nav")
    .classList.toggle("open");

}

document.addEventListener("click",function(e){

  if(e.target.matches(".nav a")){

    document
      .getElementById("nav")
      .classList.remove("open");

  }

});

async function loadDashboard(){

  try{

    const response =
      await fetch(
        API + "/me",
        {
          method:"GET",
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );

    const data =
      await response.json();

    if(!data.success){

      localStorage.removeItem("goh_token");
      localStorage.removeItem("goh_student");

      window.location.href =
        "login.html";

      return;
    }

    renderDashboard(data.student);

  }catch(error){

    console.error(error);

    document.getElementById("app").innerHTML = `

      <div class="error-card">

        <h2>
          Unable to load dashboard
        </h2>

        <p style="margin-top:10px;color:#667085">
          Please check your internet connection
          and try again.
        </p>

        <div class="actions">

          <a
            class="action"
            href="dashboard.html">
            Try Again
          </a>

        </div>

      </div>

    `;

  }

}

function renderDashboard(student){

  const correctMCQ = 0;
  const completedExams = 0;
  const programCompletion = 0;
  const ministryRequirement = false;

  const mcqPercent =
    Math.min(
      100,
      Math.round(
        correctMCQ /
        REQUIRED_CORRECT *
        100
      )
    );

  const examPercent =
    Math.min(
      100,
      Math.round(
        completedExams /
        TOTAL_EXAMS *
        100
      )
    );

  const certificateAcademic =
    Math.min(
      100,
      Math.round(
        (
          mcqPercent +
          examPercent +
          programCompletion
        ) / 3
      )
    );

  const certificateReady =
    correctMCQ >= REQUIRED_CORRECT &&
    completedExams >= TOTAL_EXAMS &&
    programCompletion >= 100 &&
    ministryRequirement;

  document.getElementById("app").innerHTML = `

    <div class="welcome">

      <h1>
        Student Dashboard
      </h1>

      <p>
        Welcome,
        <strong>
          ${escapeHTML(student.name)}
        </strong>.
      </p>

    </div>


    <div class="grid">

      <div class="card">

        <div class="card-title">
          My Program
        </div>

        <div class="big">
          12 Months
        </div>

        <div class="small">
          Christian Discipleship & Ministry Preparation
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          MCQ Progress
        </div>

        <div class="big">
          ${correctMCQ}/${TOTAL_MCQ}
        </div>

        <div class="small">
          Correct answers
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          Examinations
        </div>

        <div class="big">
          ${completedExams}/${TOTAL_EXAMS}
        </div>

        <div class="small">
          50 questions per monthly exam
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          Program Progress
        </div>

        <div class="big">
          ${programCompletion}%
        </div>

        <div class="small">
          One-year program
        </div>

      </div>

    </div>


    <div class="section">

      <h2>
        Course Progress
      </h2>

      <div class="progress-card">

        <div class="progress-row">

          <span>
            12-Month Program
          </span>

          <span>
            ${programCompletion}%
          </span>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${programCompletion}%">
          </div>

        </div>


        <div style="height:20px"></div>


        <div class="progress-row">

          <span>
            600 MCQs
          </span>

          <span>
            ${correctMCQ}/${TOTAL_MCQ}
          </span>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${Math.round(
              correctMCQ/TOTAL_MCQ*100
            )}%">
          </div>

        </div>

      </div>

    </div>


    <div class="section">

      <h2>
        🎓 Certificate Progress
      </h2>

      <div class="certificate">

        <div class="certificate-top">

          <div>

            <div class="certificate-title">
              Certificate Progress
            </div>

            <p style="color:#667085;margin-top:6px">
              Complete the required academic and
              discipleship requirements to become
              eligible for your certificate.
            </p>

          </div>

          <div class="lock">
            ${
              certificateReady
              ? "Eligible"
              : "🔒 Pending"
            }
          </div>

        </div>


        <div class="requirements">

          <div class="requirement">

            <strong>
              ${correctMCQ}/${REQUIRED_CORRECT}
            </strong>

            <span>
              Correct MCQs Required
            </span>

          </div>


          <div class="requirement">

            <strong>
              ${completedExams}/${TOTAL_EXAMS}
            </strong>

            <span>
              Exams Completed
            </span>

          </div>


          <div class="requirement">

            <strong>
              ${programCompletion}%
            </strong>

            <span>
              Program Completion
            </span>

          </div>


          <div class="requirement">

            <strong>
              ${
                ministryRequirement
                ? "Complete"
                : "Pending"
              }
            </strong>

            <span>
              Ministry Requirement
            </span>

          </div>

        </div>


        <div class="certificate-progress">

          <div class="progress-row">

            <span>
              Certificate Academic Progress
            </span>

            <span>
              ${certificateAcademic}%
            </span>

          </div>

          <div class="progress-bar">

            <div
              class="progress-fill"
              style="width:${certificateAcademic}%">
            </div>

          </div>

        </div>


        <div class="
          certificate-message
          ${certificateReady ? "ready" : ""}
        ">

          ${
            certificateReady
            ?
            "🎓 You have completed all certificate requirements."
            :
            "🔒 Certificate locked — continue your studies."
          }

        </div>


        <div class="actions">

          <a
            class="action"
            href="course.html">
            Continue Learning
          </a>

          <a
            class="action secondary"
            href="certificate.html">
            View Certificate
          </a>

        </div>

      </div>

    </div>


    <div class="section">

      <h2>
        Monthly Progress
      </h2>

      <p style="color:#667085;margin-bottom:14px">
        Study the notes before taking each monthly examination.
      </p>


      <div class="months">

        ${months.map((month,index)=>{

          const monthNo = index + 1;

          const isFirst = monthNo === 1;

          return `

            <div class="month">

              <div class="month-number">
                MONTH ${String(monthNo).padStart(2,"0")}
              </div>

              <h3>
                ${month}
              </h3>

              <div class="month-info">
                10 lessons • 50-question exam
              </div>

              <span class="status ${
                isFirst ? "progress" : ""
              }">

                ${
                  isFirst
                  ? "Available"
                  : "Coming Soon"
                }

              </span>


              ${
                isFirst
                ?
                `

                <div class="month-links">

                  <a
                    class="month-link"
                    href="month1-notes.html">
                    📖 Study Notes
                  </a>

                  <a
                    class="month-link exam"
                    href="month1-exam.html">
                    📝 Take Exam
                  </a>

                </div>

                `
                :
                ""
              }

            </div>

          `;

        }).join("")}

      </div>

    </div>


    <div class="section">

      <div class="card">

        <strong>
          Certificate requirement:
        </strong>

        <span style="color:#667085">

          Students should achieve at least
          <strong>480 correct answers out of 600</strong>,
          complete all 12 examinations, complete the
          one-year program and meet the required
          ministry/discipleship activities.

        </span>

      </div>

    </div>

  `;

}

async function logout(){

  try{

    await fetch(
      API + "/logout",
      {
        method:"POST",
        headers:{
          "Authorization":
            "Bearer " + token
        }
      }
    );

  }catch(e){

    console.error(e);

  }

  localStorage.removeItem("goh_token");
  localStorage.removeItem("goh_student");

  window.location.href =
    "login.html";

}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

loadDashboard();

</script>

</body>
</html>
