<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lesson | GOH Bible Academy</title>

<meta name="theme-color" content="#111827">

<link rel="icon"
href="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f3f6fb;
color:#172033;
line-height:1.6
}

button{
font-family:inherit
}

.container{
width:min(850px,92%);
margin:auto
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:100
}

.nav{
min-height:64px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
display:flex;
align-items:center;
gap:9px
}

.logo img{
width:40px;
height:40px;
object-fit:contain;
border-radius:9px
}

.logo-title{
font-size:13px;
font-weight:900
}

.logo-sub{
font-size:8px;
color:#6b7280
}

.back{
border:0;
background:#111827;
color:#fff;
padding:8px 11px;
border-radius:8px;
font-size:9px;
font-weight:900;
cursor:pointer
}

main{
padding:25px 0 45px
}

.message{
display:none;
padding:12px;
border-radius:10px;
font-size:10px;
font-weight:800;
text-align:center;
margin-bottom:14px
}

.message.show{
display:block
}

.error{
background:#fee2e2;
color:#991b1b
}

.loading{
background:#dbeafe;
color:#1e40af
}

.success{
background:#dcfce7;
color:#166534
}

.lesson-card,
.assessment{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:22px;
margin-bottom:16px
}

.badge{
display:inline-block;
background:#eef2ff;
color:#4338ca;
padding:5px 9px;
border-radius:7px;
font-size:8px;
font-weight:900;
margin-bottom:9px
}

h1{
font-size:24px;
line-height:1.3;
margin-bottom:7px
}

.description{
font-size:11px;
color:#6b7280;
margin-bottom:20px
}

.content{
font-size:12px;
white-space:pre-line
}

.verse{
margin-top:22px;
background:#fffbeb;
border:1px solid #fde68a;
border-radius:14px;
padding:17px
}

.verse-title{
font-size:9px;
font-weight:900;
color:#92400e;
letter-spacing:.8px;
margin-bottom:7px
}

.reference{
font-size:11px;
font-weight:900;
color:#78350f;
margin-bottom:6px
}

.verse-text{
font-size:12px;
font-weight:700;
color:#451a03;
white-space:pre-line
}

.assessment h2{
font-size:17px;
margin-bottom:4px
}

.assessment-sub{
font-size:10px;
color:#6b7280;
margin-bottom:17px
}

.question{
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px;
margin-bottom:11px
}

.question-title{
font-size:11px;
font-weight:900;
margin-bottom:9px
}

.option{
display:block;
font-size:10px;
padding:7px 0;
cursor:pointer
}

.option input{
margin-right:7px
}

.submit{
width:100%;
border:0;
background:#111827;
color:#fff;
padding:12px;
border-radius:10px;
font-size:10px;
font-weight:900;
cursor:pointer;
margin-top:8px
}

.submit:disabled{
opacity:.5;
cursor:not-allowed
}

.result{
display:none;
margin-top:13px;
padding:12px;
border-radius:10px;
font-size:10px;
font-weight:900;
text-align:center
}

.result.show{
display:block
}

.pass{
background:#dcfce7;
color:#166534
}

.fail{
background:#fee2e2;
color:#991b1b
}

.locked{
background:#fff;
border:1px solid #fde68a;
border-radius:18px;
padding:25px;
text-align:center
}

.locked-icon{
font-size:38px;
margin-bottom:8px
}

.locked h2{
font-size:18px;
margin-bottom:6px
}

.locked p{
font-size:10px;
color:#6b7280;
margin-bottom:15px
}

.premium{
display:inline-block;
background:#fbbf24;
color:#111827;
text-decoration:none;
padding:10px 15px;
border-radius:9px;
font-size:10px;
font-weight:900
}

.complete-box{
background:#fff;
border:1px solid #bbf7d0;
border-radius:18px;
padding:25px;
text-align:center
}

.complete-icon{
font-size:38px;
margin-bottom:7px
}

.complete-box h2{
font-size:18px;
margin-bottom:5px
}

.complete-box p{
font-size:10px;
color:#6b7280
}

@media(max-width:500px){

.container{
width:94%
}

.lesson-card,
.assessment{
padding:17px
}

h1{
font-size:20px
}

.content,
.verse-text{
font-size:11px
}

}

</style>

</head>

<body>

<header>

<div class="container nav">

<div class="logo">

<img
src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png"
alt="GOH Bible Academy">

<div>

<div class="logo-title">
GOH Bible Academy
</div>

<div class="logo-sub">
Gate of Heaven Ministries
</div>

</div>

</div>

<button
class="back"
id="backBtn">

← Dashboard

</button>

</div>

</header>


<main>

<div class="container">

<div
id="message"
class="message">
</div>

<div id="lessonArea"></div>

</div>

</main>


<script>

/* =====================================================
   GOH BIBLE ACADEMY
   LESSON PAGE
===================================================== */


/* =========================
   LESSON WORKER
========================= */

const LESSON_API =
"https://lesson.createlk.workers.dev";


/* =========================
   DASHBOARD
========================= */

const DASHBOARD_URL =
"dashboard.html";


/* =========================
   STUDENT
========================= */

function getStudent(){

const raw =
localStorage.getItem("goh_student") ||
sessionStorage.getItem("goh_student");

if(!raw){
return null;
}

try{

return JSON.parse(raw);

}catch{

return null;

}

}


const student =
getStudent();


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
window.location.search
);


const lessonId =
Number(
params.get("lesson_id")
);


/* =========================
   ELEMENTS
========================= */

const message =
document.getElementById(
"message"
);

const lessonArea =
document.getElementById(
"lessonArea"
);


/* =========================
   START
========================= */

if(!student){

window.location.href =
"login.html";

}else if(!lessonId){

showMessage(
"Invalid lesson.",
"error"
);

}else{

loadLesson();

}


/* =========================
   LANGUAGE
========================= */

function getLanguage(){

const value =
String(
student.language ||
"English"
).toLowerCase();

if(
value === "ta" ||
value === "tamil"
){

return "ta";

}

if(
value === "si" ||
value === "sinhala"
){

return "si";

}

return "en";

}


/* =========================
   LANGUAGE NAME
========================= */

function languageName(code){

if(code === "ta"){
return "தமிழ்";
}

if(code === "si"){
return "සිංහල";
}

return "English";

}


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

message.textContent =
text;

message.className =
"message show " + type;

}


/* =========================
   LOAD LESSON
========================= */

async function loadLesson(){

showMessage(
"Loading lesson...",
"loading"
);

try{

const url =
LESSON_API +
"/lesson" +
"?lesson_id=" +
encodeURIComponent(lessonId) +
"&student_id=" +
encodeURIComponent(student.id) +
"&language=" +
encodeURIComponent(
getLanguage()
);


const response =
await fetch(url);


const data =
await response.json();


/* =========================
   PREMIUM LOCK
========================= */

if(
response.status === 403 &&
data.premium_required
){

showLocked();

return;

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to load lesson."
);

}


/* =========================
   HIDE MESSAGE
========================= */

message.className =
"message";


/* =========================
   ALREADY COMPLETED
========================= */

if(
data.lesson &&
data.lesson.completed
){

renderCompleted(
data.lesson
);

return;

}


/* =========================
   DISPLAY
========================= */

renderLesson(
data.lesson
);


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to load lesson.",
"error"
);

}

}


/* =========================
   LOCKED
========================= */

function showLocked(){

message.className =
"message";

lessonArea.innerHTML = `

<div class="locked">

<div class="locked-icon">
🔒
</div>

<h2>
Premium Lesson
</h2>

<p>
Lesson ${lessonId} requires an active Premium membership.
</p>

<a
href="premium.html"
class="premium">

⭐ Get Premium

</a>

</div>

`;

}


/* =========================
   COMPLETED
========================= */

function renderCompleted(
lesson
){

lessonArea.innerHTML = `

<div class="complete-box">

<div class="complete-icon">
✅
</div>

<h2>
Lesson Completed
</h2>

<p>
You have already completed Lesson
${Number(lesson.lesson_number)}.
</p>

</div>

`;

}


/* =========================
   LESSON
========================= */

function renderLesson(
lesson
){

lessonArea.innerHTML = `

<div class="lesson-card">

<div class="badge">
LESSON ${Number(lesson.lesson_number)}
</div>

<h1>
${esc(lesson.title)}
</h1>

<div class="description">
${esc(lesson.description || "")}
</div>

<div class="content">
${esc(lesson.content || "")}
</div>


<div class="verse">

<div class="verse-title">
📖 BIBLE VERSE
</div>

<div class="reference">
${esc(
lesson.bible_reference || ""
)}
</div>

<div class="verse-text">
${esc(
lesson.bible_verse || ""
)}
</div>

</div>

</div>


<div class="assessment">

<h2>
📝 5-Question Assessment
</h2>

<div class="assessment-sub">

Answer all 5 questions.
You must pass the assessment to complete this lesson.

</div>


<form id="quiz">

${buildQuestions(
lesson
)}


<button
type="submit"
class="submit"
id="submitBtn">

Submit Assessment

</button>

</form>


<div
id="result"
class="result">

</div>

</div>

`;


document
.getElementById("quiz")
.addEventListener(
"submit",
submitQuiz
);

}


/* =====================================================
   QUESTIONS
===================================================== */

/*
   IMPORTANT

   These are temporary lesson questions.

   For the final system, each lesson should have
   its own 5 questions stored in Cloudflare D1.

   The answer key is:

   Question 1 = A
   Question 2 = A
   Question 3 = A
   Question 4 = A
   Question 5 = A

   Pass mark = 4/5.
===================================================== */

function buildQuestions(
lesson
){

const questions = [

{
question:
"What is the main subject of this lesson?",

options:[
"The Bible",
"Geography",
"Business",
"Science"
],

answer:0

},

{
question:
"What should a Christian do with God's Word?",

options:[
"Study and obey it",
"Ignore it",
"Reject it",
"Hide it"
],

answer:0

},

{
question:
"What is an important purpose of Bible study?",

options:[
"Growing in faith",
"Winning arguments",
"Making money",
"Entertainment only"
],

answer:0

},

{
question:
"Who is central to Christian faith?",

options:[
"Jesus Christ",
"A politician",
"A philosopher",
"A businessman"
],

answer:0

},

{
question:
"What should Bible learning produce?",

options:[
"Faithful Christian living",
"Pride",
"Confusion",
"Arguments"
],

answer:0

}

];


return questions.map(
(q,index)=>`

<div class="question">

<div class="question-title">

${index + 1}.
${esc(q.question)}

</div>

${q.options.map(
(option,i)=>`

<label class="option">

<input
type="radio"
name="question${index}"
value="${i}"
required>

${esc(option)}

</label>

`
).join("")}

</div>

`
).join("");

}


/* =========================
   SUBMIT
========================= */

async function submitQuiz(
event
){

event.preventDefault();


const form =
event.target;


const answers = [];


for(
let i = 0;
i < 5;
i++
){

const selected =
form.querySelector(
`input[name="question${i}"]:checked`
);


if(!selected){

showResult(
"Please answer all 5 questions.",
false
);

return;

}


answers.push(
Number(selected.value)
);

}


/* =========================
   ANSWERS
========================= */

const correctAnswers =
[0,0,0,0,0];


let score = 0;


answers.forEach(
(answer,index)=>{

if(
answer ===
correctAnswers[index]
){

score++;

}

});


/* =========================
   PASS MARK
========================= */

if(score < 4){

showResult(
"Score: " +
score +
"/5. You need at least 4/5 to pass. Please review the lesson and try again.",
false
);

return;

}


/* =========================
   PASS
========================= */

showResult(
"Passed " +
score +
"/5. Saving your progress...",
true
);


const submitBtn =
document.getElementById(
"submitBtn"
);

submitBtn.disabled =
true;


try{

const response =
await fetch(
LESSON_API +
"/complete",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

student_id:
Number(student.id),

lesson_id:
lessonId,

passed:true

})

}
);


const data =
await response.json();


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to save lesson progress."
);

}


/* =========================
   SUCCESS
========================= */

showResult(
"✓ Passed! Lesson completed successfully.",
true
);


setTimeout(
function(){

window.location.href =
DASHBOARD_URL;

},
1200
);


}catch(error){

submitBtn.disabled =
false;

showResult(
error.message ||
"Unable to save progress.",
false
);

}

}


/* =========================
   RESULT
========================= */

function showResult(
text,
success
){

const result =
document.getElementById(
"result"
);

if(!result){
return;
}

result.textContent =
text;

result.className =
"result show " +
(
success
? "pass"
: "fail"
);

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

return String(
value ?? ""
)
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}


/* =========================
   BACK
========================= */

document
.getElementById("backBtn")
.addEventListener(
"click",
function(){

window.location.href =
DASHBOARD_URL;

}
);

</script>

</body>
</html>
