<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Lesson | GOH Bible Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;line-height:1.6}
.container{width:min(700px,94%);margin:auto}

header{background:#fff;border-bottom:1px solid #e5e7eb}
.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between}

.logo{font-size:13px;font-weight:900}
.sub{font-size:8px;color:#777}

.back{
border:0;background:#111827;color:#fff;
padding:8px 11px;border-radius:8px;
font-size:9px;font-weight:900
}

main{padding:22px 0 45px}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:12px
}

.label{
font-size:8px;
font-weight:900;
color:#4f46e5;
margin-bottom:5px
}

h1{
font-size:23px;
margin-bottom:8px
}

.description{
font-size:10px;
color:#6b7280;
margin-bottom:18px
}

.content{
font-size:11px;
white-space:pre-line
}

.verse{
background:#f9fafb;
border-left:4px solid #4f46e5;
padding:13px;
margin-top:18px;
border-radius:8px;
font-size:11px
}

.verse strong{
display:block;
margin-bottom:5px
}

.assessment{
margin-top:18px
}

.assessment h2{
font-size:16px;
margin-bottom:6px
}

.notice{
background:#fef3c7;
color:#92400e;
padding:11px;
border-radius:9px;
font-size:10px;
font-weight:bold;
margin-top:12px
}

.continue{
display:block;
width:100%;
border:0;
background:#111827;
color:#fff;
padding:12px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-top:16px;
text-align:center;
text-decoration:none
}

.error{
text-align:center;
color:#b91c1c;
font-size:12px;
font-weight:bold;
padding:30px
}

footer{
background:#0b1120;
color:#64748b;
text-align:center;
padding:18px;
font-size:8px
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div>
<div class="logo">GOH Bible Academy</div>
<div class="sub">Gate of Heaven Ministries</div>
</div>

<button class="back" onclick="location.href='dashboard.html'">
← Dashboard
</button>

</div>
</header>

<main>
<div class="container">

<div id="loading" class="card">
Loading lesson...
</div>

<div id="error" class="card error" style="display:none"></div>

<div id="lesson" style="display:none">

<div class="card">

<div class="label" id="lessonNumber">
LESSON
</div>

<h1 id="title"></h1>

<div class="description" id="description"></div>

<div class="content" id="content"></div>

<div class="verse" id="verseBox" style="display:none">
<strong>📖 Bible Verse</strong>
<div id="verse"></div>
</div>

<div class="assessment">

<h2>📝 5-Question Assessment</h2>

<div class="notice">
You must score at least 70% to complete this lesson.
</div>

<a id="assessmentButton"
class="continue"
href="#">
Start Assessment →
</a>

</div>

</div>

</div>

</div>
</main>

<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API="https://dashboard.createlk.workers.dev";

const params=new URLSearchParams(location.search);

const lessonId=Number(
params.get("lesson_id") ||
params.get("id") ||
0
);

const moduleId=Number(
params.get("module_id") ||
0
);

const loading=document.getElementById("loading");
const error=document.getElementById("error");
const lesson=document.getElementById("lesson");

function showError(text){

loading.style.display="none";
lesson.style.display="none";
error.style.display="block";
error.textContent=text;

}

if(!lessonId){

showError("Lesson not found.");

}else{

loadLesson();

}


async function loadLesson(){

try{

/*
Try the lesson endpoint.
*/

const url=
API+
"/lesson?lesson_id="+
encodeURIComponent(lessonId);

const response=
await fetch(url,{
method:"GET",
cache:"no-store"
});

if(!response.ok){

throw new Error(
"Lesson API returned "+response.status
);

}

const data=
await response.json();

console.log("LESSON DATA:",data);

if(!data.success){

throw new Error(
data.message||
"Lesson not found."
);

}

const l=
data.lesson||data.data||data;

const title=
l.title||
l.name||
"Lesson "+lessonId;

const description=
l.description||
l.short_description||
"";

const content=
l.content||
l.explanation||
l.lesson_content||
"";

document.getElementById(
"lessonNumber"
).textContent=
"LESSON "+lessonId;

document.getElementById(
"title"
).textContent=title;

document.getElementById(
"description"
).textContent=description;

document.getElementById(
"content"
).textContent=content;


/*
Bible verse
*/

const verse=
l.verse||
l.bible_verse||
"";

if(verse){

document.getElementById(
"verseBox"
).style.display="block";

document.getElementById(
"verse"
).textContent=verse;

}


/*
Assessment page.
*/

document.getElementById(
"assessmentButton"
).href=
"assessment.html?lesson_id="+
lessonId+
(moduleId?
"&module_id="+moduleId:
"");


loading.style.display="none";
lesson.style.display="block";


}catch(e){

console.error(
"LESSON ERROR:",
e
);

showError(
"Unable to load this lesson."
);

}

}

</script>

</body>
</html>
