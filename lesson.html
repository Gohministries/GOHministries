<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | GOH Bible Academy</title>
<meta name="theme-color" content="#111827">

<link rel="icon" href="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
color:#172033;
line-height:1.6
}

.container{
width:min(850px,94%);
margin:auto
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:10
}

.nav{
height:64px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
display:flex;
align-items:center;
gap:9px
}

.logo img{
width:42px;
height:42px;
object-fit:contain;
border-radius:10px
}

.logo-title{
font-size:14px;
font-weight:900
}

.logo-sub{
font-size:8px;
color:#6b7280
}

.back{
border:0;
background:#111827;
color:#fff;
padding:9px 12px;
border-radius:8px;
font-size:9px;
font-weight:900
}

main{
padding:22px 0 45px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:12px
}

.module{
font-size:8px;
font-weight:900;
color:#6366f1;
letter-spacing:.5px;
margin-bottom:5px
}

.lesson-number{
font-size:9px;
color:#6b7280;
font-weight:900;
margin-bottom:4px
}

h1{
font-size:23px;
line-height:1.3;
margin-bottom:7px
}

.description{
font-size:11px;
color:#6b7280
}

.section-title{
font-size:14px;
font-weight:900;
margin-bottom:10px
}

.content{
font-size:11px;
line-height:1.9;
white-space:pre-line
}

.verse{
background:#f8fafc;
border-left:4px solid #6366f1;
padding:15px;
border-radius:8px
}

.reference{
font-size:10px;
font-weight:900;
color:#6366f1;
margin-bottom:6px
}

.verse-text{
font-size:11px;
line-height:1.7
}

.assessment{
margin-top:15px
}

.question{
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px;
margin-bottom:10px
}

.question-title{
font-size:11px;
font-weight:900;
margin-bottom:10px
}

.option{
display:block;
border:1px solid #e5e7eb;
padding:9px;
border-radius:8px;
margin-top:7px;
font-size:10px;
cursor:pointer
}

.option input{
margin-right:7px
}

.submit{
width:100%;
border:0;
background:#111827;
color:#fff;
padding:12px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-top:5px
}

.result{
display:none;
padding:14px;
border-radius:10px;
text-align:center;
font-size:11px;
font-weight:900;
margin-top:12px
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.fail{
display:block;
background:#fef2f2;
color:#b91c1c
}

.loading{
text-align:center;
padding:30px;
color:#2563eb;
font-size:11px;
font-weight:900
}

.error{
background:#fef2f2;
color:#b91c1c;
padding:15px;
border-radius:10px;
font-size:10px;
font-weight:700;
text-align:center
}

.complete{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
font-size:10px;
font-weight:900;
text-align:center;
margin-bottom:12px
}

.next{
display:none;
width:100%;
border:0;
background:#4f46e5;
color:#fff;
padding:12px;
border-radius:9px;
font-size:10px;
font-weight:900;
margin-top:10px
}

footer{
background:#0b1120;
color:#64748b;
text-align:center;
padding:18px;
font-size:8px
}

@media(max-width:600px){
.card{padding:16px}
h1{font-size:20px}
.content{font-size:10px}
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">

<img src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<div>
<div class="logo-title">GOH Bible Academy</div>
<div class="logo-sub">Gate of Heaven Ministries</div>
</div>

</div>

<button class="back" onclick="goDashboard()">
← Dashboard
</button>

</div>
</header>


<main>

<div class="container">

<div id="app">

<div class="loading">
Loading lesson...
</div>

</div>

</div>

</main>


<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

const API="https://dashboard.createlk.workers.dev";

const params=new URLSearchParams(location.search);

const lessonId=
params.get("lesson_id")||
params.get("lessonId")||
params.get("id");

const moduleId=
params.get("module_id")||
params.get("moduleId");

const studentId=
params.get("student_id")||
params.get("studentId");

let language=
params.get("language")||
localStorage.getItem("goh_language")||
"en";

if(!["en","ta","si"].includes(language))
language="en";


function goDashboard(){
location.href="dashboard.html";
}


function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}


function getStudent(){

const raw=
localStorage.getItem("goh_student")||
sessionStorage.getItem("goh_student");

if(!raw)return null;

try{
return JSON.parse(raw);
}catch{
return null;
}

}


const student=getStudent();


if(!lessonId){

$("app").innerHTML=`
<div class="error">
Lesson ID is missing.
</div>`;

}else{

loadLesson();

}


function $(id){
return document.getElementById(id);
}


/* =========================
   LOAD LESSON
========================= */

async function loadLesson(){

try{

const sid=
studentId||
student?.id||
"";

const url=
API+
"/lessons?lesson_id="+
encodeURIComponent(lessonId)+
"&module_id="+
encodeURIComponent(moduleId||"")+
"&student_id="+
encodeURIComponent(sid)+
"&language="+
encodeURIComponent(language);

console.log("Lesson API:",url);

const r=await fetch(url);

const d=await r.json();

console.log("Lesson response:",d);

if(!r.ok){

throw new Error(
d.message||
"Unable to load lesson."
);

}


let lesson=null;

if(d.lesson){
lesson=d.lesson;
}

else if(
Array.isArray(d.lessons)&&
d.lessons.length
){

lesson=d.lessons.find(x=>
String(x.id)==String(lessonId)||
String(x.lesson_id)==String(lessonId)
);

if(!lesson)
lesson=d.lessons[0];

}

else if(d.data){

if(Array.isArray(d.data))
lesson=d.data[0];
else
lesson=d.data;

}


if(!lesson){

throw new Error(
"Lesson not found."
);

}


renderLesson(lesson);


}catch(e){

console.error(e);

$("app").innerHTML=`

<div class="error">
${esc(e.message||"Lesson not found.")}
</div>

`;

}

}


/* =========================
   RENDER
========================= */

function renderLesson(lesson){

const number=
lesson.lesson_number||
lesson.lessonNumber||
lesson.number||
"";

const title=
lesson.title||
lesson.title_en||
lesson.title_ta||
lesson.title_si||
"Lesson";

const description=
lesson.description||
lesson.description_en||
"";

const content=
lesson.content||
lesson.content_en||
"";

const reference=
lesson.bible_reference||
lesson.bible_reference_en||
"";

const verse=
lesson.bible_verse||
lesson.bible_verse_en||
"";


$("app").innerHTML=`

<div class="card">

<div class="module">
GOH BIBLE ACADEMY
</div>

<div class="lesson-number">
LESSON ${esc(number)}
</div>

<h1>
${esc(title)}
</h1>

<div class="description">
${esc(description)}
</div>

</div>


<div class="card">

<div class="section-title">
📖 Lesson
</div>

<div class="content">
${esc(content)}
</div>

</div>


${
verse||reference
?`

<div class="card">

<div class="section-title">
📖 Bible Verse
</div>

<div class="verse">

<div class="reference">
${esc(reference)}
</div>

<div class="verse-text">
${esc(verse)}
</div>

</div>

</div>

`
:""
}


<div id="assessment"></div>

`;

loadQuestions();

}


/* =========================
   QUESTIONS
========================= */

async function loadQuestions(){

const box=$("assessment");

box.innerHTML=`

<div class="card">

<div class="loading">
Loading assessment...
</div>

</div>

`;


try{

const url=
API+
"/lesson-questions?lesson_id="+
encodeURIComponent(lessonId)+
"&language="+
encodeURIComponent(language);

console.log("Questions API:",url);

const r=await fetch(url);

const d=await r.json();

console.log("Questions:",d);

if(!r.ok){

throw new Error(
d.message||
"Unable to load assessment."
);

}


const questions=
Array.isArray(d.questions)
?d.questions
:Array.isArray(d.data)
?d.data
:[];


if(!questions.length){

/*
Try alternate endpoint used by some
Cloudflare Worker versions.
*/

const r2=await fetch(
API+
"/questions?lesson_id="+
encodeURIComponent(lessonId)+
"&language="+
encodeURIComponent(language)
);

const d2=await r2.json();

if(
r2.ok&&
Array.isArray(d2.questions)
){

renderQuestions(d2.questions);
return;

}

box.innerHTML="";
return;

}


renderQuestions(questions);


}catch(e){

console.error(e);

box.innerHTML="";

}

}


/* =========================
   RENDER QUESTIONS
========================= */

function renderQuestions(questions){

if(!questions.length)return;

let html=`

<div class="card assessment">

<div class="section-title">
📝 ${questions.length} Question Assessment
</div>

<div class="description">
Score at least 70% to complete this lesson.
</div>

`;


questions.forEach((q,i)=>{

const question=
q.question||
q.question_en||
"";

let options=[];

try{

if(Array.isArray(q.options))
options=q.options;

else if(
language==="ta"&&
q.options_ta
)
options=JSON.parse(q.options_ta);

else if(
language==="si"&&
q.options_si
)
options=JSON.parse(q.options_si);

else if(q.options_en)
options=JSON.parse(q.options_en);

}catch{

options=[];

}


html+=`

<div class="question">

<div class="question-title">
${i+1}. ${esc(question)}
</div>
`;

options.forEach((option,j)=>{

html+=`

<label class="option">

<input
type="radio"
name="q${i}"
value="${j}">

${esc(option)}

</label>

`;

});

html+=`

</div>

`;

});


html+=`

<button class="submit" id="submitBtn">
Submit Assessment
</button>

<div id="result" class="result"></div>

<button class="next" id="nextBtn">
Continue →
</button>

</div>

`;

$("assessment").innerHTML=html;


$("submitBtn").onclick=()=>{
submitAssessment(questions);
};

}


/* =========================
   SUBMIT
========================= */

function submitAssessment(questions){

let correct=0;
let answered=0;

questions.forEach((q,i)=>{

const selected=
document.querySelector(
`input[name="q${i}"]:checked`
);

if(!selected)return;

answered++;

const answer=
Number(
q.correct_answer ??
q.answer ??
q.correct ??
-1
);

if(Number(selected.value)===answer)
correct++;

});


if(answered<questions.length){

showResult(
"Please answer all questions.",
false
);

return;

}


const score=
Math.round(
(correct/questions.length)*100
);


if(score>=70){

showResult(
`✓ Passed! Score: ${score}%`,
true
);

saveCompletion(score);

$("nextBtn").style.display="block";

$("nextBtn").onclick=()=>{

if(moduleId){

location.href=
"dashboard.html";

}else{

location.href=
"dashboard.html";

}

};

}else{

showResult(
`Score: ${score}%. You need at least 70% to pass.`,
false
);

}

}


/* =========================
   RESULT
========================= */

function showResult(text,success){

const result=$("result");

result.textContent=text;

result.className=
"result "+
(success?"success":"fail");

}


/* =========================
   SAVE COMPLETION
========================= */

async function saveCompletion(score){

try{

const sid=
studentId||
student?.id;

if(!sid)return;

/*
Try progress completion endpoint.
If your Worker already records completion
through the lesson assessment, this request
can safely fail without breaking the page.
*/

await fetch(
API+"/progress",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

student_id:Number(sid),
lesson_id:Number(lessonId),
score:Number(score),
completed:true

})
}
);

}catch(e){

console.log(
"Completion save:",
e.message
);

}

}

</script>

</body>
</html>
