<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | GOH Bible Academy</title>
<meta name="theme-color" content="#111827">

<link rel="icon" href="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#172033;
  line-height:1.6
}

button{
  font-family:inherit;
  cursor:pointer
}

.container{
  width:min(850px,94%);
  margin:auto
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:10
}

.nav{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  display:flex;
  align-items:center;
  gap:9px
}

.logo img{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:9px
}

.logo-title{
  font-size:13px;
  font-weight:900
}

.logo-sub{
  font-size:8px;
  color:#6b7280
}

.back{
  border:0;
  background:#111827;
  color:#fff;
  padding:8px 11px;
  border-radius:8px;
  font-size:9px;
  font-weight:900
}

main{
  padding:24px 0 45px
}

.message{
  display:none;
  padding:11px;
  border-radius:9px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  margin-bottom:13px
}

.message.show{
  display:block
}

.loading{
  background:#eff6ff;
  color:#1d4ed8
}

.error{
  background:#fef2f2;
  color:#b91c1c
}

.success{
  background:#dcfce7;
  color:#166534
}

.hero{
  background:#111827;
  color:#fff;
  border-radius:18px;
  padding:23px;
  margin-bottom:13px
}

.label{
  color:#fbbf24;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px
}

.hero h1{
  font-size:24px;
  margin:5px 0;
  line-height:1.35
}

.hero p{
  color:#d1d5db;
  font-size:10px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  margin-bottom:13px
}

.title{
  font-size:14px;
  font-weight:900;
  margin-bottom:11px
}

.content{
  font-size:12px;
  color:#374151;
  white-space:pre-line;
  overflow-wrap:anywhere
}

.verse{
  background:#fffbeb;
  border:1px solid #fde68a;
  border-radius:12px;
  padding:15px
}

.ref{
  font-size:13px;
  font-weight:900;
  color:#92400e;
  margin-bottom:7px
}

.verse-text{
  font-size:16px;
  color:#374151;
  font-style:italic;
  white-space:pre-line
}

.question{
  border-top:1px solid #e5e7eb;
  padding:15px 0
}

.question:first-child{
  border-top:0
}

.question-text{
  font-size:11px;
  font-weight:900;
  margin-bottom:9px
}

.option{
  display:flex;
  gap:8px;
  align-items:flex-start;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:9px;
  padding:10px;
  margin:6px 0;
  font-size:10px;
  cursor:pointer
}

.option.selected{
  border-color:#6366f1;
  background:#eef2ff
}

.submit,
.next{
  width:100%;
  border:0;
  color:#fff;
  padding:12px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  margin-top:8px
}

.submit{
  background:#111827
}

.next{
  background:#4f46e5;
  display:none
}

.submit:disabled{
  opacity:.5;
  cursor:not-allowed
}

.result{
  display:none;
  margin-top:13px;
  padding:14px;
  border-radius:11px;
  text-align:center;
  font-size:10px;
  font-weight:800
}

.result.show{
  display:block
}

.pass{
  background:#dcfce7;
  color:#166534
}

.fail{
  background:#fef2f2;
  color:#b91c1c
}

.done{
  display:none;
  background:#dcfce7;
  color:#166534;
  border:1px solid #86efac;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  text-align:center;
  font-size:10px;
  font-weight:900
}

.done.show{
  display:block
}

footer{
  background:#0b1120;
  color:#64748b;
  text-align:center;
  padding:18px;
  font-size:8px
}

@media(max-width:500px){

  .hero h1{
    font-size:20px
  }

  .card{
    padding:15px
  }

  .verse-text{
    font-size:14px
  }

  .content{
    font-size:11px
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">

<img src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<div>
<div class="logo-title">GOH Bible Academy</div>
<div class="logo-sub">Gate of Heaven Ministries</div>
</div>

</div>

<button class="back" onclick="location.href='dashboard.html'">
← Dashboard
</button>

</div>
</header>


<main>
<div class="container">

<div id="message" class="message"></div>

<div id="lesson" style="display:none">

<div class="hero">

<div class="label" id="number"></div>

<h1 id="title"></h1>

<p id="description"></p>

</div>


<div class="card">

<div class="title" id="explanationTitle">
📖 Lesson Explanation
</div>

<div class="content" id="content"></div>

</div>


<div class="card">

<div class="title" id="verseTitle">
📖 Bible Verse
</div>

<div class="verse">

<div class="ref" id="reference"></div>

<div class="verse-text" id="verseText"></div>

</div>

</div>


<div class="card" id="assessment">

<div class="title" id="assessmentTitle">
📝 5-Question Assessment
</div>

<p id="assessmentSub"
style="font-size:10px;color:#666;margin-bottom:12px">
You must score at least 70% to complete this lesson.
</p>


<div id="done" class="done"></div>

<form id="questions"></form>

<button class="submit"
id="submit"
type="button">
Submit Assessment
</button>

<div id="result" class="result"></div>

<button class="next"
id="next"
type="button">
Continue →
</button>

</div>

</div>

</div>
</main>


<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

const API="https://lesson.createlk.workers.dev";

const $=id=>document.getElementById(id);


/* STUDENT */

let student=null;

try{

  student=JSON.parse(
    localStorage.getItem("goh_student") ||
    sessionStorage.getItem("goh_student") ||
    "null"
  );

}catch(e){

  student=null;

}

if(!student){
  location.href="login.html";
}


/* URL */

const p=new URLSearchParams(location.search);

const lessonId=
  Number(p.get("lesson_id")||1);

const moduleId=
  Number(p.get("module_id")||1);

const studentId=
  Number(student?.id||0);


/* LANGUAGE */

function getLang(){

  const x=String(
    student?.language ||
    localStorage.getItem("goh_language") ||
    "en"
  ).toLowerCase();

  if(x==="ta"||x==="tamil")
    return"ta";

  if(x==="si"||x==="sinhala")
    return"si";

  return"en";
}

const lang=getLang();


/* UI */

const UI={

en:{
 explanation:"📖 Lesson Explanation",
 verse:"📖 Bible Verse",
 assessment:"📝 5-Question Assessment",
 sub:"You must score at least 70% to complete this lesson.",
 submit:"Submit Assessment",
 completed:"✓ This lesson has already been completed.",
 loading:"Loading lesson...",
 all:"Please answer all 5 questions.",
 missing:"Assessment questions are not available.",
 pass:"🎉 Congratulations! You passed.",
 fail:"You need at least 70% to pass.",
 saving:"Saving progress...",
 continue:"Continue →"
},

ta:{
 explanation:"📖 பாட விளக்கம்",
 verse:"📖 வேதாகம வசனம்",
 assessment:"📝 5 கேள்வி மதிப்பீடு",
 sub:"இந்தப் பாடத்தை நிறைவு செய்ய குறைந்தது 70% பெற வேண்டும்.",
 submit:"மதிப்பீட்டை சமர்ப்பிக்கவும்",
 completed:"✓ இந்தப் பாடம் ஏற்கனவே நிறைவு செய்யப்பட்டுள்ளது.",
 loading:"பாடம் ஏற்றப்படுகிறது...",
 all:"அனைத்து 5 கேள்விகளுக்கும் பதிலளிக்கவும்.",
 missing:"மதிப்பீட்டு கேள்விகள் கிடைக்கவில்லை.",
 pass:"🎉 வாழ்த்துகள்! நீங்கள் தேர்ச்சி பெற்றுள்ளீர்கள்.",
 fail:"தேர்ச்சி பெற குறைந்தது 70% தேவை.",
 saving:"முன்னேற்றம் சேமிக்கப்படுகிறது...",
 continue:"தொடரவும் →"
},

si:{
 explanation:"📖 පාඩම් පැහැදිලි කිරීම",
 verse:"📖 බයිබල් පදය",
 assessment:"📝 ප්‍රශ්න 5ක ඇගයීම",
 sub:"මෙම පාඩම සම්පූර්ණ කිරීමට අවම වශයෙන් 70%ක් ලබාගත යුතුය.",
 submit:"ඇගයීම ඉදිරිපත් කරන්න",
 completed:"✓ මෙම පාඩම දැනටමත් සම්පූර්ණ කර ඇත.",
 loading:"පාඩම පූරණය වෙමින් පවතී...",
 all:"කරුණාකර ප්‍රශ්න 5ටම පිළිතුරු දෙන්න.",
 missing:"ඇගයීමේ ප්‍රශ්න නොමැත.",
 pass:"🎉 සුභ පැතුම්! ඔබ සමත් වී ඇත.",
 fail:"සමත් වීමට අවම වශයෙන් 70% අවශ්‍යයි.",
 saving:"ප්‍රගතිය සුරැකෙමින් පවතී...",
 continue:"ඉදිරියට →"
}

}[lang];


$("explanationTitle").textContent=UI.explanation;
$("verseTitle").textContent=UI.verse;
$("assessmentTitle").textContent=UI.assessment;
$("assessmentSub").textContent=UI.sub;
$("submit").textContent=UI.submit;
$("next").textContent=UI.continue;


/* MESSAGE */

function message(text,type){

  $("message").textContent=text;
  $("message").className=
    "message show "+type;

}

function hideMessage(){

  $("message").className="message";

}


/* QUESTIONS */

let questions=[];


/* BUILD QUESTIONS */

function buildQuestions(){

  const box=$("questions");

  box.innerHTML="";

  if(questions.length!==5){

    $("submit").style.display="none";

    return;

  }


  questions.forEach((q,i)=>{

    const div=document.createElement("div");

    div.className="question";

    const options=
      Array.isArray(q.options)
      ?q.options
      :[];


    div.innerHTML=`

      <div class="question-text">
        ${i+1}. ${escapeHTML(q.question||"")}
      </div>

      ${
        options.map((o,n)=>`

          <label class="option">

            <input
              type="radio"
              name="q${i}"
              value="${n}">

            <span>
              ${escapeHTML(o)}
            </span>

          </label>

        `).join("")
      }

    `;

    box.appendChild(div);

  });


  box.querySelectorAll("input").forEach(input=>{

    input.onchange=()=>{

      document.querySelectorAll(
        `input[name="${input.name}"]`
      ).forEach(x=>{

        x.closest(".option")
         .classList.remove("selected");

      });


      input.closest(".option")
       .classList.add("selected");

    };

  });

}


/* ESCAPE */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* COMPLETED */

function showCompleted(){

  /* IMPORTANT:
     Hide ALL assessment-question errors/content.
  */

  $("questions").innerHTML="";

  $("submit").style.display="none";

  $("assessmentSub").style.display="none";


  $("done").textContent=
    UI.completed;

  $("done").classList.add("show");


  $("result").className=
    "result show pass";

  $("result").textContent=
    UI.completed;


  $("next").style.display="block";


  /* Make sure missing-question message is hidden */

  hideMessage();

}


/* LOAD */

async function load(){

  message(UI.loading,"loading");

  try{

    if(!Number.isInteger(lessonId)||lessonId<1)
      throw Error("Invalid lesson ID.");

    if(!studentId)
      throw Error("Invalid student ID.");


    const url=
      API+
      `/lesson?lesson_id=${encodeURIComponent(lessonId)}`+
      `&module_id=${encodeURIComponent(moduleId)}`+
      `&student_id=${encodeURIComponent(studentId)}`+
      `&language=${encodeURIComponent(lang)}`;


    const r=await fetch(url);

    const d=await r.json();


    if(!r.ok||!d.success)
      throw Error(
        d.message||"Unable to load lesson."
      );


    /* PREMIUM */

    if(d.lesson?.locked){

      message(
        lang==="ta"
        ?"இந்தப் பாடத்திற்கு Premium உறுப்பினர் தேவை."
        :lang==="si"
        ?"මෙම පාඩම සඳහා Premium සාමාජිකත්වය අවශ්‍ය වේ."
        :"Premium membership is required.",
        "error"
      );

      setTimeout(
        ()=>location.href="premium.html",
        1000
      );

      return;

    }


    const l=d.lesson;


    /* LESSON CONTENT */

    $("number").textContent=
      "LESSON "+(l.lesson_number||lessonId);

    $("title").textContent=
      l.title||"";

    $("description").textContent=
      l.description||"";

    $("content").textContent=
      l.content||"";

    $("reference").textContent=
      l.bible_reference||"";

    $("verseText").textContent=
      l.bible_verse||"";


    $("lesson").style.display="block";


    /*
      IMPORTANT FIX:
      Check completed BEFORE checking questions.
    */

    if(
      l.completed===true ||
      l.completed===1 ||
      l.completed==="1"
    ){

      showCompleted();

      return;

    }


    /* NOT COMPLETED */

    hideMessage();


    questions=
      Array.isArray(d.questions)
      ?d.questions.slice(0,5)
      :[];


    /*
      Only show missing questions for
      an unfinished lesson.
    */

    if(questions.length!==5){

      $("questions").innerHTML="";

      $("submit").style.display="none";

      message(
        UI.missing,
        "error"
      );

      return;

    }


    buildQuestions();

  }catch(e){

    console.error(e);

    message(
      e.message||"Unable to load lesson.",
      "error"
    );

  }

}


/* SUBMIT */

$("submit").onclick=async()=>{

  const selected=[
    ...document.querySelectorAll(
      "#questions input:checked"
    )
  ];


  if(selected.length!==5){

    message(
      UI.all,
      "error"
    );

    return;

  }


  let score=0;


  selected.forEach(input=>{

    const i=
      Number(
        input.name.substring(1)
      );


    if(
      Number(input.value)===
      Number(questions[i].answer)
    ){

      score++;

    }

  });


  const percent=
    score*20;


  if(percent<70){

    $("result").className=
      "result show fail";

    $("result").textContent=
      `${UI.fail} Score: ${percent}%`;

    message(
      `${UI.fail} Score: ${percent}%`,
      "error"
    );

    return;

  }


  $("submit").disabled=true;

  $("submit").textContent=
    UI.saving;


  try{

    const r=await fetch(
      API+"/complete",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          student_id:studentId,

          lesson_id:lessonId,

          module_id:moduleId

        })

      }
    );


    const d=await r.json();


    if(!r.ok||!d.success){

      throw Error(
        d.message||
        "Unable to save progress."
      );

    }


    /* Show completed state */

    $("questions").innerHTML="";

    $("assessmentSub").style.display="none";

    $("submit").style.display="none";


    $("done").textContent=
      UI.completed;

    $("done").classList.add("show");


    $("result").className=
      "result show pass";

    $("result").textContent=
      `${UI.pass} Score: ${percent}%`;


    $("next").style.display="block";


    message(
      lang==="ta"
      ?"✓ முன்னேற்றம் சேமிக்கப்பட்டது."
      :lang==="si"
      ?"✓ ප්‍රගතිය සුරැකුණි."
      :"✓ Progress saved.",
      "success"
    );


  }catch(e){

    $("submit").disabled=false;

    $("submit").textContent=
      UI.submit;

    message(
      e.message,
      "error"
    );

  }

};


/* NEXT */

$("next").onclick=()=>{

  location.href=
    `lesson.html?lesson_id=${lessonId+1}`+
    `&module_id=${moduleId}`+
    `&student_id=${studentId}`;

};


/* START */

load();

</script>

</body>
</html>
