<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lesson | GOH Bible Academy</title>

<meta name="theme-color" content="#111827">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
  line-height:1.6
}

.container{
  width:min(850px,94%);
  margin:auto
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb
}

.nav{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  display:flex;
  align-items:center;
  gap:9px
}

.logo img{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:9px
}

.logo-title{
  font-size:13px;
  font-weight:900
}

.logo-sub{
  font-size:8px;
  color:#6b7280
}

.back{
  border:0;
  background:#111827;
  color:#fff;
  padding:8px 11px;
  border-radius:8px;
  font-size:9px;
  font-weight:900;
  cursor:pointer
}

main{
  padding:24px 0 45px
}

.message{
  display:none;
  padding:11px;
  border-radius:9px;
  margin-bottom:12px;
  text-align:center;
  font-size:10px;
  font-weight:800
}

.message.show{
  display:block
}

.error{
  background:#fef2f2;
  color:#b91c1c
}

.loading{
  background:#eff6ff;
  color:#1d4ed8
}

.success{
  background:#f0fdf4;
  color:#15803d
}

.lesson-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:22px;
  margin-bottom:16px
}

.badge{
  display:inline-block;
  background:#dcfce7;
  color:#166534;
  padding:5px 8px;
  border-radius:6px;
  font-size:8px;
  font-weight:900;
  margin-bottom:8px
}

h1{
  font-size:24px;
  margin-bottom:5px
}

.description{
  font-size:11px;
  color:#6b7280;
  margin-bottom:18px
}

.content{
  font-size:12px;
  white-space:pre-line;
  margin-bottom:20px
}

.verse{
  background:#fffbeb;
  border:1px solid #fde68a;
  border-radius:13px;
  padding:16px;
  margin-bottom:20px
}

.verse-title{
  font-size:10px;
  font-weight:900;
  color:#92400e;
  margin-bottom:6px
}

.reference{
  font-size:10px;
  font-weight:900;
  margin-bottom:6px
}

.verse-text{
  font-size:12px;
  font-style:italic
}

.assessment{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px
}

.assessment h2{
  font-size:17px;
  margin-bottom:4px
}

.assessment-sub{
  font-size:9px;
  color:#6b7280;
  margin-bottom:16px
}

.question{
  padding:14px;
  border:1px solid #e5e7eb;
  border-radius:11px;
  margin-bottom:10px
}

.question-title{
  font-size:11px;
  font-weight:900;
  margin-bottom:9px
}

.option{
  display:block;
  background:#f8fafc;
  border-radius:8px;
  padding:8px;
  margin-top:6px;
  font-size:9px;
  cursor:pointer
}

.option input{
  margin-right:6px
}

.submit{
  width:100%;
  border:0;
  background:#111827;
  color:#fff;
  padding:11px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  margin-top:5px
}

.result{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  text-align:center;
  font-size:10px;
  font-weight:900
}

.result.show{
  display:block
}

.pass{
  background:#dcfce7;
  color:#166534
}

.fail{
  background:#fef2f2;
  color:#b91c1c
}

.complete{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:13px;
  border-radius:10px;
  font-size:10px;
  font-weight:900;
  text-align:center;
  margin-bottom:15px
}

footer{
  background:#0b1120;
  color:#64748b;
  text-align:center;
  padding:18px;
  font-size:8px
}

@media(max-width:500px){
  h1{font-size:20px}
  .lesson-card,.assessment{padding:16px}
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">

<img src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<div>
<div class="logo-title">GOH Bible Academy</div>
<div class="logo-sub">Gate of Heaven Ministries</div>
</div>

</div>

<button class="back" id="back">
← Dashboard
</button>

</div>
</header>

<main>

<div class="container">

<div id="message" class="message"></div>

<div id="lessonArea"></div>

<div id="assessmentArea"></div>

</div>

</main>

<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API =
"https://lesson.createlk.workers.dev";

const params =
new URLSearchParams(location.search);

const lessonId =
Number(params.get("lesson_id"));

const studentId =
Number(params.get("student_id"));

function getStudent(){

  const raw =
    localStorage.getItem("goh_student") ||
    sessionStorage.getItem("goh_student");

  try{
    return raw ? JSON.parse(raw) : null;
  }catch{
    return null;
  }
}

const student =
getStudent();

if(!student){
  location.href="login.html";
}

if(!lessonId || !studentId){
  showMessage(
    "Invalid lesson information.",
    "error"
  );
}else{
  loadLesson();
}

function showMessage(text,type){

  const el =
    document.getElementById("message");

  el.textContent=text;
  el.className=
    "message show "+type;
}

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}

function language(){

  const x =
    String(
      student?.language || "en"
    ).toLowerCase();

  if(x==="ta" || x==="tamil") return "ta";

  if(x==="si" || x==="sinhala") return "si";

  return "en";
}

async function loadLesson(){

  showMessage(
    "Loading Lesson...",
    "loading"
  );

  try{

    const url =
      API+
      "/lesson?lesson_id="+
      encodeURIComponent(lessonId)+
      "&student_id="+
      encodeURIComponent(studentId)+
      "&language="+
      language();

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(response.status===403 &&
       data.premium_required){

      location.href="premium.html";
      return;
    }

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Unable to load lesson."
      );

    }

    document.getElementById(
      "message"
    ).className="message";

    renderLesson(data);

  }catch(error){

    showMessage(
      error.message ||
      "Unable to load lesson.",
      "error"
    );

  }

}

function renderLesson(data){

  const l =
    data.lesson;

  let html="";

  html+=`

    <div class="lesson-card">

      <span class="badge">
        LESSON ${esc(l.lesson_number)}
      </span>

      <h1>
        ${esc(l.title)}
      </h1>

      <div class="description">
        ${esc(l.description)}
      </div>

      <div class="content">
        ${esc(l.content)}
      </div>

  `;

  if(l.bible_reference || l.bible_verse){

    html+=`

      <div class="verse">

        <div class="verse-title">
          📖 BIBLE VERSE
        </div>

        <div class="reference">
          ${esc(l.bible_reference)}
        </div>

        <div class="verse-text">
          ${esc(l.bible_verse)}
        </div>

      </div>

    `;

  }

  if(l.completed){

    html+=`

      <div class="complete">
        ✅ You have already completed this lesson.
      </div>

    `;

  }

  html+=`</div>`;

  document.getElementById(
    "lessonArea"
  ).innerHTML=html;

  renderAssessment();

}

function renderAssessment(){

  const questions=[
    {
      q:"What is the Bible?",
      options:[
        "The Word of God",
        "A history book only",
        "A newspaper",
        "A dictionary"
      ],
      answer:0
    },
    {
      q:"Why should Christians study the Bible?",
      options:[
        "To know God and His will",
        "Only for entertainment",
        "To become famous",
        "To avoid prayer"
      ],
      answer:0
    },
    {
      q:"What should we do when reading Scripture?",
      options:[
        "Read and understand it carefully",
        "Ignore its meaning",
        "Change every verse",
        "Read only the title"
      ],
      answer:0
    },
    {
      q:"Who is the central focus of Christian Scripture?",
      options:[
        "God and His redemptive work",
        "World politics",
        "Money",
        "Sports"
      ],
      answer:0
    },
    {
      q:"What is an important purpose of God's Word?",
      options:[
        "Teaching and guiding believers",
        "Providing entertainment only",
        "Replacing prayer",
        "Making people wealthy"
      ],
      answer:0
    }
  ];

  let html=`

    <div class="assessment">

      <h2>📝 5-Question Assessment</h2>

      <div class="assessment-sub">
        You must score at least 70% to complete this lesson.
      </div>

  `;

  questions.forEach((q,i)=>{

    html+=`

      <div class="question">

        <div class="question-title">
          ${i+1}. ${esc(q.q)}
        </div>

    `;

    q.options.forEach((option,j)=>{

      html+=`

        <label class="option">

          <input
            type="radio"
            name="q${i}"
            value="${j}">

          ${esc(option)}

        </label>

      `;

    });

    html+=`</div>`;

  });

  html+=`

      <button
        class="submit"
        id="submit">
        Submit Assessment
      </button>

      <div
        id="result"
        class="result">
      </div>

    </div>

  `;

  document.getElementById(
    "assessmentArea"
  ).innerHTML=html;

  document.getElementById(
    "submit"
  ).onclick=()=>submitAssessment(questions);

}

async function submitAssessment(questions){

  let score=0;

  for(let i=0;i<questions.length;i++){

    const selected =
      document.querySelector(
        `input[name="q${i}"]:checked`
      );

    if(!selected){
      showResult(
        "Please answer all 5 questions.",
        false
      );
      return;
    }

    if(
      Number(selected.value) ===
      questions[i].answer
    ){
      score++;
    }

  }

  const percentage =
    score * 20;

  if(percentage < 70){

    showResult(
      "You scored "+
      percentage+
      "%. You need at least 70%. Please try again.",
      false
    );

    return;
  }

  showResult(
    "You scored "+
    percentage+
    "%. Passing! Saving your lesson progress...",
    true
  );

  try{

    const response =
      await fetch(
        API+"/complete",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            student_id:studentId,
            lesson_id:lessonId,
            score:percentage
          })
        }
      );

    const data =
      await response.json();

    if(
      response.status===403 &&
      data.premium_required
    ){
      location.href="premium.html";
      return;
    }

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Could not save progress."
      );

    }

    showResult(
      "🎉 Passed! Lesson completed. "+
      data.progress.completed+
      "/"+
      data.progress.total+
      " lessons completed.",
      true
    );

    document.getElementById(
      "submit"
    ).disabled=true;

    document.getElementById(
      "submit"
    ).textContent=
      "✓ Lesson Completed";

  }catch(error){

    showResult(
      error.message ||
      "Could not save progress.",
      false
    );

  }

}

function showResult(text,success){

  const el =
    document.getElementById("result");

  el.textContent=text;

  el.className=
    "result show "+
    (success ? "pass" : "fail");

}

document.getElementById(
  "back"
).onclick=()=>{

  location.href=
    "dashboard.html";

};

</script>

</body>
</html>
