<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | GOH Bible Academy</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fb;
 color:#172033;
 line-height:1.6
}
.container{
 width:min(850px,94%);
 margin:auto
}
header{
 background:white;
 border-bottom:1px solid #ddd;
 padding:12px 0
}
.nav{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.logo{
 font-weight:900;
 font-size:14px
}
button{
 border:0;
 cursor:pointer;
 font-weight:800
}
.back{
 background:#111827;
 color:white;
 padding:9px 12px;
 border-radius:8px
}
main{padding:22px 0}
.card{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:18px;
 margin-bottom:13px
}
.hero{
 background:#111827;
 color:white;
 border-radius:17px;
 padding:22px;
 margin-bottom:13px
}
.hero small{
 color:#fbbf24;
 font-weight:900
}
.hero h1{margin:5px 0}
.hero p{
 color:#d1d5db;
 font-size:12px
}
.title{
 font-size:14px;
 font-weight:900;
 margin-bottom:9px
}
.content{
 white-space:pre-line;
 font-size:12px
}
.verse{
 background:#fffbeb;
 border:1px solid #fde68a;
 border-radius:11px;
 padding:14px
}
.ref{
 font-weight:900;
 color:#92400e
}
.q{
 border-top:1px solid #eee;
 padding:14px 0
}
.q:first-child{border-top:0}
.qtext{
 font-weight:900;
 font-size:12px
}
.option{
 display:block;
 background:#f8fafc;
 border:1px solid #ddd;
 padding:9px;
 margin:6px 0;
 border-radius:8px;
 font-size:11px
}
.submit{
 width:100%;
 padding:12px;
 background:#111827;
 color:white;
 border-radius:9px
}
.submit:disabled{
 opacity:.5;
 cursor:not-allowed
}
.done{
 display:none;
 background:#dcfce7;
 color:#166534;
 padding:14px;
 border-radius:10px;
 text-align:center;
 font-weight:900
}
.done.show{display:block}
.error{
 background:#fee2e2;
 color:#991b1b;
 padding:12px;
 border-radius:9px;
 margin-bottom:12px
}
footer{
 background:#0b1120;
 color:#64748b;
 text-align:center;
 padding:18px;
 font-size:9px
}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">GOH Bible Academy</div>
<button class="back" onclick="location.href='dashboard.html'">
← Dashboard
</button>
</div>
</header>

<main>
<div class="container">

<div id="error"></div>

<div id="lesson" style="display:none">

<div class="hero">
<small id="number"></small>
<h1 id="title"></h1>
<p id="description"></p>
</div>

<div class="card">
<div class="title">📖 Lesson Explanation</div>
<div class="content" id="content"></div>
</div>

<div class="card">
<div class="title">📖 Bible Verse</div>
<div class="verse">
<div class="ref" id="reference"></div>
<div id="verse"></div>
</div>
</div>

<div class="card" id="assessment">

<div class="title">📝 5-Question Assessment</div>

<p style="font-size:10px;color:#666">
You must score at least 70% to complete this lesson.
</p>

<form id="questions"></form>

<button class="submit" id="submit">
Submit Assessment
</button>

<div id="result" class="done"></div>

</div>

</div>

</div>
</main>

<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API="https://lesson.createlk.workers.dev";

const student=JSON.parse(
 localStorage.getItem("goh_student") ||
 sessionStorage.getItem("goh_student") ||
 "null"
);

if(!student){
 location.href="login.html";
}

const p=new URLSearchParams(location.search);

const lessonId=Number(p.get("lesson_id"));
const moduleId=Number(p.get("module_id")||0);
const studentId=Number(student.id);

let questions=[];

function language(){

 let x=String(
  student.language ||
  localStorage.getItem("goh_language") ||
  "en"
 ).toLowerCase();

 if(x==="ta"||x==="tamil")return"ta";
 if(x==="si"||x==="sinhala")return"si";

 return"en";
}

const lang=language();

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
 }[m]));
}

function showError(x){
 document.getElementById("error").innerHTML=
 `<div class="error">${esc(x)}</div>`;
}

async function load(){

 try{

  if(!lessonId){
   showError("Invalid lesson ID.");
   return;
  }

  const r=await fetch(
   API+
   "/lesson?lesson_id="+lessonId+
   "&module_id="+moduleId+
   "&student_id="+studentId+
   "&language="+lang
  );

  const d=await r.json();

  if(!r.ok||!d.success){
   throw new Error(d.message||"Unable to load lesson.");
  }

  if(d.lesson.locked){
   location.href="premium.html";
   return;
  }

  const l=d.lesson;

  document.getElementById("number").textContent=
   "LESSON "+l.lesson_number;

  document.getElementById("title").textContent=
   l.title;

  document.getElementById("description").textContent=
   l.description;

  document.getElementById("content").textContent=
   l.content;

  document.getElementById("reference").textContent=
   l.bible_reference;

  document.getElementById("verse").textContent=
   l.bible_verse;

  document.getElementById("lesson").style.display="block";

  questions=d.questions||[];

  if(l.completed){

   document.getElementById("questions").innerHTML="";

   document.getElementById("submit").disabled=true;

   document.getElementById("result").textContent=
    lang==="ta"
     ?"✓ இந்தப் பாடம் ஏற்கனவே நிறைவு செய்யப்பட்டுள்ளது."
     :lang==="si"
      ?"✓ මෙම පාඩම දැනටමත් සම්පූර්ණ කර ඇත."
      :"✓ This lesson has already been completed.";

   document.getElementById("result").classList.add("show");

   return;
  }

  if(questions.length!==5){

   document.getElementById("assessment").innerHTML=
    `<div class="error">${
     lang==="ta"
      ?"மதிப்பீட்டு கேள்விகள் கிடைக்கவில்லை."
      :lang==="si"
       ?"ඇගයීම් ප්‍රශ්න ලබාගත නොහැක."
       :"Assessment questions are not available."
    }</div>`;

   return;
  }

  build();

 }catch(e){

  showError(e.message);

 }

}

function build(){

 const box=document.getElementById("questions");

 box.innerHTML="";

 questions.forEach((q,i)=>{

  const div=document.createElement("div");

  div.className="q";

  div.innerHTML=`
   <div class="qtext">
    ${i+1}. ${esc(q.question)}
   </div>

   ${q.options.map((o,n)=>`
    <label class="option">
     <input
      type="radio"
      name="q${i}"
      value="${n}">
     ${esc(o)}
    </label>
   `).join("")}
  `;

  box.appendChild(div);

 });

}

document.getElementById("submit").onclick=async()=>{

 const selected=[
  ...document.querySelectorAll(
   '#questions input:checked'
  )
 ];

 if(selected.length!==5){

  showError(
   lang==="ta"
    ?"அனைத்து கேள்விகளுக்கும் பதிலளிக்கவும்."
    :lang==="si"
     ?"සියලු ප්‍රශ්නවලට පිළිතුරු දෙන්න."
     :"Please answer all 5 questions."
  );

  return;
 }

 let score=0;

 selected.forEach(x=>{

  const i=Number(
   x.name.substring(1)
  );

  if(Number(x.value)===Number(questions[i].answer)){
   score++;
  }

 });

 const percent=score*20;

 if(percent<70){

  showError(
   (lang==="ta"
    ?"தேர்ச்சி பெற 70% தேவை. மதிப்பெண்: "
    :lang==="si"
     ?"සමත් වීමට 70% අවශ්‍යයි. ලකුණු: "
     :"You need 70% to pass. Score: ")
   +percent+"%"
  );

  return;
 }

 document.getElementById("submit").disabled=true;

 try{

  const r=await fetch(
   API+"/complete",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     student_id:studentId,
     lesson_id:lessonId
    })
   }
  );

  const d=await r.json();

  if(!r.ok||!d.success){
   throw new Error(
    d.message||"Unable to save progress."
   );
  }

  document.getElementById("questions").innerHTML="";

  document.getElementById("result").textContent=
   (lang==="ta"
    ?"🎉 தேர்ச்சி! மதிப்பெண்: "
    :lang==="si"
     ?"🎉 සමත්! ලකුණු: "
     :"🎉 Passed! Score: ")
   +percent+"%";

  document.getElementById("result").classList.add("show");

 }catch(e){

  document.getElementById("submit").disabled=false;

  showError(e.message);

 }

};

load();

</script>

</body>
</html>
