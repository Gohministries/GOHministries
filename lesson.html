<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | GOH Bible Academy</title>
<meta name="theme-color" content="#111827">

<link rel="icon" href="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;line-height:1.65}
.container{width:min(850px,94%);margin:auto}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px}
.logo img{width:40px;height:40px;object-fit:contain;border-radius:9px}
.logo-title{font-size:13px;font-weight:900}
.logo-sub{font-size:8px;color:#6b7280}
.back{border:0;background:#111827;color:#fff;padding:8px 11px;border-radius:8px;font-size:9px;font-weight:900}
main{padding:24px 0 45px}
.message{display:none;padding:11px;border-radius:9px;text-align:center;font-size:10px;font-weight:700;margin-bottom:13px}
.message.show{display:block}
.loading{background:#eff6ff;color:#1d4ed8}
.error{background:#fef2f2;color:#b91c1c}
.success{background:#dcfce7;color:#166534}
.lesson-head{background:#111827;color:#fff;border-radius:18px;padding:23px;margin-bottom:13px}
.label{color:#fbbf24;font-size:9px;font-weight:900;letter-spacing:1px}
.lesson-head h1{font-size:24px;margin:5px 0;line-height:1.35}
.lesson-head p{color:#d1d5db;font-size:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;margin-bottom:13px}
.card-title,.assessment-title{font-size:14px;font-weight:900;margin-bottom:11px}
.explanation{font-size:12px;color:#374151;white-space:pre-line;overflow-wrap:anywhere}
.verse{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:15px}
.reference{font-size:13px;font-weight:900;color:#92400e;margin-bottom:7px}
.verse-text{font-size:16px;line-height:1.8;color:#374151;font-style:italic;white-space:pre-line}
.assessment-sub{font-size:10px;color:#6b7280;margin-bottom:15px}
.question{border-top:1px solid #e5e7eb;padding:15px 0}
.question:first-child{border-top:0}
.question-text{font-size:11px;font-weight:900;margin-bottom:9px}
.option{display:flex;gap:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin:6px 0;font-size:10px;cursor:pointer}
.option.selected{border-color:#6366f1;background:#eef2ff}
.option input{margin-top:3px}
.submit,.next-btn{width:100%;border:0;color:#fff;padding:12px;border-radius:9px;font-size:10px;font-weight:900;margin-top:8px}
.submit{background:#111827}
.next-btn{display:none;background:#4f46e5}
.submit:disabled{opacity:.55}
.result{display:none;margin-top:13px;padding:14px;border-radius:11px;text-align:center;font-size:10px;font-weight:800}
.result.show{display:block}
.pass{background:#dcfce7;color:#166534}
.fail{background:#fef2f2;color:#b91c1c}
.completed{background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:10px;padding:12px;margin-bottom:12px;text-align:center;font-size:10px;font-weight:900}
footer{background:#0b1120;color:#64748b;text-align:center;padding:18px;font-size:8px}

@media(max-width:500px){
.lesson-head h1{font-size:20px}
.card{padding:15px}
.verse{padding:13px}
.verse-text{font-size:14px}
.explanation{font-size:11px;line-height:1.8}
}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">
<img src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">
<div>
<div class="logo-title">GOH Bible Academy</div>
<div class="logo-sub">Gate of Heaven Ministries</div>
</div>
</div>
<button class="back" id="backBtn">← Dashboard</button>
</div>
</header>

<main>
<div class="container">

<div id="message" class="message"></div>

<div id="lessonArea" style="display:none">

<div class="lesson-head">
<div class="label" id="lessonLabel">LESSON</div>
<h1 id="lessonTitle"></h1>
<p id="lessonDescription"></p>
</div>

<div class="card">
<div class="card-title">📖 <span id="explanationTitle"></span></div>
<div class="explanation" id="lessonContent"></div>
</div>

<div class="card">
<div class="card-title">📖 <span id="verseTitle"></span></div>
<div class="verse">
<div class="reference" id="bibleReference"></div>
<div class="verse-text" id="bibleVerse"></div>
</div>
</div>

<div class="card" id="assessmentCard">

<div class="assessment-title" id="assessmentTitle"></div>
<div class="assessment-sub" id="assessmentSub"></div>

<div id="completedBanner"></div>

<form id="assessment"></form>

<button class="submit" id="submitBtn" type="button"></button>

<div id="result" class="result"></div>

<button class="next-btn" id="nextBtn" type="button"></button>

</div>
</div>
</div>
</main>

<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>

<script>

const API="https://lesson.createlk.workers.dev";
const DASHBOARD="dashboard.html";
const $=id=>document.getElementById(id);

function student(){
 const raw=localStorage.getItem("goh_student")||sessionStorage.getItem("goh_student");
 try{return raw?JSON.parse(raw):null}catch{return null}
}

const user=student();

if(!user) location.href="login.html";

const p=new URLSearchParams(location.search);
const lessonId=Number(p.get("lesson_id")||1);
const moduleId=Number(p.get("module_id")||1);
const studentId=Number(p.get("student_id")||user?.id||0);

function language(){
 const x=String(user?.language||localStorage.getItem("goh_language")||"en").toLowerCase();
 return x==="ta"||x==="tamil"?"ta":x==="si"||x==="sinhala"?"si":"en";
}

const lang=language();

const T={
en:{
 explanation:"Lesson Explanation",verse:"Bible Verse",
 assessment:"5-Question Assessment",
 sub:"You must score at least 70% to complete this lesson.",
 submit:"Submit Assessment",completed:"✓ This lesson has already been completed.",
 pass:"🎉 Congratulations! You passed the assessment.",
 fail:"You need at least 70% to complete this lesson.",
 score:"Score",next:"Continue →",loading:"Loading lesson...",
 all:"Please answer all 5 questions.",missing:"Assessment questions are not available."
},
ta:{
 explanation:"பாட விளக்கம்",verse:"வேதாகம வசனம்",
 assessment:"5 கேள்வி மதிப்பீடு",
 sub:"இந்தப் பாடத்தை நிறைவு செய்ய குறைந்தது 70% பெற வேண்டும்.",
 submit:"மதிப்பீட்டை சமர்ப்பிக்கவும்",completed:"✓ இந்தப் பாடம் ஏற்கனவே நிறைவு செய்யப்பட்டுள்ளது.",
 pass:"🎉 வாழ்த்துகள்! நீங்கள் மதிப்பீட்டில் தேர்ச்சி பெற்றுள்ளீர்கள்.",
 fail:"இந்தப் பாடத்தை நிறைவு செய்ய குறைந்தது 70% பெற வேண்டும்.",
 score:"மதிப்பெண்",next:"தொடரவும் →",loading:"பாடம் ஏற்றப்படுகிறது...",
 all:"அனைத்து 5 கேள்விகளுக்கும் பதிலளிக்கவும்.",missing:"மதிப்பீட்டு கேள்விகள் கிடைக்கவில்லை."
},
si:{
 explanation:"පාඩම් පැහැදිලි කිරීම",verse:"බයිබල් පදය",
 assessment:"ප්‍රශ්න 5ක ඇගයීම",
 sub:"මෙම පාඩම සම්පූර්ණ කිරීමට අවම වශයෙන් 70%ක් අවශ්‍ය වේ.",
 submit:"ඇගයීම ඉදිරිපත් කරන්න",completed:"✓ මෙම පාඩම දැනටමත් සම්පූර්ණ කර ඇත.",
 pass:"🎉 සුභ පැතුම්! ඔබ ඇගයීම සමත් වී ඇත.",
 fail:"මෙම පාඩම සම්පූර්ණ කිරීමට අවම වශයෙන් 70%ක් අවශ්‍ය වේ.",
 score:"ලකුණු",next:"ඉදිරියට →",loading:"පාඩම පූරණය වෙමින් පවතී...",
 all:"කරුණාකර ප්‍රශ්න 5ටම පිළිතුරු දෙන්න.",missing:"ඇගයීමේ ප්‍රශ්න නොමැත."
}
}[lang];

$("explanationTitle").textContent=T.explanation;
$("verseTitle").textContent=T.verse;
$("assessmentTitle").textContent="📝 "+T.assessment;
$("assessmentSub").textContent=T.sub;
$("submitBtn").textContent=T.submit;
$("nextBtn").textContent=T.next;

$("backBtn").onclick=()=>location.href=DASHBOARD;

function msg(text,type){
 $("message").textContent=text;
 $("message").className="message show "+type;
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

let questions=[];

function buildQuestions(list){

 if(!Array.isArray(list)||list.length<5){
  $("assessment").innerHTML=
   `<div class="message show error">${esc(T.missing)}</div>`;
  $("submitBtn").style.display="none";
  return;
 }

 questions=list.slice(0,5).map(q=>({
  id:q.id,
  question:q.question||"",
  options:Array.isArray(q.options)?q.options:[],
  answer:Number(q.answer??q.correct_answer)
 }));

 const form=$("assessment");
 form.innerHTML="";

 questions.forEach((q,n)=>{
  const div=document.createElement("div");
  div.className="question";
  div.innerHTML=`
   <div class="question-text">${n+1}. ${esc(q.question)}</div>
   ${q.options.map((o,i)=>`
    <label class="option">
     <input type="radio" name="q${n}" value="${i}">
     <span>${esc(o)}</span>
    </label>
   `).join("")}
  `;
  form.appendChild(div);
 });

 form.querySelectorAll("input").forEach(input=>{
  input.onchange=()=>{
   form.querySelectorAll(`input[name="${input.name}"]`).forEach(x=>
    x.closest(".option")?.classList.remove("selected")
   );
   input.closest(".option")?.classList.add("selected");
  };
 });
}

function lockCompleted(){

 $("assessmentCard").classList.add("assessment-completed");

 document.querySelectorAll("#assessment input").forEach(x=>x.disabled=true);
 $("submitBtn").disabled=true;
 $("submitBtn").textContent="✓ Completed";

 /* ONLY ONE completed message */
 $("completedBanner").className="completed";
 $("completedBanner").textContent=T.completed;

 /* Do NOT repeat the same message in result */
 $("result").className="result";

 $("nextBtn").style.display="block";
}

async function loadLesson(){

 msg(T.loading,"loading");

 try{

  if(!lessonId||!studentId) throw Error("Invalid student information.");

  const url=API+
   "/lesson?lesson_id="+encodeURIComponent(lessonId)+
   "&module_id="+encodeURIComponent(moduleId)+
   "&student_id="+encodeURIComponent(studentId)+
   "&language="+encodeURIComponent(lang);

  const r=await fetch(url);
  const data=await r.json();

  if(!r.ok||!data.success)
   throw Error(data.message||"Unable to load lesson.");

  if(data.lesson?.locked){
   msg(
    lang==="ta"?"இந்தப் பாடத்திற்கு Premium உறுப்பினர் தேவை.":
    lang==="si"?"මෙම පාඩම සඳහා Premium සාමාජිකත්වය අවශ්‍ය වේ.":
    "Premium membership is required for this lesson.",
    "error"
   );
   setTimeout(()=>location.href="premium.html",1200);
   return;
  }

  const l=data.lesson;

  $("lessonLabel").textContent="LESSON "+lessonId;
  $("lessonTitle").textContent=l.title||"";
  $("lessonDescription").textContent=l.description||"";
  $("lessonContent").textContent=l.content||"";
  $("bibleReference").textContent=l.bible_reference||"";
  $("bibleVerse").textContent=l.bible_verse||"";

  buildQuestions(
   data.questions||
   l.questions||
   []
  );

  $("lessonArea").style.display="block";
  $("message").className="message";

  if(
   data.completed===true||
   l.completed===true||
   data.progress?.completed===true
  ){
   lockCompleted();
  }

 }catch(e){
  msg(e.message||"Unable to load lesson.","error");
 }
}

$("submitBtn").onclick=async()=>{

 const answers=[];

 for(let i=0;i<5;i++){
  const x=document.querySelector(`input[name="q${i}"]:checked`);
  if(!x){
   msg(T.all,"error");
   return;
  }
  answers.push(Number(x.value));
 }

 let score=0;

 questions.forEach((q,i)=>{
  if(answers[i]===q.answer) score++;
 });

 const percent=score*20;

 $("result").className=
  "result show "+(percent>=70?"pass":"fail");

 $("result").textContent=
  `${T.score}: ${score}/5 (${percent}%)`;

 if(percent<70){
  $("result").textContent+=
   " — "+T.fail;
  return;
 }

 try{

  $("submitBtn").disabled=true;

  const r=await fetch(API+"/complete",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    student_id:studentId,
    lesson_id:lessonId,
    module_id:moduleId,
    score:percent
   })
  });

  const data=await r.json();

  if(!r.ok||data.success===false)
   throw Error(data.message||"Could not save progress.");

  $("result").textContent=
   `${T.pass} ${T.score}: ${score}/5 (${percent}%)`;

  $("nextBtn").style.display="block";

 }catch(e){

  $("submitBtn").disabled=false;
  msg(e.message||"Could not save progress.","error");

 }
};

$("nextBtn").onclick=()=>{
 location.href=
  "lesson.html?module_id="+moduleId+
  "&lesson_id="+(lessonId+1);
};

loadLesson();

</script>

</body>
</html>
