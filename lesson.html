<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Lesson | GOH Bible Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
color:#172033;
line-height:1.6
}

.container{
width:min(700px,94%);
margin:auto
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb
}

.nav{
height:64px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:13px;
font-weight:900
}

.sub{
font-size:8px;
color:#6b7280
}

.back{
border:0;
background:#111827;
color:#fff;
padding:8px 11px;
border-radius:8px;
font-size:9px;
font-weight:900
}

main{
padding:20px 0 45px
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:12px
}

.label{
font-size:8px;
color:#4f46e5;
font-weight:900
}

h1{
font-size:23px;
margin:5px 0
}

.desc{
font-size:10px;
color:#6b7280;
margin-bottom:18px
}

.content{
font-size:11px;
white-space:pre-line
}

.verse{
background:#f9fafb;
border-left:4px solid #4f46e5;
padding:13px;
margin-top:18px;
border-radius:8px;
font-size:11px
}

.verse b{
display:block;
margin-bottom:5px
}

.assess-title{
font-size:17px;
font-weight:900
}

.assess-info{
font-size:9px;
color:#6b7280;
margin:3px 0 15px
}

.question{
border:1px solid #e5e7eb;
border-radius:11px;
padding:13px;
margin-bottom:10px
}

.qno{
font-size:8px;
color:#4f46e5;
font-weight:900
}

.qtext{
font-size:11px;
font-weight:900;
margin:5px 0 9px
}

.option{
display:block;
background:#f9fafb;
border:1px solid #e5e7eb;
padding:9px;
border-radius:8px;
margin:5px 0;
font-size:10px
}

.option input{
margin-right:6px
}

.submit{
width:100%;
border:0;
background:#111827;
color:#fff;
padding:12px;
border-radius:9px;
font-weight:900;
font-size:10px;
margin-top:8px
}

.submit:disabled{
opacity:.5
}

.result{
display:none;
margin-top:12px;
padding:12px;
border-radius:9px;
text-align:center;
font-size:10px;
font-weight:900
}

.pass{
display:block;
background:#dcfce7;
color:#166534
}

.fail{
display:block;
background:#fef2f2;
color:#b91c1c
}

.loading{
text-align:center;
font-size:11px
}

.error{
color:#b91c1c;
font-size:10px;
font-weight:700;
text-align:center
}

footer{
background:#0b1120;
color:#64748b;
text-align:center;
padding:18px;
font-size:8px
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div>
<div class="logo">GOH Bible Academy</div>
<div class="sub">Gate of Heaven Ministries</div>
</div>

<button class="back" onclick="location.href='dashboard.html'">
← Dashboard
</button>

</div>
</header>

<main>

<div class="container">

<div id="loading" class="card loading">
Loading lesson...
</div>

<div id="error" class="card error" style="display:none"></div>

<div id="lessonArea" style="display:none">

<div class="card">

<div class="label" id="lessonNumber"></div>

<h1 id="title"></h1>

<div class="desc" id="description"></div>

<div class="content" id="content"></div>

<div class="verse">

<b>📖 Bible Verse</b>

<div id="verse"></div>

<br>

<strong id="reference"></strong>

</div>

</div>


<div class="card">

<div class="assess-title">
📝 5-Question Assessment
</div>

<div class="assess-info">
You must score at least 70% to complete this lesson.
</div>

<div id="questions"></div>

<button class="submit" id="submit">
Submit Assessment
</button>

<div id="result" class="result"></div>

</div>

</div>

</div>

</main>

<footer>
GOH Bible Academy • Gate of Heaven Ministries<br>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API="https://dashboard.createlk.workers.dev";


/* =====================================================
   GET LESSON ID
===================================================== */

const params=new URLSearchParams(location.search);

const lessonId=Number(params.get("lesson_id"));


if(!lessonId){

showError("Lesson ID is missing.");

}else{

loadLesson();

}


/* =====================================================
   LOAD LESSON FROM CLOUDFLARE
===================================================== */

async function loadLesson(){

try{

const response=await fetch(
API+"/lesson?lesson_id="+encodeURIComponent(lessonId),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


if(!response.ok){

throw new Error(
"Cloudflare API returned HTTP "+response.status
);

}


const data=await response.json();


console.log("Cloudflare lesson response:",data);


if(!data.success){

throw new Error(
data.message||"Lesson not found"
);

}


const lesson=data.lesson;


if(!lesson){

throw new Error("Lesson data missing");

}


/* =====================================================
   DISPLAY CLOUDFARE DATA
===================================================== */

document.getElementById("lessonNumber").textContent=
"LESSON "+
(
lesson.lesson_number||
lesson.id||
lessonId
);


document.getElementById("title").textContent=
lesson.title_en||"";


document.getElementById("description").textContent=
lesson.description_en||"";


document.getElementById("content").textContent=
lesson.content_en||"";


document.getElementById("verse").textContent=
lesson.bible_verse_en||"";


document.getElementById("reference").textContent=
lesson.bible_reference_en||"";


/* =====================================================
   LOAD QUESTIONS FROM CLOUDFLARE
===================================================== */

await loadQuestions();


/* =====================================================
   SHOW PAGE
===================================================== */

document.getElementById("loading").style.display="none";

document.getElementById("lessonArea").style.display="block";


}catch(error){

console.error(error);

showError(
"Unable to load lesson from Cloudflare. "+
error.message
);

}

}


/* =====================================================
   LOAD QUESTIONS
===================================================== */

let currentQuestions=[];


async function loadQuestions(){

const response=await fetch(
API+"/lesson-questions?lesson_id="+
encodeURIComponent(lessonId),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
}
);


if(!response.ok){

throw new Error(
"Questions API returned HTTP "+
response.status
);

}


const data=await response.json();


console.log("Questions response:",data);


if(!data.success){

throw new Error(
data.message||"Questions not found"
);

}


currentQuestions=
(
data.questions||
data.data||
[]
).slice(0,5);


if(currentQuestions.length<5){

throw new Error(
"Cloudflare returned fewer than 5 questions."
);

}


renderQuestions();

}


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function renderQuestions(){

const box=
document.getElementById("questions");

box.innerHTML="";


currentQuestions.forEach(
(item,index)=>{

const question=
item.question||
item.question_text||
item.q||
"";


const options=getOptions(item);


const div=document.createElement("div");

div.className="question";


let html="";

html+=`
<div class="qno">
QUESTION ${index+1}
</div>
`;

html+=`
<div class="qtext">
${escapeHTML(question)}
</div>
`;


options.forEach(
(option,optionIndex)=>{

html+=`

<label class="option">

<input
type="radio"
name="question${index}"
value="${escapeHTML(option)}">

${escapeHTML(option)}

</label>

`;

});


div.innerHTML=html;

box.appendChild(div);

});

}


/* =====================================================
   GET OPTIONS
===================================================== */

function getOptions(q){

if(Array.isArray(q.options)){

return q.options;

}


return [

q.option_a,
q.option_b,
q.option_c,
q.option_d

].filter(
x=>x!==undefined &&
x!==null &&
String(x).trim()!==""
);

}


/* =====================================================
   SUBMIT ASSESSMENT
===================================================== */

document.getElementById("submit").onclick=
async function(){

let score=0;

let answered=0;


currentQuestions.forEach(
(item,index)=>{

const selected=
document.querySelector(
`input[name="question${index}"]:checked`
);


if(!selected){

return;

}


answered++;


const correct=
item.correct_answer||
item.answer||
item.correct||
item.correct_option||
item.a||
"";


if(
normalize(selected.value)===
normalize(correct)
){

score++;

}

});


if(answered<currentQuestions.length){

showResult(
"Please answer all questions.",
false
);

return;

}


const percent=
Math.round(
(score/currentQuestions.length)*100
);


if(percent<70){

showResult(
"Score: "+percent+
"%. You need at least 70% to pass.",
false
);

return;

}


/* =====================================================
   SAVE COMPLETION TO CLOUDFLARE
===================================================== */

try{

const student=
getStudent();


if(!student){

showResult(
"Passed, but student login information was not found.",
false
);

return;

}


const response=await fetch(
API+"/complete",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

student_id:Number(student.id),

lesson_id:Number(lessonId)

})

}
);


const data=await response.json();


console.log("Completion response:",data);


if(!response.ok||!data.success){

showResult(
"Passed, but progress could not be saved.",
false
);

return;

}


showResult(
"✓ Passed! Score: "+
percent+
"%. Lesson completed.",
true
);


this.disabled=true;


}catch(error){

console.error(error);

showResult(
"Passed, but progress could not be saved.",
false
);

}

};


/* =====================================================
   GET STUDENT
===================================================== */

function getStudent(){

try{

return JSON.parse(
localStorage.getItem("goh_student")||
sessionStorage.getItem("goh_student")||
"null"
);

}catch(e){

return null;

}

}


/* =====================================================
   RESULT
===================================================== */

function showResult(text,success){

const result=
document.getElementById("result");


result.className=
"result "+
(success?"pass":"fail");


result.textContent=text;

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

document.getElementById("loading")
.style.display="none";


document.getElementById("lessonArea")
.style.display="none";


const error=
document.getElementById("error");


error.style.display="block";

error.textContent=text;

}


/* =====================================================
   NORMALIZE ANSWERS
===================================================== */

function normalize(value){

return String(value)
.trim()
.toLowerCase();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
