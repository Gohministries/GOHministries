<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | GOH Bible Academy</title>

<meta name="description"
content="Create your student account at GOH Bible Academy.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#f4f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:450px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#0b376d;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin-top:8px;
  margin-bottom:28px;
}

label{
  display:block;
  font-weight:600;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#0b376d;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:70px;
}

.show{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#0b376d;
  font-weight:600;
  cursor:pointer;
}

button.register-btn{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button.register-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}

.message.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}

.login{
  text-align:center;
  margin-top:22px;
  color:#667085;
}

.login a{
  color:#0b376d;
  font-weight:700;
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#667085;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    GOH Bible Academy
  </div>

  <div class="subtitle">
    Create Your Student Account
  </div>

  <form id="registerForm">

    <label for="name">
      Full Name
    </label>

    <input
      id="name"
      type="text"
      autocomplete="name"
      placeholder="Enter your full name"
      required
    >

    <label for="email">
      Email Address
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">
      Password
    </label>

    <div class="password-box">

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="Minimum 8 characters"
        minlength="8"
        required
      >

      <button
        type="button"
        class="show"
        onclick="togglePassword('password',this)"
      >
        Show
      </button>

    </div>

    <label for="confirmPassword">
      Confirm Password
    </label>

    <div class="password-box">

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter password again"
        minlength="8"
        required
      >

      <button
        type="button"
        class="show"
        onclick="togglePassword('confirmPassword',this)"
      >
        Show
      </button>

    </div>

    <button
      id="registerBtn"
      class="register-btn"
      type="submit"
    >
      Create Account
    </button>

  </form>

  <div
    id="message"
    class="message"
  ></div>

  <div class="login">
    Already have an account?
    <a href="login.html">
      Login
    </a>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to GOH Bible Academy
  </a>

</div>

<script>

/* GOH AUTH API */

const API =
  "https://goh-auth-api.createlk.workers.dev";


/* SHOW / HIDE PASSWORD */

function togglePassword(
  id,
  button
){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";
    button.textContent = "Hide";

  }else{

    input.type = "password";
    button.textContent = "Show";

  }

}


/* MESSAGE */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.textContent = text;

}


/* REGISTER */

document
  .getElementById("registerForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      const name =
        document
        .getElementById("name")
        .value
        .trim();

      const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password =
        document
        .getElementById("password")
        .value;

      const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;

      const button =
        document
        .getElementById("registerBtn");


      /* VALIDATION */

      if(!name){

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      if(!email){

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if(password.length < 8){

        showMessage(
          "Password must be at least 8 characters.",
          "error"
        );

        return;
      }


      if(password !== confirmPassword){

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent =
        "Creating account...";


      try{

        const response =
          await fetch(
            API + "/register",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                name:name,
                email:email,
                password:password
              })
            }
          );


        const data =
          await response.json();


        /* API ERROR */

        if(!data.success){

          showMessage(
            data.error ||
            "Registration failed.",
            "error"
          );

          return;
        }


        /* SUCCESS */

        showMessage(
          "Registration successful! Your account is ACTIVE. Redirecting to login...",
          "success"
        );


        document
          .getElementById("registerForm")
          .reset();


        setTimeout(
          function(){

            window.location.href =
              "login.html";

          },
          1500
        );


      }catch(error){

        console.error(error);

        showMessage(
          "Unable to connect to GOH Bible Academy. Please try again.",
          "error"
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
</html>
