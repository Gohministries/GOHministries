<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Login</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

.login{
 width:100%;
 max-width:420px;
 background:#fff;
 padding:28px;
 border-radius:18px;
 box-shadow:0 5px 25px #0002
}

.logo{
 width:58px;
 height:58px;
 border-radius:14px;
 background:#155eef;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:26px;
 font-weight:bold;
 margin:0 auto 16px
}

h1{
 text-align:center;
 margin:0 0 6px;
 font-size:24px
}

.subtitle{
 text-align:center;
 color:#667085;
 font-size:13px;
 margin-bottom:24px
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:14px 0 7px
}

input{
 width:100%;
 padding:13px;
 border:1px solid #d5dbe5;
 border-radius:9px;
 font-size:15px;
 outline:none
}

input:focus{
 border-color:#155eef;
 box-shadow:0 0 0 3px #155eef18
}

button{
 width:100%;
 border:0;
 border-radius:9px;
 padding:13px;
 margin-top:20px;
 background:#155eef;
 color:#fff;
 font-size:15px;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.6;
 cursor:not-allowed
}

.error{
 display:none;
 background:#fee2e2;
 color:#991b1b;
 padding:12px;
 border-radius:9px;
 margin-bottom:15px;
 font-size:13px
}

.info{
 margin-top:18px;
 text-align:center;
 color:#667085;
 font-size:12px
}
</style>
</head>

<body>

<div class="login">

<div class="logo">
GOH
</div>

<h1>GOH Ministries Finance</h1>

<div class="subtitle">
Finance System Login
</div>

<div id="error" class="error"></div>

<form id="loginForm">

<label for="email">
Email
</label>

<input
 id="email"
 type="email"
 placeholder="Enter your email"
 autocomplete="username"
 required
>

<label for="password">
Password
</label>

<input
 id="password"
 type="password"
 placeholder="Enter your password"
 autocomplete="current-password"
 required
>

<button
 id="loginBtn"
 type="submit"
>
Login
</button>

</form>

<div class="info">
Authorized finance users only
</div>

</div>

<script>

const API=
"https://goh-finance-system.createlk.workers.dev";

const KEY=
"goh_finance_token";


function showError(message){

 const box=
 document.getElementById("error");

 box.textContent=message;

 box.style.display="block";

}


function hideError(){

 document.getElementById(
  "error"
 ).style.display="none";

}


/*
--------------------------------------------------
CHECK WHETHER ALREADY LOGGED IN
--------------------------------------------------
*/

async function checkExistingLogin(){

 const token=
 localStorage.getItem(KEY);

 if(!token){

  return;

 }

 try{

  const response=
   await fetch(
    API+"/api/me",
    {
     method:"GET",
     headers:{
      "Authorization":
       "Bearer "+token
     }
    }
   );

  const data=
   await response.json();

  if(
   response.ok &&
   data.success &&
   data.user
  ){

   /*
    Existing valid session.
    Go directly to dashboard.
   */

   location.replace(
    "finance-dashboard.html"
   );

  }else{

   localStorage.removeItem(KEY);

  }

 }catch(e){

  /*
   Do not delete token merely because
   the network temporarily failed.
  */

 }

}


/*
--------------------------------------------------
LOGIN
--------------------------------------------------
*/

document
.getElementById("loginForm")
.addEventListener(
 "submit",
 async function(e){

  e.preventDefault();

  hideError();

  const btn=
   document.getElementById("loginBtn");

  const email=
   document
   .getElementById("email")
   .value
   .trim()
   .toLowerCase();

  const password=
   document
   .getElementById("password")
   .value;

  if(!email || !password){

   showError(
    "Please enter your email and password."
   );

   return;

  }

  btn.disabled=true;

  btn.textContent=
   "Logging in...";

  try{

   /*
    IMPORTANT:
    Login endpoint must return a token.
   */

   const response=
    await fetch(
     API+"/api/login",
     {
      method:"POST",

      headers:{
       "Content-Type":
        "application/json"
      },

      body:JSON.stringify({
       email:email,
       password:password
      })
     }
    );


   const data=
    await response.json();


   if(
    !response.ok ||
    !data.success
   ){

    throw new Error(
     data.error ||
     "Invalid email or password."
    );

   }


   /*
    Accept common token names.
   */

   const token=
    data.token ||
    data.access_token ||
    data.session_token;


   if(!token){

    throw new Error(
     "Login succeeded but no authentication token was returned."
    );

   }


   /*
    Save the EXACT token key used
    by dashboard and admin pages.
   */

   localStorage.setItem(
    KEY,
    token
   );


   /*
    Verify the token before redirecting.
   */

   const verify=
    await fetch(
     API+"/api/me",
     {
      method:"GET",

      headers:{
       "Authorization":
        "Bearer "+token
      }
     }
    );


   const user=
    await verify.json();


   if(
    !verify.ok ||
    !user.success ||
    !user.user
   ){

    localStorage.removeItem(KEY);

    throw new Error(
     user.error ||
     "Login verification failed."
    );

   }


   /*
    Successful login.
   */

   location.replace(
    "finance-dashboard.html"
   );


  }catch(error){

   showError(
    error.message ||
    "Unable to login."
   );

  }finally{

   btn.disabled=false;

   btn.textContent=
    "Login";

  }

 });


/*
--------------------------------------------------
START
--------------------------------------------------
*/

checkExistingLogin();

</script>

</body>
</html>
