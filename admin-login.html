<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Login</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
padding:20px
}
.box{
max-width:400px;
margin:70px auto;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 25px #0001
}
.logo{
width:48px;
height:48px;
border-radius:12px;
background:#155eef;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:20px;
margin-bottom:15px
}
h1{
font-size:22px;
margin:0 0 5px
}
.sub{
font-size:13px;
color:#667085;
margin-bottom:22px
}
label{
display:block;
font-size:13px;
font-weight:bold;
margin:14px 0 6px
}
input{
width:100%;
padding:13px;
border:1px solid #d5dbe5;
border-radius:9px;
font-size:14px
}
button{
width:100%;
padding:13px;
margin-top:20px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-weight:bold;
font-size:14px;
cursor:pointer
}
button:disabled{opacity:.6}
.msg{
display:none;
margin-top:15px;
padding:11px;
border-radius:9px;
font-size:13px
}
.bad{
display:block;
background:#fee2e2;
color:#991b1b
}
</style>
</head>

<body>

<div class="box">

<div class="logo">G</div>

<h1>GOH Ministries Finance</h1>

<div class="sub">
Administration Panel
</div>

<form id="loginForm">

<label>Email</label>

<input
id="email"
type="email"
value="gateofheavensl1@gmail.com"
autocomplete="username"
required
>

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

</form>

<div id="msg" class="msg"></div>

</div>

<script>

const API=
"https://goh-finance.createlk.workers.dev";

const KEY=
"goh_finance_token";


/* Already logged in */

if(localStorage.getItem(KEY)){
location.href="finance-dashboard.html";
}


/* Login */

document.getElementById("loginForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const btn=
document.getElementById("loginBtn");

const msg=
document.getElementById("msg");

const email=
document.getElementById("email")
.value.trim()
.toLowerCase();

const password=
document.getElementById("password")
.value;

msg.className="msg";

btn.disabled=true;
btn.textContent="Logging in...";

try{

const r=await fetch(
API+"/api/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email,
password
})
}
);

const data=await r.json();

if(!r.ok||!data.success){

throw Error(
data.error||
"Invalid email or password"
);

}

if(!data.token){

throw Error(
"Login token was not returned"
);

}


/* Save session */

localStorage.setItem(
KEY,
data.token
);


/* Go to dashboard */

location.href=
"finance-dashboard.html";

}catch(err){

msg.className="msg bad";
msg.textContent=
err.message||
"Invalid email or password";

}finally{

btn.disabled=false;
btn.textContent="Login";

}

});

</script>

</body>
</html>
