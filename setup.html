<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GOH Ministries - Admin Setup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0;
      color: #123b6d;
      text-align: center;
    }

    h2 {
      margin-top: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: normal;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #123b6d;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: #123b6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d2d52;
    }

    #message {
      margin-top: 18px;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      display: none;
    }

    .success {
      display: block !important;
      background: #e8f7ed;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fdeaea;
      color: #a51d1d;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>GOH Ministries</h1>

    <h2>Church Administration</h2>

    <form id="setupForm">

      <label for="name">
        Administrator Name
      </label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
        required
      >

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Minimum 10 characters"
        autocomplete="new-password"
        minlength="10"
        required
      >

      <label for="confirm">
        Confirm Password
      </label>

      <input
        id="confirm"
        type="password"
        placeholder="Enter password again"
        autocomplete="new-password"
        minlength="10"
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        Create Super Admin
      </button>

    </form>

    <div id="message"></div>

    <div class="note">
      This creates the first Super Administrator.
      Keep your password private.
    </div>

  </div>

<script>

const WORKER_URL =
  "https://admin-workerjs.createlk.workers.dev";

const form =
  document.getElementById("setupForm");

const message =
  document.getElementById("message");

const button =
  document.getElementById("submitButton");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  message.className = "";
  message.style.display = "none";

  const name =
    document.getElementById("name")
      .value
      .trim();

  const username =
    document.getElementById("username")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  const confirm =
    document.getElementById("confirm")
      .value;


  if (!name || !username || !password) {

    showMessage(
      "Please complete all fields.",
      "error"
    );

    return;
  }


  if (password.length < 10) {

    showMessage(
      "Password must contain at least 10 characters.",
      "error"
    );

    return;
  }


  if (password !== confirm) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  button.disabled = true;
  button.textContent = "Creating...";


  try {

    const response = await fetch(
      WORKER_URL + "/setup-admin",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name: name,
          username: username,
          password: password
        })
      }
    );


    const data =
      await response.json();


    if (data.success) {

      showMessage(
        "Super Admin created successfully. You can now use the login page.",
        "success"
      );

      form.reset();

    } else {

      showMessage(
        data.error || "Setup failed.",
        "error"
      );

    }

  } catch (error) {

    showMessage(
      "Could not connect to the Admin Worker.",
      "error"
    );

  }


  button.disabled = false;
  button.textContent = "Create Super Admin";

});


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;
  message.style.display = "block";

}

</script>

</body>
</html>
