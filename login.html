<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
padding:20px
}
.box{
width:100%;
max-width:400px;
background:#fff;
padding:28px;
border-radius:14px;
box-shadow:0 8px 30px #0001
}
.logo{
width:54px;height:54px;border-radius:50%;
background:#0b376d;color:#fff;
display:grid;place-items:center;
margin:auto auto 12px;font-weight:bold
}
h1{text-align:center;font-size:20px;color:#0b376d}
.sub{text-align:center;font-size:12px;color:#667085;margin:5px 0 22px}
label{display:block;font-size:12px;font-weight:bold;margin:13px 0 5px}
input,select{
width:100%;padding:12px;
border:1px solid #d0d5dd;border-radius:8px;
font-size:14px;background:#fff
}
button{
width:100%;margin-top:18px;padding:12px;
border:0;border-radius:8px;
background:#0b376d;color:#fff;font-weight:bold
}
button:disabled{opacity:.6}
.msg{
display:none;margin-top:13px;padding:10px;
border-radius:8px;font-size:12px
}
.err{display:block;background:#fee2e2;color:#991b1b}
.ok{display:block;background:#dcfce7;color:#166534}
.footer{text-align:center;font-size:10px;color:#98a2b3;margin-top:20px}
</style>
</head>

<body>

<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>
<div class="sub">Administrative & Financial Database</div>

<form id="loginForm">

<label>Username / Email</label>
<input id="username"
type="text"
placeholder="Username or email"
autocomplete="username"
required>

<label>Password</label>
<input id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
required>

<label>Access Level</label>
<select id="level" required>
<option value="">Select access level</option>
<option value="administration">Administration</option>
<option value="finance">Finance Officer</option>
<option value="auditor">Auditor / Viewer</option>
</select>

<button id="loginBtn" type="submit">Sign In</button>

</form>

<div id="msg" class="msg"></div>

<div class="footer">
© 2026 GOH Ministries · Official Administrative Record
</div>

</div>

<script>

const AUTH_API=
"https://goh-admin-auth.createlk.workers.dev";

const form=document.getElementById("loginForm");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function show(text,type="err"){
msg.textContent=text;
msg.className="msg "+type;
}

form.onsubmit=async e=>{

e.preventDefault();

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;
const level=document.getElementById("level").value;

if(!username||!password||!level){
show("Username, password and access level are required.");
return;
}

btn.disabled=true;
btn.textContent="Signing in...";
msg.className="msg";

try{

const r=await fetch(AUTH_API+"/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
});

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{
throw new Error("Invalid authentication response.");
}

if(!r.ok||!data.success){
throw new Error(data.error||"Login failed.");
}

const role=
String(data.admin?.role||"").toLowerCase();

let allowed=false;

if(level==="administration"){
allowed=
role==="super_admin"||
role==="admin"||
role==="administrator";
}

if(level==="finance"){
allowed=
role==="finance"||
role==="finance_officer";
}

if(level==="auditor"){
allowed=
role==="auditor"||
role==="viewer";
}

if(!allowed){
throw new Error("Invalid account role.");
}

sessionStorage.setItem(
"goh_admin_token",data.token
);

sessionStorage.setItem(
"goh_admin",JSON.stringify(data.admin)
);

sessionStorage.setItem(
"goh_login_type",level
);

show("Login successful.","ok");

setTimeout(()=>{

if(level==="administration"){
location.href="admin.html";
}

else if(level==="finance"){
location.href="finance.html";
}

else{
location.href="audit.html";
}

},400);

}catch(e){

console.error(e);

show(
e.message==="Failed to fetch"
?"Failed to connect to authentication server."
:e.message
);

btn.disabled=false;
btn.textContent="Sign In";
}

};

</script>

</body>
</html>
