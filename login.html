<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Admin Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
color:#172033;
padding:20px
}

.login{
width:100%;
max-width:390px;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 25px rgba(0,0,0,.08)
}

.logo{
width:58px;
height:58px;
border-radius:50%;
background:#0b376d;
color:#fff;
display:grid;
place-items:center;
font-weight:800;
font-size:16px;
margin:0 auto 14px
}

h1{
text-align:center;
font-size:21px;
color:#0b376d
}

.sub{
text-align:center;
font-size:12px;
color:#667085;
margin:5px 0 22px
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin:12px 0 5px
}

input,select{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:9px;
outline:none;
background:#fff
}

input:focus,select:focus{
border-color:#0b376d
}

button{
width:100%;
border:0;
background:#0b376d;
color:#fff;
padding:12px;
border-radius:9px;
font-weight:bold;
margin-top:18px;
cursor:pointer
}

button:disabled{
opacity:.6
}

.message{
display:none;
padding:10px;
border-radius:8px;
font-size:12px;
margin-bottom:12px
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.footer{
text-align:center;
font-size:10px;
color:#98a2b3;
margin-top:18px
}
</style>
</head>

<body>

<div class="login">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<p class="sub">Church Administration</p>

<div id="message" class="message"></div>

<form id="loginForm">

<label>Login Type</label>

<select id="loginType" required>
<option value="admin">Administrator</option>
<option value="auditor">Auditor</option>
<option value="finance">Finance</option>
</select>

<label>Username</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="Username"
required
>

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

</form>

<div class="footer">
GOH Ministries • Secure Administration
</div>

</div>

<script>

const ADMIN_API =
"https://admin-workerjs.createlk.workers.dev";

const NEW_AUTH =
"https://goh-admin-auth.createlk.workers.dev";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginBtn");

const type =
document.getElementById("loginType");

function showMessage(text,kind){

message.textContent=text;
message.className="message "+kind;

}

type.addEventListener("change",()=>{

const t=type.value;

if(t==="admin"){
document.getElementById("username").placeholder="Administrator username";
}

if(t==="auditor"){
document.getElementById("username").placeholder="Audit username";
}

if(t==="finance"){
document.getElementById("username").placeholder="Finance username";
}

});

form.addEventListener("submit",async e=>{

e.preventDefault();

const loginType=type.value;

const username=
document.getElementById("username")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!username||!password){

showMessage(
"Enter username and password.",
"error"
);

return;

}

button.disabled=true;
button.textContent="Signing in...";

try{

/*
Administrator continues using
your existing working Worker.
*/

const API=
loginType==="admin"
?ADMIN_API
:NEW_AUTH;

const response=
await fetch(API+"/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify({

username,
password,

/*
The new Worker uses this
to identify the requested role.
*/

role:loginType

})

});

let data={};

try{
data=await response.json();
}catch{}

if(!response.ok){

throw new Error(
data.error||"Invalid login"
);

}


/*
Existing Administrator Worker
returns token + admin.
*/

if(loginType==="admin"){

if(!data.token||!data.admin){

throw new Error(
"Invalid administrator response"
);

}

sessionStorage.setItem(
"goh_admin_token",
data.token
);

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.admin)
);

}else{

/*
New Cloudflare authentication
uses the secure session cookie.
*/

if(data.user){

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.user)
);

}

sessionStorage.setItem(
"goh_login_type",
loginType
);

}


showMessage(
"Login successful. Opening administration...",
"success"
);

setTimeout(()=>{

window.location.replace(
"admin.html"
);

},500);

}catch(error){

showMessage(
error.message||"Login failed",
"error"
);

button.disabled=false;
button.textContent="Login";

}

});

</script>

</body>
</html>
