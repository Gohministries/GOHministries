<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;min-height:100vh;display:grid;place-items:center;color:#172033}
.box{width:min(420px,92%);background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}
.logo{width:55px;height:55px;border-radius:50%;background:#0b376d;color:#fff;display:grid;place-items:center;font-weight:bold;margin:auto}
h1{text-align:center;color:#0b376d;font-size:21px;margin-top:12px}
.sub{text-align:center;color:#667085;font-size:12px;margin:5px 0 22px}
label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#0b376d;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:12px}
.err{display:block;background:#fee2e2;color:#991b1b}
.ok{display:block;background:#dcfce7;color:#166534}
small{display:block;text-align:center;color:#98a2b3;margin-top:18px;font-size:10px}
</style>
</head>

<body>

<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>
<div class="sub">Administrative & Financial Database</div>

<form id="loginForm">

<label>Username / Email</label>
<input id="username" autocomplete="username" required>

<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<label>Access Level</label>
<select id="role" required>
<option value="">Select Access Level</option>
<option value="admin">Administration</option>
<option value="finance">Finance Officer</option>
<option value="auditor">Auditor / Viewer</option>
</select>

<button id="loginBtn">Sign In</button>

<div id="msg" class="msg"></div>

</form>

<small>
© 2026 GOH Ministries · Official Administrative Record
</small>

</div>

<script>

/* USE YOUR EXISTING WORKING AUTH WORKER */
const AUTH_API="https://YOUR-AUTH-WORKER.workers.dev";

const form=document.getElementById("loginForm");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function message(text,type="err"){
msg.textContent=text;
msg.className="msg "+type;
}

form.onsubmit=async e=>{

e.preventDefault();

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;
const role=document.getElementById("role").value;

if(!username||!password||!role){
message("Username, password and access level are required.");
return;
}

btn.disabled=true;
btn.textContent="Signing in...";

try{

const r=await fetch(AUTH_API+"/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password,
role
})
});

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch{
throw new Error("Invalid response from authentication server.");
}

if(!r.ok){
throw new Error(data.error||"Invalid login.");
}

/*
Accept common response formats from
your existing Auth Worker.
*/

const token=
data.token||
data.access_token||
data.session_token||
data.session?.token;

const admin=
data.admin||
data.user||
data.account;

if(!token && !admin){
throw new Error("Authentication succeeded but no session was returned.");
}

/* Save session */
if(token)
sessionStorage.setItem("goh_admin_token",token);

if(admin)
sessionStorage.setItem("goh_admin",JSON.stringify(admin));

/* Keep selected login type */
sessionStorage.setItem("goh_login_type",role);

/* Store username for APIs that use X-Admin-Key */
sessionStorage.setItem("goh_admin_username",username);

message("Login successful.","ok");

setTimeout(()=>{
location.href="admin.html";
},300);

}catch(e){

console.error(e);
message(e.message||"Login failed.");

}finally{

btn.disabled=false;
btn.textContent="Sign In";

}

};

</script>

</body>
</html>
