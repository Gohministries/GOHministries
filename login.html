<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;min-height:100vh;display:grid;place-items:center;color:#172033}
.box{width:min(390px,92%);background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}
.logo{width:55px;height:55px;margin:auto;border-radius:50%;background:#0b376d;color:#fff;display:grid;place-items:center;font-weight:bold}
h1{text-align:center;color:#0b376d;font-size:21px;margin:12px 0 5px}
p{text-align:center;color:#667085;font-size:12px;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#0b376d;color:#fff;font-weight:bold}
#msg{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:12px}
.show{display:block!important;background:#fee2e2;color:#991b1b}
footer{text-align:center;color:#98a2b3;font-size:10px;margin-top:18px}
</style>
</head>

<body>
<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>
<p>Administrative & Financial Database</p>

<form id="form">

<label>Username / Email</label>
<input id="username" autocomplete="username" required>

<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<label>Access Level</label>
<select id="role" required>
<option value="">Select Access Level</option>
<option value="administration">Administration</option>
<option value="finance">Finance Officer</option>
<option value="auditor">Auditor / Viewer</option>
</select>

<button id="btn">Sign In</button>
<div id="msg"></div>

</form>

<footer>
© 2026 GOH Ministries · Official Administrative Record
</footer>

</div>

<script>
const ADMIN="https://admin-workerjs.createlk.workers.dev";
const AUTH="https://goh-admin-auth.createlk.workers.dev";

const $=id=>document.getElementById(id);

function message(t){
$("msg").textContent=t;
$("msg").className="show";
}

$("form").onsubmit=async e=>{
e.preventDefault();

const username=$("username").value.trim();
const password=$("password").value;
const type=$("role").value;

if(!username||!password||!type){
message("Username, password and access level required");
return;
}

$("btn").disabled=true;
$("btn").textContent="Signing in...";

try{

const url=type==="administration"
?ADMIN+"/api/login"
:AUTH+"/api/login";

const r=await fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,
password
})
});

const text=await r.text();
let data={};

try{data=JSON.parse(text)}catch{}

if(!r.ok)
throw Error(data.error||data.message||"Login failed");

const account=data.admin||data.user||data.account||data;

if(!account)
throw Error("Invalid account");

const token=data.token||data.access_token||data.jwt||"";

if(token)
sessionStorage.setItem("goh_admin_token",token);

sessionStorage.setItem("goh_admin",JSON.stringify({
...account,
username:account.username||username,
role:account.role||type
}));

sessionStorage.setItem("goh_login_type",type);

location.href=type==="administration"
?"admin.html"
:"finance.html";

}catch(err){

console.error(err);
message(err.message||"Failed to fetch");

}finally{

$("btn").disabled=false;
$("btn").textContent="Sign In";

}
};
</script>
</body>
</html>
