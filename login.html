<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
color:#172033;
}

.box{
width:min(390px,92%);
background:#fff;
padding:28px;
border-radius:14px;
box-shadow:0 8px 30px #0001;
}

.logo{
width:56px;
height:56px;
margin:auto;
border-radius:50%;
background:#0b376d;
color:#fff;
display:grid;
place-items:center;
font-weight:bold;
}

h1{
text-align:center;
font-size:21px;
color:#0b376d;
margin-top:12px;
}

.sub{
text-align:center;
font-size:12px;
color:#667085;
margin:5px 0 22px;
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin:13px 0 5px;
}

input,select{
width:100%;
padding:11px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:14px;
background:#fff;
}

button{
width:100%;
padding:12px;
margin-top:18px;
border:0;
border-radius:8px;
background:#0b376d;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:disabled{opacity:.6}

.msg{
display:none;
margin-top:12px;
padding:10px;
border-radius:8px;
font-size:12px;
}

.msg.show{display:block}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}

footer{
text-align:center;
font-size:10px;
color:#98a2b3;
margin-top:18px;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<div class="sub">
Administrative & Financial Database
</div>

<form id="loginForm">

<label>Username / Email</label>

<input
id="username"
type="text"
autocomplete="username"
required
>

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
>

<label>Access Level</label>

<select id="access" required>

<option value="">Select Access Level</option>

<option value="administration">
Administration
</option>

<option value="finance">
Finance Officer
</option>

<option value="auditor">
Auditor / Viewer
</option>

</select>

<button id="loginBtn" type="submit">
Sign In
</button>

<div id="msg" class="msg"></div>

</form>

<footer>
© 2026 GOH Ministries · Official Administrative Record
</footer>

</div>

<script>

/* =========================
   WORKERS
========================= */

const ADMIN_WORKER =
"https://admin-workerjs.createlk.workers.dev";

const AUTH_WORKER =
"https://goh-admin-auth.createlk.workers.dev";


/*
 IMPORTANT:
 These are the only two login
 endpoints used by this page.

 If your existing Workers use
 another path, change only these.
*/

const ADMIN_LOGIN =
ADMIN_WORKER + "/auth";

const AUTH_LOGIN =
AUTH_WORKER + "/auth";


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("loginForm");

const username =
document.getElementById("username");

const password =
document.getElementById("password");

const access =
document.getElementById("access");

const button =
document.getElementById("loginBtn");

const msg =
document.getElementById("msg");


/* =========================
   MESSAGE
========================= */

function showMessage(text,type="error"){

msg.textContent=text;
msg.className="msg show "+type;

}


/* =========================
   LOGIN
========================= */

form.addEventListener("submit",async e=>{

e.preventDefault();

const u=username.value.trim();
const p=password.value;
const r=access.value;

if(!u||!p||!r){

showMessage(
"Username, password and access level required."
);

return;
}

button.disabled=true;
button.textContent="Signing in...";

try{

/*
 ADMINISTRATION
 uses separate
 administrative Worker
*/

const endpoint=
r==="administration"
?ADMIN_LOGIN
:AUTH_LOGIN;


/*
 Keep role names simple.
*/

const role=
r==="administration"
?"admin":
r==="finance"
?"finance":
"auditor";


const response=await fetch(
endpoint,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:u,
password:p,
role:role
})
}
);


/* =========================
   RESPONSE
========================= */

const text=await response.text();

let data={};

try{
data=JSON.parse(text);
}catch{

throw new Error(
text||"Invalid server response"
);

}

if(!response.ok){

throw new Error(
data.error||
data.message||
"Login failed"
);

}


/* =========================
   ACCOUNT
========================= */

const account=
data.admin||
data.user||
data.account||
data;


const token=
data.token||
data.access_token||
data.jwt||
"";


/* =========================
   SESSION
========================= */

if(token){

sessionStorage.setItem(
"goh_admin_token",
token
);

}

sessionStorage.setItem(
"goh_admin",
JSON.stringify(account)
);

sessionStorage.setItem(
"goh_login_type",
r
);

sessionStorage.setItem(
"goh_admin_username",
u
);


/* =========================
   REDIRECT
========================= */

showMessage(
"Login successful.",
"success"
);

setTimeout(()=>{

if(r==="administration"){

location.href="admin.html";

}else{

location.href="finance.html";

}

},400);


}catch(error){

console.error(error);

showMessage(
error.message||
"Failed to connect to authentication server."
);

}finally{

button.disabled=false;
button.textContent="Sign In";

}

});

</script>

</body>
</html>
