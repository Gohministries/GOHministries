<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Administration Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#f4f7fb;
  font-family:system-ui,sans-serif;
  color:#1e293b;
  padding:20px
}
.box{
  width:100%;
  max-width:390px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:28px;
  box-shadow:0 10px 35px #0001
}
.logo{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:50%;
  background:#0b376d;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:15px
}
h1{
  text-align:center;
  color:#0b376d;
  font-size:21px;
  margin-top:12px
}
.sub{
  text-align:center;
  color:#64748b;
  font-size:12px;
  margin:4px 0 24px
}
label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:13px 0 6px
}
input{
  width:100%;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  outline:0;
  font-size:14px
}
input:focus{border-color:#0b376d}
button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:11px;
  margin-top:18px;
  background:#0b376d;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
button:disabled{opacity:.6}
.msg{
  display:none;
  padding:10px;
  margin-top:14px;
  border-radius:8px;
  font-size:12px;
  text-align:center
}
.msg.show{display:block}
.err{background:#fee2e2;color:#991b1b}
.info{
  margin-top:20px;
  padding:11px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:8px;
  font-size:11px;
  color:#64748b;
  text-align:center
}
footer{
  text-align:center;
  margin-top:20px;
  font-size:10px;
  color:#94a3b8
}
</style>
</head>

<body>

<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>
<div class="sub">Administrative & Financial Database</div>

<form id="login">

<label>Username / Email</label>
<input id="username" autocomplete="username" required>

<label>Password</label>
<input id="password" type="password"
autocomplete="current-password" required>

<button id="btn">Sign In</button>

<div id="msg" class="msg"></div>

</form>

<div class="info">
Secure administrative access<br>
Super Administrator · Finance Officer · Auditor / Viewer
</div>

<footer>
© 2026 GOH Ministries · Official Administrative Record
</footer>

</div>

<script>
const API="https://goh-admin-auth.createlk.workers.dev";

const form=document.getElementById("login");
const btn=document.getElementById("btn");
const msg=document.getElementById("msg");

function message(text){
  msg.textContent=text;
  msg.className="msg show err";
}

form.onsubmit=async e=>{
  e.preventDefault();

  btn.disabled=true;
  btn.textContent="Signing in...";
  msg.className="msg";

  try{
    const r=await fetch(API+"/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data=await r.json().catch(()=>({}));

    if(!r.ok)
      throw new Error(data.error||"Invalid username or password");

    if(!data.user)
      throw new Error("Login response is incomplete");

    sessionStorage.setItem(
      "goh_admin",
      JSON.stringify(data.user)
    );

    sessionStorage.setItem(
      "goh_login_type",
      data.user.role||""
    );

    location.href="admin.html";

  }catch(e){
    message(e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Sign In";
  }
};
</script>

</body>
</html>
