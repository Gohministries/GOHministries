<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Admin Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
color:#172033;
padding:20px
}

.login{
width:100%;
max-width:390px;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 25px rgba(0,0,0,.08)
}

.logo{
width:58px;
height:58px;
border-radius:50%;
background:#0b376d;
color:#fff;
display:grid;
place-items:center;
font-weight:800;
font-size:16px;
margin:0 auto 14px
}

h1{
text-align:center;
font-size:21px;
color:#0b376d
}

.sub{
text-align:center;
font-size:12px;
color:#667085;
margin:5px 0 22px
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin:12px 0 5px
}

input{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:9px;
outline:none
}

input:focus{
border-color:#0b376d
}

button{
width:100%;
border:0;
background:#0b376d;
color:#fff;
padding:12px;
border-radius:9px;
font-weight:bold;
margin-top:18px;
cursor:pointer
}

button:disabled{
opacity:.6
}

.message{
display:none;
padding:10px;
border-radius:8px;
font-size:12px;
margin-bottom:12px
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.footer{
text-align:center;
font-size:10px;
color:#98a2b3;
margin-top:18px
}
</style>
</head>

<body>

<div class="login">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<p class="sub">Church Administration</p>

<div id="message" class="message"></div>

<form id="loginForm">

<label>Username</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="Username or email"
required
>

<label>Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

</form>

<div class="footer">
GOH Ministries • Secure Administration
</div>

</div>

<script>

const API =
"https://admin-workerjs.createlk.workers.dev";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginBtn");


function showMessage(text,type){

message.textContent=text;
message.className="message "+type;

}


form.addEventListener("submit",async e=>{

e.preventDefault();

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value;

if(!username || !password){

showMessage(
"Enter username and password.",
"error"
);

return;

}

button.disabled=true;
button.textContent="Signing in...";

try{

const response =
await fetch(API+"/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

});

let data={};

try{
data=await response.json();
}catch{}

if(!response.ok){

throw new Error(
data.error || "Invalid login"
);

}

if(!data.token || !data.admin){

throw new Error(
"Invalid server response"
);

}


/* Save login */

sessionStorage.setItem(
"goh_admin_token",
data.token
);

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.admin)
);


/* Success */

showMessage(
"Login successful. Opening administration...",
"success"
);


/* Open dashboard */

setTimeout(()=>{

window.location.replace(
"admin.html"
);

},500);


}catch(error){

showMessage(
error.message,
"error"
);

button.disabled=false;
button.textContent="Login";

}

});

</script>

</body>
</html>
