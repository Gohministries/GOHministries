<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Church Administration</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071b35,#0b376d)
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:32px 25px;
  box-shadow:0 20px 50px rgba(0,0,0,.25)
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#0b376d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:700
}

h1{
  text-align:center;
  color:#0b376d;
  font-size:23px
}

.subtitle{
  text-align:center;
  color:#666;
  margin:7px 0 26px;
  font-size:14px
}

label{
  display:block;
  margin:15px 0 7px;
  color:#333;
  font-size:14px;
  font-weight:700
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none
}

input:focus{
  border-color:#0b376d;
  box-shadow:0 0 0 3px rgba(11,55,109,.1)
}

button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer
}

button:disabled{
  opacity:.65;
  cursor:not-allowed
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  text-align:center;
  font-size:14px
}

.error{
  display:block;
  background:#fee2e2;
  color:#b91c1c
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#777;
  font-size:12px
}
</style>
</head>

<body>

<div class="card">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<div class="subtitle">
Church Administration
</div>

<form id="loginForm">

<label>Username</label>

<input
id="username"
type="text"
placeholder="Enter username"
autocomplete="username"
required
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password"
autocomplete="current-password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

<div id="message" class="message"></div>

</form>

<div class="footer">
Authorized administrators only
</div>

</div>

<script>

const API =
"https://admin-workerjs.createlk.workers.dev";

const form =
document.getElementById("loginForm");

const btn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

function showMessage(text,type){

message.textContent=text;
message.className="message "+type;

}

form.addEventListener("submit",async e=>{

e.preventDefault();

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value;

if(!username || !password){

showMessage(
"Please enter your username and password.",
"error"
);

return;

}

btn.disabled=true;
btn.textContent="Logging in...";
message.className="message";

try{

const response =
await fetch(API+"/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

});

const data =
await response.json();

if(
!response.ok ||
!data.success ||
!data.token
){

throw new Error(
data.error ||
"Invalid username or password."
);

}

sessionStorage.setItem(
"goh_admin_token",
data.token
);

if(data.admin){

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.admin)
);

}

const check =
await fetch(API+"/me",{

headers:{
"Authorization":
"Bearer "+data.token
}

});

const verified =
await check.json();

if(!check.ok || !verified.success){

sessionStorage.removeItem(
"goh_admin_token"
);

sessionStorage.removeItem(
"goh_admin"
);

throw new Error(
"Administrator session could not be verified."
);

}

showMessage(
"Login successful. Opening administration...",
"success"
);

setTimeout(()=>{

window.location.replace(
"admin.html"
);

},500);

}catch(error){

showMessage(
error.message ||
"Login failed.",
"error"
);

btn.disabled=false;
btn.textContent="Login";

}

});

</script>

</body>
</html>
