<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Login</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
padding:20px
}
.box{
max-width:400px;
margin:70px auto;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 25px #0001
}
.logo{
width:48px;
height:48px;
border-radius:12px;
background:#155eef;
color:#fff;
display:grid;
place-items:center;
font-size:22px;
font-weight:bold;
margin-bottom:16px
}
h1{
font-size:21px;
margin:0 0 6px
}
p{
font-size:13px;
color:#667085;
margin:0 0 22px
}
label{
display:block;
font-size:13px;
font-weight:bold;
margin:14px 0 6px
}
input{
width:100%;
padding:13px;
border:1px solid #d5dbe5;
border-radius:9px;
font-size:14px;
outline:none
}
input:focus{
border-color:#155eef
}
button{
width:100%;
margin-top:20px;
padding:13px;
border:0;
border-radius:9px;
background:#155eef;
color:#fff;
font-size:14px;
font-weight:bold;
cursor:pointer
}
button:disabled{
opacity:.6
}
.msg{
display:none;
padding:11px;
border-radius:9px;
margin-top:15px;
font-size:13px
}
.ok{
display:block;
background:#dcfce7;
color:#166534
}
.bad{
display:block;
background:#fee2e2;
color:#991b1b
}
</style>
</head>

<body>

<div class="box">

<div class="logo">G</div>

<h1>GOH Ministries Finance</h1>
<p>Administration Panel</p>

<form id="loginForm">

<label>Email</label>
<input
id="email"
type="email"
value="gateofheavensl1@gmail.com"
autocomplete="username"
required
>

<label>Password</label>
<input
id="password"
type="password"
autocomplete="current-password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

<div id="msg" class="msg"></div>

</form>

</div>

<script>

const API=
"https://goh-finance.createlk.workers.dev";

const TOKEN_KEY=
"goh_finance_token";

const form=
document.getElementById("loginForm");

const btn=
document.getElementById("loginBtn");

const msg=
document.getElementById("msg");

function show(text,ok=false){

msg.textContent=text;

msg.className=
"msg "+(ok?"ok":"bad");

}

form.addEventListener("submit",async e=>{

e.preventDefault();

const email=
document.getElementById("email")
.value.trim()
.toLowerCase();

const password=
document.getElementById("password")
.value;

if(!email||!password){

show("Email and password are required.");

return;

}

btn.disabled=true;
btn.textContent="Logging in...";

try{

const response=
await fetch(
API+"/api/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email,
password
})
}
);

const data=
await response.json();

if(!response.ok||!data.success){

throw new Error(
data.error||
"Invalid email or password"
);

}

if(!data.token){

throw new Error(
"Login succeeded but no session token was returned."
);

}

/* IMPORTANT:
   Same key used by all Finance pages.
*/

localStorage.setItem(
TOKEN_KEY,
data.token
);

/* Verify the saved session */

const check=
await fetch(
API+"/api/me",
{
headers:{
"Authorization":
"Bearer "+data.token
}
}
);

const checkData=
await check.json();

if(!check.ok||!checkData.success){

localStorage.removeItem(TOKEN_KEY);

throw new Error(
"Login succeeded but the session could not be verified."
);

}

show("Login successful.",true);

setTimeout(()=>{

location.href=
"finance-dashboard.html";

},300);

}catch(error){

show(error.message);

}finally{

btn.disabled=false;
btn.textContent="Login";

}

});

</script>

</body>
</html>
