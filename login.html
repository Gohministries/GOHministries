<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Admin Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
color:#172033;
padding:20px
}

.login{
width:100%;
max-width:390px;
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 25px rgba(0,0,0,.08)
}

.logo{
width:58px;
height:58px;
border-radius:50%;
background:#0b376d;
color:#fff;
display:grid;
place-items:center;
font-weight:800;
font-size:16px;
margin:0 auto 14px
}

h1{
text-align:center;
font-size:21px;
color:#0b376d
}

.sub{
text-align:center;
font-size:12px;
color:#667085;
margin:5px 0 22px
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin:12px 0 5px
}

input,select{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:9px;
outline:none;
background:#fff
}

input:focus,select:focus{
border-color:#0b376d
}

button{
width:100%;
border:0;
background:#0b376d;
color:#fff;
padding:12px;
border-radius:9px;
font-weight:bold;
margin-top:18px;
cursor:pointer
}

button:disabled{opacity:.6}

.message{
display:none;
padding:10px;
border-radius:8px;
font-size:12px;
margin-bottom:12px
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.message.success{
display:block;
background:#dcfce7;
color:#166534
}

.footer{
text-align:center;
font-size:10px;
color:#98a2b3;
margin-top:18px
}
</style>
</head>

<body>

<div class="login">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<p class="sub">Church Administration</p>

<div id="message" class="message"></div>

<form id="loginForm">

<label for="loginType">Login Type</label>

<select id="loginType">
<option value="admin">Administrator</option>
<option value="auditor">Auditor</option>
<option value="finance">Finance</option>
</select>

<label for="username">Username</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="Username"
required
>

<label for="password">Password</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Password"
required
>

<button id="loginBtn" type="submit">
Login
</button>

</form>

<div class="footer">
GOH Ministries • Secure Administration
</div>

</div>

<script>

const ADMIN_API =
"https://admin-workerjs.createlk.workers.dev";

const AUTH_API =
"https://goh-admin-auth.createlk.workers.dev";

const form =
document.getElementById("loginForm");

const loginType =
document.getElementById("loginType");

const username =
document.getElementById("username");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


function showMessage(text,type){

message.textContent=text;
message.className="message "+type;

}


loginType.addEventListener("change",()=>{

if(loginType.value==="admin")
username.placeholder="Administrator username";

if(loginType.value==="auditor")
username.placeholder="Auditor username";

if(loginType.value==="finance")
username.placeholder="Finance username";

});


form.addEventListener("submit",async e=>{

e.preventDefault();

const user=username.value.trim();
const pass=password.value;
const role=loginType.value;

if(!user||!pass){

showMessage(
"Enter username and password.",
"error"
);

return;
}

loginBtn.disabled=true;
loginBtn.textContent="Signing in...";
message.className="message";

try{

let response;
let data={};


/* ADMINISTRATOR */

if(role==="admin"){

response=await fetch(
ADMIN_API+"/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:user,
password:pass
})
}
);

}


/* AUDITOR / FINANCE */

else{

response=await fetch(
AUTH_API+"/login",
{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:user,
password:pass,
role:role
})
}
);

}


try{
data=await response.json();
}catch{
data={};
}


if(!response.ok){

throw new Error(
data.error||"Invalid login"
);

}


/* ADMIN */

if(role==="admin"){

if(!data.token||!data.admin){

throw new Error(
"Invalid administrator response"
);

}

sessionStorage.setItem(
"goh_admin_token",
data.token
);

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.admin)
);

}


/* AUDITOR / FINANCE */

else{

if(!data.success||!data.user){

throw new Error(
"Invalid authentication response"
);

}

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.user)
);

}


/* Save login type */

sessionStorage.setItem(
"goh_login_type",
role
);


showMessage(
"Login successful. Opening administration...",
"success"
);


setTimeout(()=>{

window.location.replace(
"admin.html"
);

},500);


}catch(error){

console.error(error);

showMessage(
error.message||"Login failed",
"error"
);

loginBtn.disabled=false;
loginBtn.textContent="Login";

}

});

</script>

</body>
</html>
