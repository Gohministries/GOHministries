<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b376d">
<title>GOH Ministries | Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
min-height:100vh;
display:grid;
place-items:center;
background:#f4f7fb;
color:#172033
}
.box{
width:min(400px,92%);
background:#fff;
padding:28px;
border-radius:14px;
box-shadow:0 8px 30px #0001
}
.logo{
width:54px;height:54px;
border-radius:50%;
background:#0b376d;
color:#fff;
display:grid;
place-items:center;
margin:auto;
font-weight:bold
}
h1{
text-align:center;
font-size:21px;
color:#0b376d;
margin-top:12px
}
.sub{
text-align:center;
font-size:12px;
color:#667085;
margin:5px 0 22px
}
label{
display:block;
font-size:12px;
font-weight:bold;
margin:12px 0 5px
}
input,select{
width:100%;
padding:11px;
border:1px solid #d0d5dd;
border-radius:8px;
font-size:14px;
background:#fff
}
button{
width:100%;
margin-top:18px;
padding:12px;
border:0;
border-radius:8px;
background:#0b376d;
color:#fff;
font-weight:bold;
cursor:pointer
}
button:disabled{opacity:.6}
.msg{
display:none;
margin-top:12px;
padding:10px;
border-radius:8px;
font-size:12px
}
.msg.show{display:block}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
small{
display:block;
text-align:center;
margin-top:18px;
font-size:10px;
color:#98a2b3
}
</style>
</head>

<body>

<div class="box">

<div class="logo">GOH</div>

<h1>GOH Ministries</h1>

<div class="sub">
Administrative & Financial Database
</div>

<form id="loginForm">

<label>Username / Email</label>
<input
id="username"
type="text"
autocomplete="username"
required
>

<label>Password</label>
<input
id="password"
type="password"
autocomplete="current-password"
required
>

<label>Access Level</label>

<select id="role" required>
<option value="">Select Access Level</option>
<option value="admin">Administration</option>
<option value="finance">Finance Officer</option>
<option value="auditor">Auditor / Viewer</option>
</select>

<button id="loginBtn" type="submit">
Sign In
</button>

<div id="msg" class="msg"></div>

</form>

<small>
© 2026 GOH Ministries · Official Administrative Record
</small>

</div>

<script>

/* EXISTING AUTH WORKER */
const AUTH_API=
"https://admin-workerjs.createlk.workers.dev";

const form=
document.getElementById("loginForm");

const btn=
document.getElementById("loginBtn");

const msg=
document.getElementById("msg");


function show(text,type="error"){

msg.textContent=text;
msg.className="msg show "+type;

}


form.addEventListener("submit",async e=>{

e.preventDefault();

const username=
document.getElementById("username")
.value.trim();

const password=
document.getElementById("password")
.value;

const role=
document.getElementById("role")
.value;


if(!username||!password||!role){

show(
"Username, password and access level are required."
);

return;

}


btn.disabled=true;
btn.textContent="Signing in...";


try{

const response=await fetch(
AUTH_API+"/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:username,
password:password,
role:role
})
}
);


const text=await response.text();

let data={};

try{
data=JSON.parse(text);
}catch{

throw new Error(
"Invalid response from authentication server."
);

}


if(!response.ok){

throw new Error(
data.error||"Invalid login."
);

}


/*
Store the existing Auth Worker
session/token without changing
password hashing.
*/

if(data.token){

sessionStorage.setItem(
"goh_admin_token",
data.token
);

}

if(data.admin){

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.admin)
);

}

if(data.user){

sessionStorage.setItem(
"goh_admin",
JSON.stringify(data.user)
);

}


/*
Keep selected access level.
*/

sessionStorage.setItem(
"goh_login_type",
role
);

sessionStorage.setItem(
"goh_admin_username",
username
);


show(
"Login successful.",
"success"
);


setTimeout(()=>{
location.href="admin.html";
},500);


}catch(error){

console.error(error);

show(
error.message||"Login failed."
);

}finally{

btn.disabled=false;
btn.textContent="Sign In";

}

});

</script>

</body>
</html>
