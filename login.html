<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student Login | GOH Bible Academy</title>
<meta name="description" content="Student login for GOH Bible Academy.">
<meta name="theme-color" content="#0b376d">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f6f8fb;
color:#172033;
min-height:100vh;
display:flex;
flex-direction:column
}

a{text-decoration:none;color:inherit}

header{
background:#fff;
border-bottom:1px solid #e5eaf1
}

.container{
width:min(1050px,92%);
margin:auto
}

.nav{
height:68px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.logo{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:10px;
background:#0b376d;
color:#fff;
font-size:12px;
font-weight:900
}

.brand strong{
display:block;
color:#0b376d;
font-size:15px
}

.brand small{
display:block;
color:#667085;
font-size:8px;
font-weight:700;
letter-spacing:.7px
}

.home{
font-size:12px;
font-weight:700;
color:#0b376d
}

main{
flex:1;
display:grid;
place-items:center;
padding:45px 0
}

.card{
width:min(430px,100%);
background:#fff;
border:1px solid #e5eaf1;
border-radius:16px;
padding:28px;
box-shadow:0 10px 30px #00000008
}

.icon{
width:48px;
height:48px;
display:grid;
place-items:center;
border-radius:12px;
background:#edf4ff;
color:#0b376d;
font-size:22px;
margin-bottom:15px
}

h1{
font-family:Georgia,"Times New Roman",serif;
font-size:29px;
margin-bottom:7px
}

.intro{
font-size:12px;
color:#667085;
margin-bottom:22px
}

label{
display:block;
font-size:11px;
font-weight:800;
margin:14px 0 6px
}

input{
width:100%;
height:45px;
padding:10px 12px;
border:1px solid #d8dee8;
border-radius:8px;
font:inherit;
font-size:13px;
outline:none
}

input:focus{
border-color:#0b376d
}

.password{
position:relative
}

.show{
position:absolute;
right:10px;
top:12px;
border:0;
background:none;
color:#0b376d;
font-size:11px;
font-weight:700;
cursor:pointer;
width:auto;
height:auto;
margin:0
}

.forgot{
display:block;
text-align:right;
margin-top:8px;
color:#0b376d;
font-size:11px;
font-weight:700
}

button.login{
width:100%;
height:45px;
margin-top:19px;
border:0;
border-radius:8px;
background:#0b376d;
color:#fff;
font-size:13px;
font-weight:800;
cursor:pointer
}

button.login:hover{
background:#082d5a
}

.message{
display:none;
margin-top:13px;
padding:10px;
border-radius:8px;
font-size:11px
}

.register{
margin-top:20px;
padding-top:18px;
border-top:1px solid #e8edf3;
text-align:center;
font-size:11px;
color:#667085
}

.register a{
color:#0b376d;
font-weight:800
}

footer{
padding:22px;
background:#081d38;
color:#8192a8;
text-align:center;
font-size:10px
}
</style>
</head>

<body>

<header>

<div class="container nav">

<a href="index.html" class="brand">

<div class="logo">GOH</div>

<div>
<strong>GOH Bible Academy</strong>
<small>GATE OF HEAVEN MINISTRIES</small>
</div>

</a>

<a href="index.html" class="home">
Home
</a>

</div>

</header>


<main>

<div class="card">

<div class="icon">🔐</div>

<h1>Student Login</h1>

<p class="intro">
Sign in to access your courses, examinations,
progress and certificate information.
</p>

<form id="loginForm">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
autocomplete="email"
required>


<label for="password">
Password
</label>

<div class="password">

<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="show"
onclick="togglePassword()">
Show
</button>

</div>


<a href="forgot-password.html" class="forgot">
Forgot Password?
</a>


<button type="submit" class="login">
Login
</button>

<div class="message" id="message"></div>

</form>


<div class="register">

Don't have an account?
<a href="enroll.html">Register Now</a>

</div>

</div>

</main>


<footer>
© 2026 GOH Bible Academy. All rights reserved.
</footer>


<script>

function togglePassword(){

const input=document.getElementById("password");
const button=document.querySelector(".show");

if(input.type==="password"){
input.type="text";
button.textContent="Hide";
}else{
input.type="password";
button.textContent="Show";
}

}


document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const message=document.getElementById("message");

const student=JSON.parse(
localStorage.getItem("goh_student")||"null"
);


/*
Temporary GitHub Pages login.

Real authentication should be connected
to a secure backend later.
*/

if(
student &&
student.email.toLowerCase()===email.toLowerCase()
){

message.style.display="block";
message.style.background="#ecfdf3";
message.style.color="#067647";
message.textContent="Login successful.";

localStorage.setItem("goh_logged_in","true");

setTimeout(()=>{
location.href="dashboard.html";
},700);

}else{

message.style.display="block";
message.style.background="#fff1f1";
message.style.color="#b42318";
message.textContent=
"Student account not found. Please check your email or register.";

}

});

</script>

</body>
</html>
