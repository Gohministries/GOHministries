<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | GOH Bible Academy</title>

<meta name="description"
content="Student login for GOH Bible Academy.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#f4f7fb;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#0b376d;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin-top:8px;
  margin-bottom:28px;
}

label{
  display:block;
  font-weight:600;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#0b376d;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:70px;
}

.show{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#0b376d;
  font-weight:600;
  cursor:pointer;
}

.forgot{
  text-align:right;
  margin-top:10px;
}

.forgot a{
  color:#0b376d;
  text-decoration:none;
  font-size:14px;
}

button.login{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0b376d;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button.login:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#027a48;
}

.message.error{
  display:block;
  background:#fef3f2;
  color:#b42318;
}

.register{
  text-align:center;
  margin-top:22px;
  color:#667085;
}

.register a{
  color:#0b376d;
  font-weight:700;
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#667085;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    GOH Bible Academy
  </div>

  <div class="subtitle">
    Student Login
  </div>

  <form id="loginForm">

    <label for="email">
      Email Address
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">
      Password
    </label>

    <div class="password-box">

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button
        type="button"
        class="show"
        onclick="togglePassword()"
      >
        Show
      </button>

    </div>

    <div class="forgot">
      <a href="reset-password.html">
        Forgot password?
      </a>
    </div>

    <button
      id="loginBtn"
      class="login"
      type="submit"
    >
      Login
    </button>

  </form>

  <div
    id="message"
    class="message"
  ></div>

  <div class="register">
    Don't have an account?
    <a href="register.html">
      Register
    </a>
  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to GOH Bible Academy
  </a>

</div>

<script>

/* GOH AUTH API */

const API =
  "https://goh-auth-api.createlk.workers.dev";


/* PASSWORD SHOW/HIDE */

function togglePassword(){

  const input =
    document.getElementById("password");

  const button =
    document.querySelector(".show");

  if(input.type === "password"){

    input.type = "text";
    button.textContent = "Hide";

  }else{

    input.type = "password";
    button.textContent = "Show";

  }

}


/* MESSAGE */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.textContent = text;

}


/* LOGIN */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password =
        document
        .getElementById("password")
        .value;

      const button =
        document
        .getElementById("loginBtn");


      if(!email || !password){

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent =
        "Logging in...";


      try{

        const response =
          await fetch(
            API + "/login",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                email:email,
                password:password
              })
            }
          );


        const data =
          await response.json();


        if(!data.success){

          showMessage(
            data.error ||
            "Login failed.",
            "error"
          );

          return;
        }


        /* SAVE AUTH TOKEN */

        localStorage.setItem(
          "goh_token",
          data.token
        );


        /* SAVE STUDENT */

        localStorage.setItem(
          "goh_student",
          JSON.stringify(
            data.student
          )
        );


        showMessage(
          "Login successful. Opening your dashboard...",
          "success"
        );


        setTimeout(
          function(){

            window.location.href =
              "dashboard.html";

          },
          800
        );


      }catch(error){

        console.error(error);

        showMessage(
          "Unable to connect to GOH Bible Academy. Please try again.",
          "error"
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "Login";

      }

    }
  );

</script>

</body>
</html>
