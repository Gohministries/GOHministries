<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Today's Devotional | GOH Ministries</title>

<meta name="description"
content="Daily Christian devotional, Bible verse and prayer from GOH Ministries in English, Tamil and Sinhala.">

<meta name="theme-color" content="#111827">

<link rel="icon"
href="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#172033;
  line-height:1.6
}

.container{
  width:min(850px,92%);
  margin:auto
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e5e7eb
}

.nav{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
  color:#111827
}

.logo img{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:9px
}

.logo-title{
  font-size:13px;
  font-weight:900
}

.logo-sub{
  font-size:8px;
  color:#6b7280
}

.home{
  text-decoration:none;
  background:#111827;
  color:#fff;
  padding:8px 12px;
  border-radius:9px;
  font-size:9px;
  font-weight:900
}

/* MAIN */

main{
  padding:22px 0 40px
}

/* HERO */

.hero{
  background:
  radial-gradient(
    circle at 90% 10%,
    rgba(99,102,241,.3),
    transparent 32%
  ),
  linear-gradient(135deg,#111827,#293548);
  color:#fff;
  border-radius:22px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:12px
}

.hero-icon{
  font-size:34px;
  margin-bottom:4px
}

.label{
  color:#fbbf24;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.2px
}

.hero h1{
  font-size:28px;
  line-height:1.2;
  margin:6px 0
}

.date{
  color:#cbd5e1;
  font-size:10px
}

/* LANGUAGE */

.language-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px
}

.language-card label{
  display:block;
  font-size:8px;
  font-weight:900;
  color:#6b7280;
  margin-bottom:6px
}

select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:9px;
  background:#fff;
  color:#172033;
  font-size:11px;
  font-weight:700;
  outline:none
}

/* CONTENT */

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:21px;
  margin-bottom:12px;
  box-shadow:0 5px 18px rgba(15,23,42,.04)
}

.card-label{
  color:#6366f1;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px
}

.card h2{
  font-size:21px;
  line-height:1.3;
  margin-bottom:10px
}

.message,
.prayer{
  font-size:13px;
  color:#374151;
  white-space:pre-line
}

/* VERSE */

.verse-card{
  background:#fffbeb;
  border-color:#fde68a
}

.verse{
  font-size:15px;
  font-weight:700;
  font-style:italic;
  color:#374151
}

.reference{
  display:inline-block;
  margin-top:9px;
  padding:5px 9px;
  border-radius:7px;
  background:#fef3c7;
  color:#92400e;
  font-size:9px;
  font-weight:900
}

/* PRAYER */

.prayer-card{
  background:linear-gradient(135deg,#eef2ff,#fff)
}

.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:40px 15px;
  text-align:center;
  color:#6b7280;
  font-size:11px
}

.error{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#b91c1c;
  border-radius:14px;
  padding:18px;
  text-align:center;
  font-size:10px;
  font-weight:700
}

/* SHARE */

.share{
  text-align:center;
  margin-top:15px
}

.share button{
  border:0;
  background:#111827;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  cursor:pointer
}

.share button:active{
  transform:scale(.98)
}

/* FOOTER */

footer{
  background:#0b1120;
  color:#94a3b8;
  text-align:center;
  padding:20px;
  font-size:8px
}

footer strong{
  color:#fff
}

/* MOBILE */

@media(max-width:600px){

  .container{
    width:92%
  }

  .hero{
    padding:26px 18px;
    border-radius:19px
  }

  .hero h1{
    font-size:24px
  }

  .card{
    padding:18px
  }

  .card h2{
    font-size:19px
  }

  .message,
  .prayer{
    font-size:12px
  }

  .verse{
    font-size:14px
  }
}
</style>
</head>

<body>

<header>

  <div class="container nav">

    <a href="index.html" class="logo">

      <img
      src="https://files.gohministries.org/file_00000000f02c82088b7cf2676012b775.png"
      alt="GOH Ministries">

      <div>
        <div class="logo-title">
          GOH Ministries
        </div>

        <div class="logo-sub">
          Gate of Heaven Ministries
        </div>
      </div>

    </a>

    <a href="index.html" class="home">
      🏠 Home
    </a>

  </div>

</header>


<main>

<div class="container">

  <!-- DAILY DEVOTIONAL HEADER -->

  <div class="hero">

    <div class="hero-icon">
      🙏
    </div>

    <div class="label">
      DAILY DEVOTIONAL
    </div>

    <h1>
      Today's Devotional
    </h1>

    <div
    class="date"
    id="date">
      Loading...
    </div>

  </div>


  <!-- LANGUAGE -->

  <div class="language-card">

    <label>
      LANGUAGE
    </label>

    <select id="language">

      <option value="en">
        🇬🇧 English
      </option>

      <option value="ta">
        🇱🇰 தமிழ்
      </option>

      <option value="si">
        🇱🇰 සිංහල
      </option>

    </select>

  </div>


  <!-- DEVOTIONAL -->

  <div id="content">

    <div class="loading">
      📖 Loading today's devotional...
    </div>

  </div>


  <!-- SHARE -->

  <div class="share">

    <button id="shareBtn">
      📤 Share Today's Devotional
    </button>

  </div>

</div>

</main>


<footer>

  <strong>GOH Ministries</strong><br>

  Gate of Heaven Ministries<br>

  Daily Devotional • Bible • Prayer

</footer>


<script>

/* =========================================
   YOUR CLOUDFLARE WORKER URL
   ========================================= */

const API =
"https://YOUR-WORKER.workers.dev";


/* =========================================
   LANGUAGE
   ========================================= */

const languageSelect =
document.getElementById("language");

let language =
localStorage.getItem(
  "goh_devotional_language"
) || "en";

languageSelect.value = language;


/* =========================================
   LOAD DEVOTIONAL
   ========================================= */

async function loadDevotional(){

  const content =
  document.getElementById("content");

  content.innerHTML = `
    <div class="loading">
      📖 Loading today's devotional...
    </div>
  `;

  try{

    const response =
    await fetch(
      API +
      "/today?lang=" +
      encodeURIComponent(language),
      {
        cache:"no-store"
      }
    );

    const data =
    await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Today's devotional is not available."
      );

    }

    const d =
    data.devotional;


    /* DATE */

    document.getElementById("date")
      .textContent =
      formatDate(data.date);


    /* CONTENT */

    content.innerHTML = `

      <article class="card">

        <div class="card-label">
          TODAY'S MESSAGE
        </div>

        <h2>
          ${escapeHTML(d.title)}
        </h2>

        <div class="message">
          ${escapeHTML(d.message)}
        </div>

      </article>


      <article class="card verse-card">

        <div class="card-label">
          BIBLE VERSE
        </div>

        <div class="verse">
          “${escapeHTML(
            d.bible_verse || ""
          )}”
        </div>

        ${
          d.bible_reference
          ?
          `
          <div class="reference">
            ${escapeHTML(
              d.bible_reference
            )}
          </div>
          `
          :
          ""
        }

      </article>


      <article class="card prayer-card">

        <div class="card-label">
          TODAY'S PRAYER
        </div>

        <h2>
          🙏 Prayer
        </h2>

        <div class="prayer">
          ${escapeHTML(d.prayer)}
        </div>

      </article>

    `;

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="error">
        ⚠️ ${escapeHTML(
          error.message ||
          "Unable to load today's devotional."
        )}
      </div>
    `;

  }

}


/* =========================================
   FORMAT DATE
   ========================================= */

function formatDate(monthDay){

  const parts =
  monthDay.split("-");

  if(parts.length !== 2){
    return monthDay;
  }

  const month =
  Number(parts[0]);

  const day =
  Number(parts[1]);

  const date =
  new Date(
    2024,
    month - 1,
    day
  );

  return date.toLocaleDateString(
    "en-US",
    {
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================================
   HTML ESCAPE
   ========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   LANGUAGE CHANGE
   ========================================= */

languageSelect.addEventListener(
  "change",
  function(){

    language =
    this.value;

    localStorage.setItem(
      "goh_devotional_language",
      language
    );

    loadDevotional();

  }
);


/* =========================================
   SHARE
   ========================================= */

document
.getElementById("shareBtn")
.addEventListener(
  "click",
  async function(){

    const title =
    document.title;

    const text =
    "Today's Daily Devotional - GOH Ministries";

    const url =
    window.location.href;

    if(navigator.share){

      try{

        await navigator.share({
          title:title,
          text:text,
          url:url
        });

      }catch(e){}

    }else{

      try{

        await navigator.clipboard.writeText(
          url
        );

        this.textContent =
        "✓ Link Copied";

        setTimeout(
          () => {
            this.textContent =
            "📤 Share Today's Devotional";
          },
          1800
        );

      }catch(e){

        alert(url);

      }

    }

  }
);


/* =========================================
   START
   ========================================= */

loadDevotional();

</script>

</body>
</html>
