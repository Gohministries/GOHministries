<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Finance - Income</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:15px 18px}
.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.back{background:#fff;color:#155eef;border:0;border-radius:8px;padding:9px 13px;font-weight:bold}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:9px;font-size:14px}
textarea{min-height:75px;resize:vertical}
button{padding:11px 15px;border:0;border-radius:9px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer}
.save{width:100%;margin-top:16px}
.msg{display:none;padding:11px;border-radius:9px;margin-top:12px;font-size:13px}
.ok{display:block;background:#dcfce7;color:#166534}
.bad{display:block;background:#fee2e2;color:#991b1b}
.total{font-size:25px;font-weight:bold;margin-top:5px}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:13px;margin-top:10px}
.top{display:flex;justify-content:space-between;gap:10px}
.amount{font-weight:bold}
.meta{font-size:12px;color:#667085;margin-top:5px}
.delete{margin-top:10px;background:#dc2626}
@media(max-width:600px){.top{display:block}}
</style>
</head>

<body>

<header>
<div class="head">
<b>GOH Ministries Finance</b>
<button class="back"
onclick="location.href='finance-dashboard.html'">
Dashboard
</button>
</div>
</header>

<main>

<div class="card">
<h2>Income</h2>
<div class="meta">Total Income</div>
<div class="total" id="total">LKR 0.00</div>
</div>

<div class="card">

<h3>Record Income</h3>

<form id="form">

<label>Category</label>
<select id="category" required>
<option value="">Select category</option>
<option>Offering</option>
<option>Tithe</option>
<option>Donation</option>
<option>Special Offering</option>
<option>Other Income</option>
</select>

<label>Amount</label>
<input
id="amount"
type="number"
min="0.01"
step="0.01"
placeholder="0.00"
required
>

<label>Date</label>
<input id="date" type="date" required>

<label>Description</label>
<textarea
id="description"
placeholder="Optional description"></textarea>

<button class="save" id="save" type="submit">
Save Income
</button>

<div id="msg" class="msg"></div>

</form>

</div>

<div class="card">

<h3>Income Records</h3>

<div id="records">
Loading...
</div>

</div>

</main>

<script>

const API =
"https://goh-finance-data.createlk.workers.dev";

const KEY =
"goh_finance_token";


function token(){
return localStorage.getItem(KEY);
}


function auth(){
return {
"Content-Type":"application/json",
"Authorization":
"Bearer "+token()
};
}


function money(value){
return "LKR "+
Number(value||0).toLocaleString(
"en-LK",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);
}


function showMessage(text,ok=false){

const el =
document.getElementById("msg");

el.textContent=text;

el.className =
"msg "+(ok?"ok":"bad");
}


/* CHECK LOGIN */

async function checkLogin(){

const t=token();

if(!t){

location.href="admin-login.html";
return false;

}

try{

const r =
await fetch(
"https://goh-finance.createlk.workers.dev/api/income",
{
headers:{
"Authorization":"Bearer "+t
}
}
);

if(r.status===401){

localStorage.removeItem(KEY);

location.href="admin-login.html";
return false;

}

/*
Any other response means the token
was accepted. The page can continue.
*/

return true;

}catch(e){

showMessage(
"Unable to connect to Finance Data Worker."
);

return false;

}

}


/* LOAD INCOME */

async function loadIncome(){

try{

const r =
await fetch(
API+"/api/income",
{
headers:auth()
}
);

if(r.status===401){

localStorage.removeItem(KEY);

location.href="admin-login.html";
return;

}

const data =
await r.json();

if(!r.ok || !data.success){

throw new Error(
data.error ||
"Unable to load income"
);

}

const rows =
data.income || [];


let total=0;

rows.forEach(x=>{
total += Number(x.amount)||0;
});


document.getElementById("total")
.textContent=money(total);


const box =
document.getElementById("records");


if(!rows.length){

box.innerHTML =
'<div class="meta">No income records yet.</div>';

return;

}


box.innerHTML =
rows.map(x=>`

<div class="item">

<div class="top">

<div>
<b>${escapeHtml(x.category)}</b>

<div class="meta">
${escapeHtml(x.date)}
</div>
</div>

<div class="amount">
${money(x.amount)}
</div>

</div>

${
x.description
?
`<div class="meta">
${escapeHtml(x.description)}
</div>`
:""
}

<button
class="delete"
onclick="deleteIncome(${x.id})">
Delete
</button>

</div>

`).join("");


}catch(e){

document.getElementById("records")
.innerHTML =
'<div class="meta">'+
escapeHtml(e.message)+
'</div>';

}

}


/* ADD INCOME */

async function addIncome(e){

e.preventDefault();

const button =
document.getElementById("save");

button.disabled=true;
button.textContent="Saving...";


try{

const body={

category:
document.getElementById("category").value,

amount:
Number(
document.getElementById("amount").value
),

date:
document.getElementById("date").value,

description:
document.getElementById("description").value.trim()

};


const r =
await fetch(
API+"/api/income",
{
method:"POST",
headers:auth(),
body:JSON.stringify(body)
}
);


const data =
await r.json();


if(r.status===401){

localStorage.removeItem(KEY);

location.href="admin-login.html";
return;

}


if(!r.ok || !data.success){

throw new Error(
data.error ||
"Unable to save income"
);

}


showMessage(
"Income recorded successfully.",
true
);


document.getElementById("form")
.reset();


setToday();

await loadIncome();


}catch(e){

showMessage(e.message);

}finally{

button.disabled=false;
button.textContent="Save Income";

}

}


/* DELETE */

async function deleteIncome(id){

if(!confirm(
"Delete this income record?"
)) return;


try{

const r =
await fetch(
API+"/api/income/"+id,
{
method:"DELETE",
headers:auth()
}
);


const data =
await r.json();


if(r.status===401){

localStorage.removeItem(KEY);

location.href="admin-login.html";
return;

}


if(!r.ok || !data.success){

throw new Error(
data.error ||
"Unable to delete income"
);

}


await loadIncome();


}catch(e){

alert(e.message);

}

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* TODAY */

function setToday(){

document.getElementById("date")
.value =
new Date()
.toISOString()
.slice(0,10);

}


document.getElementById("form")
.addEventListener(
"submit",
addIncome
);


/* START */

(async()=>{

if(await checkLogin()){

setToday();

await loadIncome();

}

})();

</script>

</body>
</html>
