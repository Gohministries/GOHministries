<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Income</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:#155eef;
  color:#fff;
  padding:15px 18px
}
.head{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.back{
  color:#fff;
  text-decoration:none;
  font-weight:bold
}
main{
  max-width:900px;
  margin:auto;
  padding:18px
}
.card{
  background:#fff;
  padding:18px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0001
}
h2,h3{
  margin-top:0
}
label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  font-size:15px;
  background:#fff
}
textarea{
  min-height:90px;
  resize:vertical
}
button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer
}
.save{
  width:100%;
  margin-top:16px;
  background:#155eef;
  color:#fff
}
.save:disabled{
  opacity:.6;
  cursor:not-allowed
}
.small{
  font-size:13px;
  color:#667085
}
.total{
  font-size:28px;
  font-weight:bold;
  margin-top:7px
}
.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:14px;
  font-size:14px
}
.success{
  display:block;
  background:#ecfdf3;
  color:#027a48
}
.error{
  display:block;
  background:#fef3f2;
  color:#b42318
}
.filebox{
  border:1px dashed #98a2b3;
  padding:14px;
  border-radius:10px;
  background:#f8fafc
}
.record{
  border:1px solid #e4e7ec;
  border-radius:12px;
  padding:15px;
  margin-top:12px
}
.recordtop{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.amount{
  font-weight:bold;
  font-size:18px
}
.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold
}
.pending{
  background:#fff7ed;
  color:#c2410c
}
.approved{
  background:#ecfdf3;
  color:#027a48
}
.rejected{
  background:#fef2f2;
  color:#b42318
}
.receipt{
  display:inline-block;
  margin-top:10px;
  color:#155eef;
  font-weight:bold;
  text-decoration:none
}
.delete{
  background:#fff;
  color:#b42318;
  border:1px solid #fecdca;
  margin-top:10px
}
.empty{
  text-align:center;
  padding:25px;
  color:#667085
}
@media(max-width:600px){
  main{padding:12px}
  .card{padding:15px}
}
</style>
</head>

<body>

<header>
<div class="head">
  <a class="back" href="dashboard.html">← Dashboard</a>
  <b>GOH Ministries Finance</b>
</div>
</header>

<main>

<div id="message" class="message"></div>

<div class="card">
<h2>Income</h2>
<div class="small">Total Approved Income</div>
<div class="total" id="total">LKR 0.00</div>
</div>

<div class="card">

<h3>Record Income</h3>

<form id="incomeForm">

<label>Category</label>

<select id="category" name="category" required>
<option value="">Select category</option>
<option>Offering</option>
<option>Tithe</option>
<option>Donation</option>
<option>Mission Support</option>
<option>Building Fund</option>
<option>Special Offering</option>
<option>Other</option>
</select>

<label>Amount</label>

<input
 id="amount"
 name="amount"
 type="number"
 min="0.01"
 step="0.01"
 placeholder="0.00"
 required
>

<label>Date</label>

<input
 id="date"
 name="date"
 type="date"
 required
>

<label>Payment Method</label>

<select
 id="payment_method"
 name="payment_method"
 required
>
<option value="">Select payment method</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Cheque</option>
<option>Card</option>
<option>Online Payment</option>
<option>Other</option>
</select>

<label>Reference Number</label>

<input
 id="reference_number"
 name="reference_number"
 type="text"
 placeholder="Optional reference number"
>

<label>Description</label>

<textarea
 id="description"
 name="description"
 placeholder="Optional description"
></textarea>

<label>Receipt / Slip *</label>

<div class="filebox">

<input
 id="receipt"
 name="receipt"
 type="file"
 accept="image/jpeg,image/png,application/pdf"
 required
>

<div class="small" style="margin-top:7px">
JPG, PNG or PDF • Maximum 5MB
</div>

</div>

<button
 class="save"
 id="saveBtn"
 type="submit"
>
Save Income
</button>

</form>

</div>

<div class="card">

<h3>Income Records</h3>

<div id="records">
<div class="empty">
Loading income records...
</div>
</div>

</div>

</main>

<script>

const API=
"https://goh-finance-system.createlk.workers.dev";

const KEY=
"goh_finance_token";


function authHeaders(){

 return {
  "Authorization":
   "Bearer "+
   localStorage.getItem(KEY)
 };
}


function money(value){

 return "LKR "+
 Number(value||0).toLocaleString(
  "en-LK",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}


function escapeHtml(value){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function message(text,type){

 const box=
  document.getElementById(
   "message"
  );

 box.textContent=text;

 box.className=
  "message "+type;

}


function today(){

 const d=new Date();

 return d.getFullYear()+
 "-"+
 String(d.getMonth()+1)
  .padStart(2,"0")+
 "-"+
 String(d.getDate())
  .padStart(2,"0");

}


document.getElementById(
 "date"
).value=today();


async function checkLogin(){

 const token=
  localStorage.getItem(KEY);

 if(!token){

  location.href=
   "admin-login.html";

  return false;
 }

 try{

  const response=
   await fetch(
    API+"/api/me",
    {
     headers:
      authHeaders()
    }
   );

  const data=
   await response.json();

  if(
   !response.ok ||
   !data.success
  ){

   throw new Error();

  }

  return true;

 }catch(e){

  localStorage.removeItem(KEY);

  location.href=
   "admin-login.html";

  return false;

 }

}


async function loadIncome(){

 const box=
  document.getElementById(
   "records"
  );

 box.innerHTML=
  `<div class="empty">
    Loading income records...
   </div>`;

 try{

  const response=
   await fetch(
    API+"/api/income",
    {
     headers:
      authHeaders()
    }
   );

  const data=
   await response.json();

  if(response.status===401){

   localStorage.removeItem(KEY);

   location.href=
    "admin-login.html";

   return;

  }

  if(
   !response.ok ||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to load income"
   );

  }

  const list=
   data.income||[];

  let approvedTotal=0;

  list.forEach(item=>{

   if(
    String(
     item.status||
     "PENDING"
    ).toUpperCase()===
    "APPROVED"
   ){

    approvedTotal+=
     Number(item.amount)||0;

   }

  });

  document.getElementById(
   "total"
  ).textContent=
   money(approvedTotal);


  if(!list.length){

   box.innerHTML=
    `<div class="empty">
      No income records yet.
     </div>`;

   return;

  }


  box.innerHTML=
   list.map(item=>{

    const status=
     String(
      item.status||
      "PENDING"
     ).toUpperCase();

    let cls="pending";

    if(status==="APPROVED")
     cls="approved";

    if(status==="REJECTED")
     cls="rejected";


    const receipt=
     item.receipt_name
     ?
     `<a
       class="receipt"
       href="${API}/api/income/${item.id}/receipt"
       target="_blank"
       rel="noopener"
      >
       📎 View Receipt
      </a>`
     :
     "";


    const reason=
     status==="REJECTED" &&
     item.rejection_reason
     ?
     `<div
       class="small"
       style="margin-top:8px;color:#b42318"
      >
       Reason:
       ${escapeHtml(
        item.rejection_reason
       )}
      </div>`
     :
     "";


    return `
    <div class="record">

     <div class="recordtop">

      <div>

       <b>
        ${escapeHtml(
         item.category
        )}
       </b>

       <div class="small">
        Date:
        ${escapeHtml(
         item.date
        )}
       </div>

       <div class="small">
        Payment:
        ${escapeHtml(
         item.payment_method
        )}
       </div>

      </div>

      <div class="amount">
       ${money(item.amount)}
      </div>

     </div>

     <span class="status ${cls}">
      ${status}
     </span>

     ${
      item.description
      ?
      `<div
        class="small"
        style="margin-top:8px"
       >
        ${escapeHtml(
         item.description
        )}
       </div>`
      :
      ""
     }

     ${
      item.reference_number
      ?
      `<div
        class="small"
        style="margin-top:6px"
       >
        Reference:
        ${escapeHtml(
         item.reference_number
        )}
       </div>`
      :
      ""
     }

     ${reason}

     ${receipt}

     <br>

     <button
      class="delete"
      onclick="deleteIncome(${item.id})"
     >
      Delete
     </button>

    </div>
    `;

   }).join("");

 }catch(error){

  box.innerHTML=
   `<div class="empty">
     ${escapeHtml(
      error.message
     )}
    </div>`;

 }

}


document.getElementById(
 "incomeForm"
).addEventListener(
 "submit",
 async function(e){

  e.preventDefault();

  const button=
   document.getElementById(
    "saveBtn"
   );

  button.disabled=true;
  button.textContent=
   "Saving...";

  message(
   "",
   ""
  );

  try{

   const form=
    document.getElementById(
     "incomeForm"
    );

   const data=
    new FormData(form);


   const response=
    await fetch(
     API+"/api/income",
     {
      method:"POST",
      headers:
       authHeaders(),
      body:data
     }
    );


   const result=
    await response.json();


   if(response.status===401){

    localStorage.removeItem(KEY);

    location.href=
     "admin-login.html";

    return;

   }


   if(
    !response.ok ||
    !result.success
   ){

    throw new Error(
     result.error||
     "Unable to save income"
    );

   }


   message(
    "Income submitted successfully. It is now pending approval.",
    "success"
   );


   form.reset();

   document.getElementById(
    "date"
   ).value=today();


   await loadIncome();


  }catch(error){

   message(
    error.message||
    "Unable to save income",
    "error"
   );

  }finally{

   button.disabled=false;
   button.textContent=
    "Save Income";

  }

 }
);


async function deleteIncome(id){

 if(
  !confirm(
   "Delete this income record?"
  )
 ){
  return;
 }

 try{

  const response=
   await fetch(
    API+"/api/income/"+id,
    {
     method:"DELETE",
     headers:
      authHeaders()
    }
   );

  const data=
   await response.json();

  if(
   !response.ok ||
   !data.success
  ){

   throw new Error(
    data.error||
    "Unable to delete record"
   );

  }

  message(
   "Income record deleted.",
   "success"
  );

  await loadIncome();

 }catch(error){

  message(
   error.message||
   "Unable to delete record",
   "error"
  );

 }

}


(async function(){

 const ok=
  await checkLogin();

 if(ok){

  await loadIncome();

 }

})();

</script>

</body>
</html>
