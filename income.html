<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Income</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033
}

header{
 background:#155eef;
 color:#fff;
 padding:15px 18px
}

.head{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{font-weight:bold}

.logout{
 background:#fff;
 color:#155eef;
 border:0;
 border-radius:8px;
 padding:9px 13px;
 font-weight:bold;
 cursor:pointer
}

nav{
 max-width:1100px;
 margin:10px auto 0;
 display:flex;
 gap:8px;
 overflow:auto
}

nav a{
 background:#fff;
 color:#155eef;
 padding:8px 11px;
 border-radius:8px;
 text-decoration:none;
 font-size:12px;
 white-space:nowrap
}

main{
 max-width:1100px;
 margin:auto;
 padding:18px
}

.card{
 background:#fff;
 padding:18px;
 border-radius:14px;
 margin-bottom:16px;
 box-shadow:0 2px 12px #0001
}

h2,h3{margin-top:0}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:10px 0 6px
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #d5dbe5;
 border-radius:8px;
 font-size:14px;
 background:#fff;
 font-family:inherit
}

textarea{
 min-height:90px;
 resize:vertical
}

input:focus,
select:focus,
textarea:focus{
 outline:none;
 border-color:#155eef
}

button{
 border:0;
 border-radius:8px;
 padding:11px 15px;
 background:#155eef;
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.6;
 cursor:not-allowed
}

.submit{
 width:100%;
 margin-top:15px
}

.msg{
 display:none;
 padding:11px;
 border-radius:8px;
 margin-bottom:15px;
 font-size:13px
}

.ok{
 display:block;
 background:#dcfce7;
 color:#166534
}

.bad{
 display:block;
 background:#fee2e2;
 color:#991b1b
}

.small{
 font-size:13px;
 color:#667085
}

.hint{
 font-size:11px;
 color:#667085;
 margin-top:5px
}

.table{
 overflow:auto
}

table{
 width:100%;
 min-width:850px;
 border-collapse:collapse
}

th,td{
 padding:10px;
 border-bottom:1px solid #edf0f4;
 text-align:left;
 font-size:13px
}

th{
 background:#f8fafc;
 color:#667085
}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold
}

.pending{
 background:#fef3c7;
 color:#92400e
}

.approved{
 background:#dcfce7;
 color:#166534
}

.rejected{
 background:#fee2e2;
 color:#991b1b
}

.view{
 background:#475467;
 padding:7px 10px;
 font-size:12px
}

.empty{
 padding:20px;
 text-align:center;
 color:#667085
}

@media(max-width:700px){
 .grid{
  grid-template-columns:1fr
 }

 main{
  padding:12px
 }
}
</style>
</head>

<body>

<header>

<div class="head">
<div class="logo">GOH Ministries Finance</div>

<button class="logout" onclick="logout()">
Logout
</button>
</div>

<nav>
<a href="finance-dashboard.html">Dashboard</a>
<a href="income.html">Income</a>
<a href="expenses.html">Expenses</a>
<a href="donations.html">Donations</a>
<a href="approvals.html">Approvals</a>
<a href="receipts.html">Receipts</a>
<a href="reports.html">Reports</a>
<a href="admin.html">Administration</a>
</nav>

</header>


<main>

<div class="card">

<h2>Income</h2>

<div class="small">
Record ministry income with the supporting receipt or slip.
</div>

</div>


<div id="msg" class="msg"></div>


<div class="card">

<h3>Record Income</h3>

<form id="incomeForm">

<div class="grid">

<div>

<label>Category</label>

<select id="category" required>

<option value="">Select category</option>
<option value="Offering">Offering</option>
<option value="Tithe">Tithe</option>
<option value="Donation">Donation</option>
<option value="Special Offering">Special Offering</option>
<option value="Mission Support">Mission Support</option>
<option value="Building Fund">Building Fund</option>
<option value="Other">Other</option>

</select>

</div>


<div>

<label>Amount (LKR)</label>

<input
id="amount"
type="number"
min="0.01"
step="0.01"
placeholder="0.00"
required
>

</div>


<div>

<label>Date</label>

<input
id="date"
type="date"
required
>

</div>


<div>

<label>Payment Method</label>

<select id="payment_method" required>

<option value="">Select payment method</option>
<option value="Cash">Cash</option>
<option value="Bank Transfer">Bank Transfer</option>
<option value="Deposit">Bank Deposit</option>
<option value="Cheque">Cheque</option>
<option value="Other">Other</option>

</select>

</div>


<div>

<label>Reference Number</label>

<input
id="reference_number"
type="text"
placeholder="Optional"
>

</div>


<div>

<label>Receipt / Slip</label>

<input
id="receipt"
type="file"
accept="image/jpeg,image/png,application/pdf"
required
>

<div class="hint">
JPG, PNG or PDF. Maximum 5MB.
</div>

</div>

</div>


<label>Description</label>

<textarea
id="description"
placeholder="Optional details"
></textarea>


<button
id="submitBtn"
class="submit"
type="submit"
>
Submit Income
</button>

</form>

</div>


<div class="card">

<h3>Income Records</h3>

<div class="table">

<table>

<thead>

<tr>
<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th>Payment</th>
<th>Reference</th>
<th>Status</th>
<th>Receipt</th>
</tr>

</thead>

<tbody id="records">

<tr>
<td colspan="7" class="empty">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>


<script>

const API="https://goh-finance-system.createlk.workers.dev";
const KEY="goh_finance_token";


function authHeaders(){

return{
"Authorization":
"Bearer "+localStorage.getItem(KEY)
};

}


function jsonHeaders(){

return{
"Content-Type":"application/json",
"Authorization":
"Bearer "+localStorage.getItem(KEY)
};

}


function esc(v){

return String(v ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function money(v){

return Number(v || 0).toLocaleString(
"en-LK",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function show(text,ok=false){

const el=
document.getElementById("msg");

el.textContent=text;

el.className=
"msg "+(ok?"ok":"bad");

}


function today(){

const d=new Date();

const y=d.getFullYear();

const m=
String(d.getMonth()+1)
.padStart(2,"0");

const day=
String(d.getDate())
.padStart(2,"0");

return y+"-"+m+"-"+day;

}


document.getElementById("date").value=today();


async function checkLogin(){

const token=
localStorage.getItem(KEY);

if(!token){

location.href="admin-login.html";
return false;

}

try{

const r=await fetch(
API+"/api/me",
{
headers:authHeaders()
}
);

const d=await r.json();

if(!r.ok||!d.success){

throw new Error(
d.error||"Session expired."
);

}

return true;

}catch(e){

localStorage.removeItem(KEY);

location.href="admin-login.html";

return false;

}

}


async function loadRecords(){

const tbody=
document.getElementById("records");

try{

const r=await fetch(
API+"/api/income",
{
method:"GET",
headers:authHeaders()
}
);

const d=await r.json();

if(!r.ok||!d.success){

throw new Error(
d.error||"Unable to load income records."
);

}

const rows=d.income||[];

if(!rows.length){

tbody.innerHTML=`
<tr>
<td colspan="7" class="empty">
No income records found.
</td>
</tr>`;

return;

}

tbody.innerHTML=

rows.map(x=>{

let status=
String(x.status||"PENDING")
.toUpperCase();

let badge="pending";

if(status==="APPROVED")
badge="approved";

if(status==="REJECTED")
badge="rejected";

return`

<tr>

<td>${esc(x.date)}</td>

<td>${esc(x.category)}</td>

<td>
<b>LKR ${money(x.amount)}</b>
</td>

<td>${esc(x.payment_method)}</td>

<td>${esc(x.reference_number||"-")}</td>

<td>
<span class="badge ${badge}">
${esc(status)}
</span>
</td>

<td>

${
x.receipt_name
?
`<button
class="view"
onclick="viewReceipt(${Number(x.id)})">
View
</button>`
:
`<span class="small">None</span>`
}

</td>

</tr>

`;

}).join("");


}catch(e){

tbody.innerHTML=`
<tr>
<td colspan="7" class="empty">
${esc(e.message)}
</td>
</tr>`;

}

}


document.getElementById("incomeForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const btn=
document.getElementById("submitBtn");

const category=
document.getElementById("category")
.value;

const amount=
document.getElementById("amount")
.value;

const date=
document.getElementById("date")
.value;

const payment=
document.getElementById("payment_method")
.value;

const reference=
document.getElementById("reference_number")
.value.trim();

const description=
document.getElementById("description")
.value.trim();

const file=
document.getElementById("receipt")
.files[0];


if(!category){

show("Please select an income category.");
return;

}


if(!amount||Number(amount)<=0){

show("Please enter a valid amount.");
return;

}


if(!date){

show("Please select a date.");
return;

}


if(!payment){

show("Please select a payment method.");
return;

}


if(!file){

show("Receipt / slip is required.");
return;

}


if(file.size>5*1024*1024){

show("Receipt must be 5MB or smaller.");
return;

}


const allowed=[
"image/jpeg",
"image/png",
"application/pdf"
];


if(!allowed.includes(file.type)){

show("Only JPG, PNG or PDF files are allowed.");
return;

}


const formData=new FormData();

formData.append(
"category",
category
);

formData.append(
"amount",
amount
);

formData.append(
"date",
date
);

formData.append(
"payment_method",
payment
);

formData.append(
"reference_number",
reference
);

formData.append(
"description",
description
);

formData.append(
"receipt",
file
);


btn.disabled=true;
btn.textContent="Submitting...";


try{

const r=await fetch(
API+"/api/income",
{
method:"POST",
headers:authHeaders(),
body:formData
}
);


const d=await r.json();


if(!r.ok||!d.success){

throw new Error(
d.error||"Unable to submit income."
);

}


show(
"Income submitted successfully and is waiting for approval.",
true
);


e.target.reset();

document.getElementById("date")
.value=today();


await loadRecords();


}catch(err){

show(
err.message||
"Unable to submit income."
);

}finally{

btn.disabled=false;
btn.textContent="Submit Income";

}

});


async function viewReceipt(id){

try{

const r=await fetch(
API+"/api/income/"+id+"/receipt",
{
method:"GET",
headers:authHeaders()
}
);


if(!r.ok){

let d={};

try{
d=await r.json();
}catch{}

throw new Error(
d.error||"Unable to open receipt."
);

}


const blob=
await r.blob();

const url=
URL.createObjectURL(blob);


window.open(
url,
"_blank",
"noopener,noreferrer"
);


setTimeout(
()=>{
URL.revokeObjectURL(url);
},
60000
);


}catch(e){

alert(e.message);

}

}


async function logout(){

try{

await fetch(
API+"/api/logout",
{
method:"POST",
headers:authHeaders()
}
);

}catch(e){}


localStorage.removeItem(KEY);

location.href="admin-login.html";

}


checkLogin().then(ok=>{

if(ok){

loadRecords();

}

});

</script>

</body>
</html>
