<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Income</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:15px 18px}
.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logout{background:#fff;color:#155eef;border:0;border-radius:8px;padding:9px 13px;font-weight:bold;cursor:pointer}
nav{max-width:1050px;margin:10px auto 0;display:flex;gap:8px;overflow:auto}
nav a{background:#fff;color:#155eef;padding:8px 11px;border-radius:8px;text-decoration:none;font-size:12px;white-space:nowrap}
main{max-width:1050px;margin:auto;padding:18px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:bold;margin:9px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:8px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer}
form button{width:100%;margin-top:15px}
button:disabled{opacity:.6}
.msg{display:none;padding:11px;border-radius:8px;margin-bottom:12px;font-size:13px}
.ok{display:block;background:#dcfce7;color:#166534}
.bad{display:block;background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#667085}
.hint{font-size:11px;color:#667085;margin-top:5px}
.table{overflow:auto}
table{width:100%;min-width:800px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}
th{background:#f8fafc;color:#667085}
.status{font-weight:bold}
.pending{color:#b45309}
.approved{color:#15803d}
.rejected{color:#dc2626}
.view{background:#475467;padding:7px 10px;font-size:12px}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
main{padding:12px}
}
</style>
</head>

<body>

<header>
<div class="head">
<b>GOH Ministries Finance</b>
<button class="logout" onclick="logout()">Logout</button>
</div>

<nav>
<a href="finance-dashboard.html">Dashboard</a>
<a href="income.html">Income</a>
<a href="expenses.html">Expenses</a>
<a href="donations.html">Donations</a>
<a href="receipts.html">Receipts</a>
<a href="reports.html">Reports</a>
<a href="admin.html">Administration</a>
</nav>
</header>

<main>

<div class="card">
<h2>Income</h2>
<div class="small">Record ministry income with the supporting receipt or slip.</div>
</div>

<div class="card">

<div id="msg" class="msg"></div>

<form id="form">

<div class="grid">

<div>
<label>Category</label>
<select id="category" required>
<option value="">Select category</option>
<option>Offering</option>
<option>Tithe</option>
<option>Donation</option>
<option>Church Fund</option>
<option>Building Fund</option>
<option>Mission Fund</option>
<option>Other</option>
</select>
</div>

<div>
<label>Amount (LKR)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
</div>

<div>
<label>Date</label>
<input id="date" type="date" required>
</div>

<div>
<label>Payment Method</label>
<select id="payment" required>
<option value="">Select method</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Cheque</option>
<option>Online Payment</option>
<option>Other</option>
</select>
</div>

<div>
<label>Reference Number</label>
<input id="reference" type="text" placeholder="Optional">
</div>

<div>
<label>Receipt / Slip</label>
<input id="receipt" type="file" accept="image/jpeg,image/png,application/pdf" required>
<div class="hint">JPG, PNG or PDF. Maximum 5MB.</div>
</div>

</div>

<label>Description</label>
<textarea id="description" placeholder="Optional details"></textarea>

<button id="save" type="submit">Submit Income</button>

</form>
</div>

<div class="card">

<h3>Income Records</h3>

<div class="table">

<table>

<thead>
<tr>
<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th>Payment</th>
<th>Status</th>
<th>Receipt</th>
</tr>
</thead>

<tbody id="rows">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</div>

</main>

<script>

const API="https://goh-finance.createlk.workers.dev";
const KEY="goh_finance_token";

function auth(){
 return{
  "Authorization":"Bearer "+localStorage.getItem(KEY)
 };
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function money(v){
 return "LKR "+Number(v||0).toLocaleString(
  "en-LK",
  {minimumFractionDigits:2,maximumFractionDigits:2}
 );
}

function show(text,ok=false){
 const m=document.getElementById("msg");
 m.textContent=text;
 m.className="msg "+(ok?"ok":"bad");
}

document.getElementById("date").value=
 new Date().toISOString().slice(0,10);

async function check(){

 const t=localStorage.getItem(KEY);

 if(!t){
  location.href="admin-login.html";
  return false;
 }

 try{

  const r=await fetch(
   API+"/api/me",
   {headers:auth()}
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error();

  return true;

 }catch{

  localStorage.removeItem(KEY);
  location.href="admin-login.html";
  return false;

 }

}

document.getElementById("form").addEventListener(
 "submit",
 async e=>{

  e.preventDefault();

  const btn=document.getElementById("save");
  const file=document.getElementById("receipt").files[0];

  if(!file){
   show("Receipt / slip is required.");
   return;
  }

  if(file.size>5242880){
   show("Receipt must be 5MB or smaller.");
   return;
  }

  const allowed=[
   "image/jpeg",
   "image/png",
   "application/pdf"
  ];

  if(!allowed.includes(file.type)){
   show("Only JPG, PNG or PDF files are allowed.");
   return;
  }

  const fd=new FormData();

  fd.append(
   "category",
   document.getElementById("category").value
  );

  fd.append(
   "amount",
   document.getElementById("amount").value
  );

  fd.append(
   "date",
   document.getElementById("date").value
  );

  fd.append(
   "payment_method",
   document.getElementById("payment").value
  );

  fd.append(
   "reference_number",
   document.getElementById("reference").value
  );

  fd.append(
   "description",
   document.getElementById("description").value
  );

  fd.append("receipt",file);

  btn.disabled=true;
  btn.textContent="Submitting...";

  try{

   const r=await fetch(
    API+"/api/income",
    {
     method:"POST",
     headers:auth(),
     body:fd
    }
   );

   const d=await r.json();

   if(!r.ok||!d.success)
    throw Error(
     d.error||"Unable to submit income."
    );

   show(
    "Income submitted successfully. Waiting for approval.",
    true
   );

   e.target.reset();

   document.getElementById("date").value=
    new Date().toISOString().slice(0,10);

   await load();

  }catch(err){

   show(err.message);

  }finally{

   btn.disabled=false;
   btn.textContent="Submit Income";

  }

 });

async function load(){

 try{

  const r=await fetch(
   API+"/api/income",
   {headers:auth()}
  );

  const d=await r.json();

  if(!r.ok||!d.success)
   throw Error(
    d.error||"Unable to load income."
   );

  const rows=d.income||[];

  document.getElementById("rows").innerHTML=
   rows.map(x=>{

    const status=String(
     x.status||""
    ).toLowerCase();

    return `
    <tr>
      <td>${esc(x.date)}</td>
      <td>${esc(x.category)}</td>
      <td>${money(x.amount)}</td>
      <td>${esc(x.payment_method)}</td>
      <td>
       <span class="status ${esc(status)}">
        ${esc(x.status)}
       </span>
      </td>
      <td>
       <button
        class="view"
        onclick="viewReceipt(${Number(x.id)})">
        View
       </button>
      </td>
    </tr>
    `;

   }).join("")||

   `<tr>
    <td colspan="6">No income records found.</td>
   </tr>`;

 }catch(e){

  document.getElementById("rows").innerHTML=
   `<tr>
    <td colspan="6">${esc(e.message)}</td>
   </tr>`;

 }

}

async function viewReceipt(id){

 try{

  const r=await fetch(
   API+"/api/income/"+id+"/receipt",
   {headers:auth()}
  );

  if(!r.ok){
   let d={};
   try{d=await r.json()}catch{}
   throw Error(
    d.error||"Unable to open receipt."
   );
  }

  const blob=await r.blob();
  const url=URL.createObjectURL(blob);

  window.open(url,"_blank");

  setTimeout(
   ()=>URL.revokeObjectURL(url),
   60000
  );

 }catch(e){

  alert(e.message);

 }

}

async function logout(){

 try{

  await fetch(
   API+"/api/logout",
   {
    method:"POST",
    headers:auth()
   }
  );

 }catch{}

 localStorage.removeItem(KEY);
 location.href="admin-login.html";

}

check().then(ok=>{
 if(ok)load();
});

</script>

</body>
</html>
