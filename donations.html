<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>GOH Ministries Finance - Donations</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#155eef;color:#fff;padding:15px 18px}
.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logout{background:#fff;color:#155eef;border:0;border-radius:8px;padding:9px 13px;font-weight:bold;cursor:pointer}
nav{max-width:1050px;margin:10px auto 0;display:flex;gap:8px;overflow:auto}
nav a{background:#fff;color:#155eef;padding:8px 11px;border-radius:8px;text-decoration:none;font-size:12px;white-space:nowrap}
main{max-width:1050px;margin:auto;padding:18px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:bold;margin:9px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:8px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer}
form button{width:100%;margin-top:15px}
button:disabled{opacity:.6}
.danger{background:#dc2626}
.success{background:#16a34a}
.msg{display:none;padding:11px;border-radius:8px;margin-bottom:12px;font-size:13px}
.ok{display:block;background:#dcfce7;color:#166534}
.bad{display:block;background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#667085}
.hint{font-size:11px;color:#667085;margin-top:5px}
.table{overflow:auto}
table{width:100%;min-width:850px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}
th{background:#f8fafc;color:#667085}
.status{font-weight:bold}
.pending{color:#b45309}
.approved{color:#15803d}
.rejected{color:#dc2626}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
main{padding:12px}
}
</style>
</head>

<body>

<header>
<div class="head">
<b>GOH Ministries Finance</b>
<button class="logout" onclick="logout()">Logout</button>
</div>

<nav>
<a href="finance-dashboard.html">Dashboard</a>
<a href="income.html">Income</a>
<a href="expenses.html">Expenses</a>
<a href="donations.html">Donations</a>
<a href="receipts.html">Receipts</a>
<a href="reports.html">Reports</a>
<a href="admin.html">Administration</a>
</nav>
</header>

<main>

<div class="card">
<h2>Donations</h2>
<div class="small">
Record donations with the supporting receipt or payment slip.
</div>
</div>

<div class="card">

<h3>Add Donation</h3>

<div id="msg" class="msg"></div>

<form id="form">

<div class="grid">

<div>
<label>Donor Name</label>
<input id="donor_name" type="text" placeholder="Donor name">
</div>

<div>
<label>Amount</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
</div>

<div>
<label>Date</label>
<input id="date" type="date" required>
</div>

<div>
<label>Payment Method</label>
<select id="payment_method" required>
<option value="">Select payment method</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Deposit</option>
<option>Cheque</option>
<option>Online</option>
<option>Other</option>
</select>
</div>

<div>
<label>Reference Number</label>
<input id="reference_number" type="text" placeholder="Optional">
</div>

<div>
<label>Receipt / Payment Slip</label>
<input
id="receipt"
type="file"
accept="image/jpeg,image/png,application/pdf"
required>
<div class="hint">JPG, PNG or PDF. Maximum 5MB.</div>
</div>

</div>

<label>Description</label>
<textarea id="description" placeholder="Optional details"></textarea>

<button id="saveBtn" type="submit">
Save Donation
</button>

</form>
</div>

<div class="card">

<h3>Donation Records</h3>

<div class="table">

<table>
<thead>
<tr>
<th>Date</th>
<th>Donor</th>
<th>Amount</th>
<th>Payment</th>
<th>Reference</th>
<th>Status</th>
<th>Receipt</th>
</tr>
</thead>

<tbody id="records">
<tr>
<td colspan="7">Loading...</td>
</tr>
</tbody>

</table>

</div>
</div>

</main>

<script>

const API="https://goh-finance.createlk.workers.dev";
const KEY="goh_finance_token";

function headers(){
return{
"Authorization":"Bearer "+localStorage.getItem(KEY)
};
}

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function show(text,ok=false){
const x=document.getElementById("msg");
x.textContent=text;
x.className="msg "+(ok?"ok":"bad");
}

async function check(){

const token=localStorage.getItem(KEY);

if(!token){
location.href="admin-login.html";
return false;
}

try{

const r=await fetch(
API+"/api/me",
{headers:headers()}
);

const d=await r.json();

if(!r.ok||!d.success)throw Error();

return true;

}catch(e){

localStorage.removeItem(KEY);
location.href="admin-login.html";
return false;

}

}

function money(v){
return Number(v||0).toLocaleString(
"en-LK",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);
}

function receiptUrl(id){
return API+"/api/donations/"+id+"/receipt";
}

async function load(){

try{

const r=await fetch(
API+"/api/donations",
{headers:headers()}
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Unable to load donations");

const rows=d.donations||[];

document.getElementById("records").innerHTML=

rows.map(x=>{

const s=String(x.status||"PENDING").toLowerCase();

return `
<tr>

<td>${esc(x.date)}</td>

<td>${esc(x.donor_name||"-")}</td>

<td>LKR ${money(x.amount)}</td>

<td>${esc(x.payment_method)}</td>

<td>${esc(x.reference_number||"-")}</td>

<td>
<span class="status ${s}">
${esc(x.status)}
</span>
</td>

<td>
<button onclick="viewReceipt(${Number(x.id)})">
View
</button>
</td>

</tr>
`;

}).join("")||

`<tr>
<td colspan="7">No donation records found.</td>
</tr>`;

}catch(e){

document.getElementById("records").innerHTML=
`<tr>
<td colspan="7">${esc(e.message)}</td>
</tr>`;

}

}

function viewReceipt(id){

const token=localStorage.getItem(KEY);

const url=
receiptUrl(id)+
"?token="+encodeURIComponent(token);

window.open(url,"_blank");

}

document.getElementById("form")
.addEventListener("submit",async e=>{

e.preventDefault();

const btn=document.getElementById("saveBtn");

const file=
document.getElementById("receipt").files[0];

if(!file){
show("Receipt / payment slip is required.");
return;
}

if(file.size>5242880){
show("Receipt must be 5MB or smaller.");
return;
}

const allowed=[
"image/jpeg",
"image/png",
"application/pdf"
];

if(!allowed.includes(file.type)){
show("Only JPG, PNG or PDF files are allowed.");
return;
}

const fd=new FormData();

fd.append(
"donor_name",
document.getElementById("donor_name").value.trim()
);

fd.append(
"amount",
document.getElementById("amount").value
);

fd.append(
"date",
document.getElementById("date").value
);

fd.append(
"payment_method",
document.getElementById("payment_method").value
);

fd.append(
"reference_number",
document.getElementById("reference_number").value.trim()
);

fd.append(
"description",
document.getElementById("description").value.trim()
);

fd.append("receipt",file);

btn.disabled=true;
btn.textContent="Saving...";

try{

const r=await fetch(
API+"/api/donations",
{
method:"POST",
headers:{
"Authorization":
"Bearer "+localStorage.getItem(KEY)
},
body:fd
}
);

const d=await r.json();

if(!r.ok||!d.success)
throw Error(d.error||"Unable to save donation");

show(
"Donation submitted successfully. Waiting for approval.",
true
);

e.target.reset();

document.getElementById("date").value=
new Date().toISOString().slice(0,10);

await load();

}catch(err){

show(err.message);

}finally{

btn.disabled=false;
btn.textContent="Save Donation";

}

});

async function logout(){

try{

await fetch(
API+"/api/logout",
{
method:"POST",
headers:headers()
}
);

}catch(e){}

localStorage.removeItem(KEY);
location.href="admin-login.html";

}

document.getElementById("date").value=
new Date().toISOString().slice(0,10);

check().then(ok=>{
if(ok)load();
});

</script>

</body>
</html>
